<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AutoGenius Alimentação — Demonstração</title>
</head>
<body style="margin:0;">
<style>
  .ag-alimentacao *{box-sizing:border-box;}
  .ag-alimentacao {
    --primary: #D6244B;
    --primary-dark: #9F1239;
    --primary-light: #FB7185;
    --primary-soft: #FFE9EE;
    --primary-tint: rgba(214,36,75,.45);
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e6e8ec;
    --text: #14161a;
    --text-dim: #6b7280;
    --text-faint: #9aa0aa;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,20,24,.04), 0 8px 24px -12px rgba(16,20,24,.10);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .ag-alimentacao { width:100%; }
  .ag-alimentacao .app { display:flex; height:100vh; min-height:640px; width:100%; overflow:hidden; background:var(--bg);}
  .ag-alimentacao button { font-family:inherit; cursor:pointer; }
  .ag-alimentacao input, .ag-alimentacao textarea { font-family:inherit; }

  /* ---------- Top demo banner ---------- */

  /* ---------- Sidebar ---------- */
  .ag-alimentacao .sidebar{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-alimentacao .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;}
  .ag-alimentacao .brand-mark{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1px var(--border);}
  .ag-alimentacao .brand-mark img{width:26px;height:26px;object-fit:contain;}
  .ag-alimentacao .brand-text{line-height:1.15;}
  .ag-alimentacao .brand-text .name{font-weight:700;font-size:15.5px;color:var(--text);}
  .ag-alimentacao .brand-text .tag{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--primary-dark);background:var(--primary-soft);padding:1px 6px;border-radius:4px;display:inline-block;margin-top:2px;}
  .ag-alimentacao .side-search{margin:2px 12px 10px;position:relative;}
  .ag-alimentacao .side-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;color:var(--text);outline:none;}
  .ag-alimentacao .side-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-alimentacao .side-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-alimentacao .side-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--text-faint);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}
  .ag-alimentacao .nav{flex:1;overflow-y:auto;padding:2px 10px 10px;}
  .ag-alimentacao .nav-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;font-size:13.5px;color:var(--text-dim);cursor:pointer;user-select:none;font-weight:500;margin-bottom:0;border:none;background:transparent;width:100%;text-align:left;}
  .ag-alimentacao .nav-item .ic{width:16px;height:16px;flex:none;font-size:13px;opacity:.95;display:flex;align-items:center;justify-content:center;}
  .ag-alimentacao .nav-item .nvic{width:16px;height:16px;display:block;}
  .ag-alimentacao .nav-item:hover{background:var(--bg);color:var(--text);}
  .ag-alimentacao .nav-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600;}
  .ag-alimentacao .nav-item .count{margin-left:auto;font-size:11px;color:var(--text-faint);}
  .ag-alimentacao .nav-divider{height:1px;background:var(--border);margin:8px 4px;}
  .ag-alimentacao .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--text-faint);text-transform:uppercase;padding:10px 9px 3px;}
  .ag-alimentacao .tag-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .ag-alimentacao .chev{display:inline-block;width:11px;flex:none;font-size:10px;color:var(--text-faint);transition:transform .15s;transform:rotate(0deg);text-align:center;}
  .ag-alimentacao .chev.open{transform:rotate(90deg);}
  .ag-alimentacao .chev-spacer{width:11px;flex:none;display:inline-block;}
  .ag-alimentacao .nav-children{display:flex;flex-direction:column;}
  .ag-alimentacao .sidebar-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:9px;}
  .ag-alimentacao .avatar-sq{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;}
  .ag-alimentacao .foot-text{line-height:1.2;overflow:hidden;}
  .ag-alimentacao .foot-text .n{font-size:12.5px;font-weight:600;white-space:nowrap;}
  .ag-alimentacao .foot-text .e{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- List column ---------- */
  .ag-alimentacao .list-col{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-alimentacao .list-head{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .ag-alimentacao .list-head h1{font-size:17px;font-weight:700;margin:0;}
  .ag-alimentacao .list-head .tools{display:flex;gap:4px;}
  .ag-alimentacao .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .ag-alimentacao .icon-btn:hover{background:var(--bg);}
  .ag-alimentacao .icon-btn svg{width:14px;height:14px;}
  .ag-alimentacao .list-search{margin:2px 16px 10px;position:relative;}
  .ag-alimentacao .list-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;outline:none;}
  .ag-alimentacao .list-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-alimentacao .list-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-alimentacao .tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;}
  .ag-alimentacao .tabs::-webkit-scrollbar{display:none;}
  .ag-alimentacao .tab-chip{flex:none;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-dim);white-space:nowrap;}
  .ag-alimentacao .tab-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-alimentacao .conv-scroll{flex:1;overflow-y:auto;border-top:1px solid var(--border);}
  .ag-alimentacao .conv-item{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);position:relative;}
  .ag-alimentacao .conv-item:hover{background:var(--bg);}
  .ag-alimentacao .conv-item.active{background:var(--primary-soft);}
  .ag-alimentacao .conv-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);}
  .ag-alimentacao .conv-ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-alimentacao .conv-body{flex:1;min-width:0;}
  .ag-alimentacao .conv-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
  .ag-alimentacao .conv-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ag-alimentacao .conv-time{font-size:11px;color:var(--text-faint);flex:none;}
  .ag-alimentacao .conv-prev{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .ag-alimentacao .conv-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .ag-alimentacao .mini-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--text-dim);}
  .ag-alimentacao .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;margin-top:3px;}
  .ag-alimentacao .resolved-pill{font-size:10px;font-weight:700;color:#16794e;background:#e6f7ee;padding:1px 6px;border-radius:5px;}
  .ag-alimentacao .list-foot{padding:12px;text-align:center;font-size:12px;color:var(--text-faint);}

  /* ---------- Chat panel ---------- */
  .ag-alimentacao .chat-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--bg);}
  .ag-alimentacao .chat-head{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;}
  .ag-alimentacao .chat-head-row{display:flex;align-items:center;gap:10px;}
  .ag-alimentacao .chat-ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none;}
  .ag-alimentacao .chat-name{font-size:15px;font-weight:700;}
  .ag-alimentacao .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-alimentacao .badge.status-open{background:#fff2df;color:#9a5b00;}
  .ag-alimentacao .badge.status-resolved{background:#e6f7ee;color:#16794e;}
  .ag-alimentacao .chat-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .ag-alimentacao .btn{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
  .ag-alimentacao .btn:hover{background:var(--bg);}
  .ag-alimentacao .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-alimentacao .btn.primary:hover{background:var(--primary-dark);}
  .ag-alimentacao .btn.ghost{border-color:transparent;background:transparent;}
  .ag-alimentacao .chat-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .ag-alimentacao .meta-chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);border:1px solid var(--border);}
  .ag-alimentacao .meta-chip.strong{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent;}
  .ag-alimentacao .chat-scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .ag-alimentacao .chat-scroll > *{flex:0 0 auto;}
  .ag-alimentacao .day-sep{align-self:center;font-size:11px;color:var(--text-faint);background:#eef0f3;padding:3px 10px;border-radius:999px;margin:4px 0 8px;}
  .ag-alimentacao .msg-row{display:flex;max-width:70%;}
  .ag-alimentacao .msg-row.in{align-self:flex-start;}
  .ag-alimentacao .msg-row.out{align-self:flex-end;flex-direction:row-reverse;}
  .ag-alimentacao .msg-bubble{padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.48;box-shadow:var(--shadow);}
  .ag-alimentacao .msg-row.in .msg-bubble{background:#fff;border-bottom-left-radius:4px;color:var(--text);}
  .ag-alimentacao .msg-row.out .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .ag-alimentacao .msg-time{font-size:10.5px;color:var(--text-faint);margin-top:3px;display:flex;gap:4px;align-items:center;}
  .ag-alimentacao .msg-row.out .msg-time{justify-content:flex-end;}
  .ag-alimentacao .msg-wrap{display:flex;flex-direction:column;}
  .ag-alimentacao .msg-row.out .msg-wrap{align-items:flex-end;}
  .ag-alimentacao .cards-row{display:flex;gap:10px;overflow-x:auto;align-self:flex-end;max-width:78%;padding-bottom:4px;flex-wrap:wrap;justify-content:flex-end;}
  .ag-alimentacao .cards-label{width:100%;text-align:right;font-size:11px;font-weight:600;color:var(--text-faint);margin-bottom:1px;}
  .ag-alimentacao .item-card{flex:none;width:172px;background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);}
  .ag-alimentacao .item-card .thumb{height:92px;background:linear-gradient(140deg,#f7f8fa,#eceef2);display:flex;align-items:center;justify-content:center;font-size:24px;border-bottom:1px solid var(--border);padding:6px 8px;}
  .ag-alimentacao .item-card .ic-body{padding:9px 10px;}
  .ag-alimentacao .item-card .price{font-size:13px;font-weight:700;}
  .ag-alimentacao .item-card .sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
  .ag-alimentacao .item-card .loc{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .ag-alimentacao .msg-ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none;align-self:flex-end;margin-bottom:17px;}
  .ag-alimentacao .msg-row.in .msg-ava{margin-right:8px;}
  .ag-alimentacao .msg-row.out .msg-ava{margin-left:8px;background:var(--primary-dark);}
  .ag-alimentacao .note-row{align-self:center;max-width:76%;background:#fffaf0;border:1px dashed #e3c88f;border-radius:10px;padding:8px 13px;font-size:12px;color:#8a6415;line-height:1.45;}
  .ag-alimentacao .note-row b{font-weight:700;}
  .ag-alimentacao .sys-row{align-self:center;font-size:11.5px;color:var(--text-faint);background:#eef0f3;padding:4px 12px;border-radius:999px;}
  .ag-alimentacao .typing{align-self:flex-start;display:flex;gap:4px;background:#fff;padding:11px 14px;border-radius:14px;border-bottom-left-radius:4px;box-shadow:var(--shadow);}
  .ag-alimentacao .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:blink 1.2s infinite ease-in-out;}
  .ag-alimentacao .typing span:nth-child(2){animation-delay:.15s;}
  .ag-alimentacao .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .ag-alimentacao .quick-row{display:flex;gap:8px;padding:10px 20px 0;flex-wrap:wrap;}
  .ag-alimentacao .quick-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--primary-dark);}
  .ag-alimentacao .quick-chip:hover{background:var(--primary-soft);}
  .ag-alimentacao .composer{background:var(--panel);border-top:1px solid var(--border);padding:10px 20px 14px;}
  .ag-alimentacao .composer textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;resize:none;min-height:44px;max-height:110px;outline:none;font-family:inherit;}
  .ag-alimentacao .composer textarea:focus{border-color:var(--primary);}
  .ag-alimentacao .composer-bottom{display:flex;align-items:center;margin-top:8px;gap:6px;}
  .ag-alimentacao .composer-icons{display:flex;gap:4px;}
  .ag-alimentacao .composer-icons .icon-btn{border-color:transparent;}
  .ag-alimentacao .send-btn{margin-left:auto;background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;}
  .ag-alimentacao .send-btn:hover{background:var(--primary-dark);}
  .ag-alimentacao .hint{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .ag-alimentacao .empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-faint);gap:8px;}
  .ag-alimentacao .empty-chat .em-ic{font-size:34px;}

  /* ---------- Full-width views (contacts / agenda / placeholder) ---------- */
  .ag-alimentacao .full-view{flex:1;display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden;}
  .ag-alimentacao .full-head{padding:20px 26px 14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--border);}
  .ag-alimentacao .full-head h1{font-size:18px;font-weight:700;margin:0;}
  .ag-alimentacao .full-head .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .ag-alimentacao .full-search{margin-left:auto;position:relative;width:230px;}
  .ag-alimentacao .full-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;}
  .ag-alimentacao .full-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-alimentacao .full-body{flex:1;overflow:auto;padding:16px 22px;}

  /* ---- contact cards + pagination ---- */
  .ag-alimentacao .contact-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-bottom:9px;position:relative;}
  .ag-alimentacao .contact-card:hover{border-color:var(--primary-light);}
  .ag-alimentacao .cc-ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-alimentacao .cc-body{flex:1;min-width:0;}
  .ag-alimentacao .cc-name{font-size:13.5px;font-weight:700;}
  .ag-alimentacao .cc-sub{font-size:12px;color:var(--text-dim);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .ag-alimentacao .cc-sub .lk{color:var(--primary-dark);font-weight:600;cursor:pointer;}
  .ag-alimentacao .cc-sub .lk:hover{text-decoration:underline;}
  .ag-alimentacao .cc-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);flex:none;display:flex;align-items:center;gap:5px;}
  .ag-alimentacao .cc-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex:none;}
  .ag-alimentacao .cc-menu-btn:hover{background:var(--bg);}
  .ag-alimentacao .cc-dropdown{position:absolute;right:14px;top:46px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);z-index:10;overflow:hidden;min-width:170px;}
  .ag-alimentacao .cc-dropdown button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12.5px;background:#fff;border:none;color:var(--text);}
  .ag-alimentacao .cc-dropdown button:hover{background:var(--bg);}
  .ag-alimentacao .filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .ag-alimentacao .filter-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
    padding:6px 8px 6px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-alimentacao .filter-chip button{border:none;background:rgba(0,0,0,.08);color:inherit;width:18px;height:18px;
    border-radius:50%;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .ag-alimentacao .filter-chip button:hover{background:rgba(0,0,0,.18);}
  .ag-alimentacao .filter-count{font-size:12px;color:var(--text-faint);font-weight:600;}
  .ag-alimentacao .empty-list{text-align:center;padding:44px 20px;background:#fff;border:1px solid var(--border);
    border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ag-alimentacao .empty-list .el-ic{font-size:26px;opacity:.5;}
  .ag-alimentacao .empty-list .el-t{font-size:14px;font-weight:700;}
  .ag-alimentacao .empty-list .el-s{font-size:12.5px;color:var(--text-faint);max-width:340px;line-height:1.5;}
  .ag-alimentacao .empty-list .btn{margin-top:8px;}
  .ag-alimentacao .pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 4px;font-size:12.5px;color:var(--text-faint);}
  .ag-alimentacao .pg-controls{display:flex;align-items:center;gap:4px;}
  .ag-alimentacao .pg-btn{width:27px;height:27px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:12px;}
  .ag-alimentacao .pg-btn:hover:not(:disabled){background:var(--bg);}
  .ag-alimentacao .pg-btn:disabled{opacity:.4;cursor:default;}
  .ag-alimentacao .pg-current{font-size:12.5px;font-weight:600;color:var(--text);padding:0 6px;}

  /* ---- inventory grid ---- */
  .ag-alimentacao .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:14px;}
  .ag-alimentacao .inv-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .ag-alimentacao .inv-thumb{height:104px;background:linear-gradient(140deg,#f7f8fa 0%,#eceef2 100%);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;border-bottom:1px solid var(--border);}
  .ag-alimentacao .inv-thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 120%, var(--primary-soft) 0%, transparent 62%);}
  .ag-alimentacao .inv-thumb > span.em{position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(16,20,24,.16));}
  .ag-alimentacao .inv-card.sold{opacity:.62;}
  .ag-alimentacao .inv-card.sold .inv-thumb > span.em{filter:grayscale(1) drop-shadow(0 3px 6px rgba(16,20,24,.12));}
  .ag-alimentacao .inv-thumb .inv-status{position:absolute;z-index:2;top:8px;right:8px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.92);}
  .ag-alimentacao .inv-body{padding:11px 12px 12px;}
  .ag-alimentacao .inv-title{font-size:13.5px;font-weight:700;}
  .ag-alimentacao .inv-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-alimentacao .inv-price{font-size:14.5px;font-weight:800;color:var(--primary-dark);margin-top:7px;}
  .ag-alimentacao .inv-actions{display:flex;gap:6px;margin-top:9px;}
  .ag-alimentacao .inv-actions .btn{flex:1;justify-content:center;padding:6px 8px;font-size:11.5px;}

  /* ---- campaigns ---- */
  .ag-alimentacao .camp-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .ag-alimentacao .camp-top{display:flex;align-items:center;gap:10px;}
  .ag-alimentacao .camp-ic{width:36px;height:36px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .ag-alimentacao .camp-name{font-size:14px;font-weight:700;}
  .ag-alimentacao .camp-channel{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .ag-alimentacao .camp-status{margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex:none;}
  .ag-alimentacao .camp-status.on{background:#e6f7ee;color:#16794e;}
  .ag-alimentacao .camp-status.off{background:#f1f2f4;color:var(--text-faint);}
  .ag-alimentacao .camp-metrics{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;}
  .ag-alimentacao .camp-metric .v{font-size:15px;font-weight:800;}
  .ag-alimentacao .camp-metric .l{font-size:11px;color:var(--text-faint);margin-top:1px;}

  /* ---- KPI / dashboard ---- */
  .ag-alimentacao .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px;}
  .ag-alimentacao .kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);}
  .ag-alimentacao .kpi .l{font-size:11.5px;color:var(--text-faint);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px;}
  .ag-alimentacao .kpi .v{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.02em;}
  .ag-alimentacao .kpi .d{font-size:11.5px;margin-top:3px;font-weight:600;}
  .ag-alimentacao .kpi .d.up{color:#16794e;}
  .ag-alimentacao .kpi .d.down{color:#c0392b;}
  .ag-alimentacao .kpi .d.flat{color:var(--text-faint);}
  .ag-alimentacao .dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start;}
  @media(max-width:1180px){ .ag-alimentacao .dash-grid{grid-template-columns:1fr;} }
  .ag-alimentacao .panel-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .ag-alimentacao .panel-card h3{font-size:13.5px;font-weight:700;margin:0 0 2px;}
  .ag-alimentacao .panel-card .ph-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
  .ag-alimentacao .chart{display:flex;align-items:flex-end;gap:9px;height:150px;padding-top:6px;}
  .ag-alimentacao .bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;}
  .ag-alimentacao .bar-val{font-size:10.5px;font-weight:700;color:var(--text-dim);}
  .ag-alimentacao .bar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--primary-light),var(--primary));transition:.25s;}
  .ag-alimentacao .bar-wrap:hover .bar{background:var(--primary-dark);}
  .ag-alimentacao .bar-lab{font-size:10.5px;color:var(--text-faint);font-weight:600;}
  .ag-alimentacao .funnel-step{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .ag-alimentacao .funnel-lab{font-size:12px;font-weight:600;width:112px;flex:none;color:var(--text-dim);}
  .ag-alimentacao .funnel-track{flex:1;height:22px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .ag-alimentacao .funnel-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary-light),var(--primary));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;}
  .ag-alimentacao .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .ag-alimentacao .rank-row:last-child{border-bottom:none;}
  .ag-alimentacao .rank-pos{width:20px;height:20px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .ag-alimentacao .rank-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ag-alimentacao .rank-val{font-size:12.5px;font-weight:700;color:var(--primary-dark);flex:none;}
  .ag-alimentacao .feed-row{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-alimentacao .feed-row:last-child{border-bottom:none;}
  .ag-alimentacao .feed-ic{width:26px;height:26px;border-radius:7px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
  .ag-alimentacao .feed-txt{font-size:12.5px;line-height:1.4;flex:1;}
  .ag-alimentacao .feed-time{font-size:11px;color:var(--text-faint);flex:none;}

  /* ---- calendar ---- */
  .ag-alimentacao .cal-wrap{display:flex;gap:14px;align-items:flex-start;}
  .ag-alimentacao .cal-main{flex:1;min-width:0;}
  .ag-alimentacao .cal-side{width:296px;flex:none;}
  @media(max-width:1080px){ .ag-alimentacao .cal-wrap{flex-direction:column;} .ag-alimentacao .cal-side{width:100%;} }
  .ag-alimentacao .cal-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .ag-alimentacao .cal-month{font-size:16px;font-weight:800;min-width:170px;}
  .ag-alimentacao .cal-legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;}
  .ag-alimentacao .cal-leg{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px;font-weight:600;}
  .ag-alimentacao .cal-leg .sw{width:9px;height:9px;border-radius:3px;}
  .ag-alimentacao .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .ag-alimentacao .cal-dow{background:#fafbfc;padding:8px 6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--text-faint);text-align:center;text-transform:uppercase;}
  .ag-alimentacao .cal-cell{background:#fff;min-height:98px;padding:6px 6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:.12s;}
  .ag-alimentacao .cal-cell:hover{background:var(--bg);}
  .ag-alimentacao .cal-cell.other{background:#fbfbfc;}
  .ag-alimentacao .cal-cell.other .cal-num{color:var(--text-faint);opacity:.55;}
  .ag-alimentacao .cal-cell.sel{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary);}
  .ag-alimentacao .cal-num{font-size:11.5px;font-weight:700;color:var(--text-dim);width:21px;height:21px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;}
  .ag-alimentacao .cal-cell.today .cal-num{background:var(--primary);color:#fff;}
  .ag-alimentacao .cal-ev{font-size:10.5px;font-weight:600;padding:2.5px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
  .ag-alimentacao .cal-more{font-size:10px;color:var(--text-faint);font-weight:600;padding-left:3px;}
  .ag-alimentacao .cal-side-head{display:flex;align-items:baseline;gap:8px;margin-bottom:11px;}
  .ag-alimentacao .cal-side-head .d{font-size:15px;font-weight:800;}
  .ag-alimentacao .cal-side-head .n{font-size:11.5px;color:var(--text-faint);margin-left:auto;font-weight:600;}
  .ag-alimentacao .slot{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-alimentacao .slot:last-child{border-bottom:none;}
  .ag-alimentacao .slot-time{font-size:12px;font-weight:800;width:42px;flex:none;color:var(--text-dim);padding-top:1px;}
  .ag-alimentacao .slot-bar{width:3px;border-radius:2px;flex:none;}
  .ag-alimentacao .slot-body{flex:1;min-width:0;}
  .ag-alimentacao .slot-title{font-size:12.5px;font-weight:700;line-height:1.32;}
  .ag-alimentacao .slot-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-alimentacao .slot-tag{font-size:10px;font-weight:700;padding:1.5px 7px;border-radius:5px;display:inline-block;margin-top:5px;}
  .ag-alimentacao .cal-empty{font-size:12.5px;color:var(--text-faint);text-align:center;padding:26px 6px;}

  /* ---- forms / simulator ---- */
  .ag-alimentacao .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;}
  .ag-alimentacao .field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);margin-bottom:5px;}
  .ag-alimentacao .field input, .ag-alimentacao .field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:#fff;color:var(--text);}
  .ag-alimentacao .field input:focus, .ag-alimentacao .field select:focus{border-color:var(--primary);}
  .ag-alimentacao .field .hintx{font-size:10.5px;color:var(--text-faint);margin-top:4px;}
  .ag-alimentacao .result-box{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:12px;padding:16px 18px;margin-top:14px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;}
  .ag-alimentacao .result-box .rb{min-width:120px;}
  .ag-alimentacao .result-box .rb .l{font-size:11px;opacity:.85;font-weight:600;}
  .ag-alimentacao .result-box .rb .v{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.02em;}
  .ag-alimentacao .result-box .rb.small .v{font-size:15px;}
  .ag-alimentacao .cmp-wrap{margin-top:14px;}
  .ag-alimentacao .cmp-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg);border:1px solid var(--border);}
  .ag-alimentacao .cmp-seg{height:100%;transition:width .2s;}
  .ag-alimentacao .cmp-seg.a{background:var(--primary-dark);}
  .ag-alimentacao .cmp-seg.b{background:var(--primary);}
  .ag-alimentacao .cmp-seg.c{background:var(--primary-light);}
  .ag-alimentacao .cmp-leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--text-dim);font-weight:600;align-items:center;}
  .ag-alimentacao .cmp-leg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;}
  .ag-alimentacao .cmp-leg i.a{background:var(--primary-dark);}
  .ag-alimentacao .cmp-leg i.b{background:var(--primary);}
  .ag-alimentacao .cmp-leg i.c{background:var(--primary-light);}
  .ag-alimentacao .cmp-leg .cmp-tot{margin-left:auto;color:var(--text-faint);font-weight:600;}

  /* ---- toggle switch ---- */
  .ag-alimentacao .sw-toggle{width:38px;height:22px;border-radius:999px;background:#d3d6db;position:relative;flex:none;border:none;padding:0;transition:.18s;}
  .ag-alimentacao .sw-toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .ag-alimentacao .sw-toggle.on{background:var(--primary);}
  .ag-alimentacao .sw-toggle.on::after{left:19px;}
  .ag-alimentacao .set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .ag-alimentacao .set-row:last-child{border-bottom:none;}
  .ag-alimentacao .set-txt{flex:1;min-width:0;}
  .ag-alimentacao .set-txt .t{font-size:13px;font-weight:600;}
  .ag-alimentacao .set-txt .s{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  /* ---- in-page tabs ---- */
  .ag-alimentacao .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
  .ag-alimentacao .ptab{font-size:13px;font-weight:600;padding:9px 14px;border:none;background:transparent;color:var(--text-dim);border-bottom:2px solid transparent;white-space:nowrap;}
  .ag-alimentacao .ptab:hover{color:var(--text);}
  .ag-alimentacao .ptab.active{color:var(--primary-dark);border-bottom-color:var(--primary);}

  /* ---- kanban ---- */
  .ag-alimentacao .kb-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start;}
  .ag-alimentacao .kb-col{background:#f2f3f5;border-radius:12px;padding:10px;min-height:120px;}
  .ag-alimentacao .kb-col-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:0 3px;}
  .ag-alimentacao .kb-col-head .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .ag-alimentacao .kb-col-head .t{font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--text-dim);}
  .ag-alimentacao .kb-col-head .n{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-faint);background:#fff;border-radius:999px;padding:1px 8px;}
  .ag-alimentacao .kb-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.14s;}
  .ag-alimentacao .kb-card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .ag-alimentacao .kb-card .t{font-size:12.5px;font-weight:700;line-height:1.35;}
  .ag-alimentacao .kb-card .s{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .ag-alimentacao .kb-card .m{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .ag-alimentacao .kb-chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .ag-alimentacao .kb-who{margin-left:auto;width:21px;height:21px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;}
  .ag-alimentacao .kb-move{display:flex;gap:5px;margin-top:8px;}
  .ag-alimentacao .kb-move button{flex:1;font-size:10.5px;font-weight:700;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-dim);}
  .ag-alimentacao .kb-move button:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-light);}
  .ag-alimentacao .kb-move button:disabled{opacity:.35;cursor:default;}

  /* ---- generic status pills ---- */
  .ag-alimentacao .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;}
  .ag-alimentacao .tbl-actions{display:flex;gap:5px;}
  .ag-alimentacao .mini-btn{font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-dim);}
  .ag-alimentacao .mini-btn:hover{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-light);}
  .ag-alimentacao .wa-num{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
  .ag-alimentacao .wa-num:last-child{border-bottom:none;}
  .ag-alimentacao .wa-ic{width:38px;height:38px;border-radius:10px;background:#e4f6ec;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
  .ag-alimentacao .live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.18);flex:none;}
  .ag-alimentacao .live-dot.off{background:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.16);}

  /* ---- drawer (ficha) ---- */
  .ag-alimentacao .dw-back{position:fixed;inset:0;background:rgba(16,20,24,.42);z-index:88;opacity:0;pointer-events:none;transition:.16s;}
  .ag-alimentacao .dw-back.open{opacity:1;pointer-events:auto;}
  .ag-alimentacao .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--bg);z-index:89;transform:translateX(102%);transition:transform .2s cubic-bezier(.25,.8,.4,1);display:flex;flex-direction:column;box-shadow:-18px 0 46px -18px rgba(16,20,24,.34);}
  .ag-alimentacao .drawer.open{transform:none;}
  .ag-alimentacao .dw-head{background:#fff;padding:18px 20px 16px;border-bottom:1px solid var(--border);}
  .ag-alimentacao .dw-top{display:flex;align-items:flex-start;gap:12px;}
  .ag-alimentacao .dw-ava{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;flex:none;}
  .ag-alimentacao .dw-name{font-size:16.5px;font-weight:800;line-height:1.25;}
  .ag-alimentacao .dw-meta{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .ag-alimentacao .dw-x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text-dim);font-size:15px;line-height:1;flex:none;}
  .ag-alimentacao .dw-x:hover{background:var(--bg);}
  .ag-alimentacao .dw-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .ag-alimentacao .dw-actions{display:flex;gap:8px;margin-top:14px;}
  .ag-alimentacao .dw-actions .btn{flex:1;justify-content:center;padding:8px 6px;font-size:12px;}
  .ag-alimentacao .dw-body{flex:1;overflow-y:auto;padding:16px 20px 24px;}
  .ag-alimentacao .dw-sec{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:12px;}
  .ag-alimentacao .dw-sec h4{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 11px;}
  .ag-alimentacao .dw-kv{display:flex;justify-content:space-between;gap:12px;padding:6.5px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
  .ag-alimentacao .dw-kv:last-child{border-bottom:none;}
  .ag-alimentacao .dw-kv .k{color:var(--text-faint);font-weight:600;flex:none;}
  .ag-alimentacao .dw-kv .v{font-weight:600;text-align:right;}
  .ag-alimentacao .dw-person{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-alimentacao .dw-person:last-child{border-bottom:none;}
  .ag-alimentacao .dw-person .pa{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;flex:none;}
  .ag-alimentacao .dw-person .pn{font-size:13px;font-weight:700;}
  .ag-alimentacao .dw-person .ps{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-alimentacao .dw-person .pt{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--primary-soft);color:var(--primary-dark);flex:none;}
  .ag-alimentacao .dw-tl{position:relative;padding-left:20px;}
  .ag-alimentacao .dw-tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);border-radius:2px;}

          if(sub) sub.textContent = 'Clique para trocar a foto';
          refresh();
        };
        rd.readAsDataURL(file);
      };
      dz.onclick = ()=> fileInput.click();

      dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', ()=> dz.classList.remove('over'));
      dz.addEventListener('drop', (e)=>{
        e.preventDefault(); dz.classList.remove('over');

      });

      if(cfg.preview && $('#mdPreview')) $('#mdPreview').innerHTML = cfg.preview(readValues());

  /* ---------------- Vector art (veículos / imóveis) ---------------- */
  function shade(hex, amt){
    const h = hex.replace('#','');
    const n = parseInt(h.length===3? h.split('').map(c=>c+c).join('') : h, 16);
    let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    const f = (c)=> Math.max(0, Math.min(255, Math.round(amt>0 ? c + (255-c)*amt : c*(1+amt))));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  const CAR_SHAPES = {
    sedan: {
      body:'M13,84 L13,68 C13,61 18,56 26,54 L61,47 C70,40 83,36 100,36 L120,36 C133,36 144,39 152,45 L173,57 C181,61 185,65 185,72 L185,84 Z',
      wins:['M65,49 L85,41 L103,41 L103,52 L65,52 Z','M109,41 L127,41 L145,52 L109,52 Z'],
      belt:'M30,58 L178,58', wheels:[52,148], nose:[15,60], tail:[172,60], arches:[52,148],
    },
    suv: {

      wins:['M59,33 L95,33 L95,47 L53,47 Z','M101,33 L137,33 L147,47 L101,47 Z'],
      belt:'M28,53 L180,53', wheels:[54,150], nose:[15,58], tail:[174,58], arches:[54,150],

      belt:'M28,56 L162,56', wheels:[50,138], nose:[15,58], tail:[156,58], arches:[50,138],
    },
    picape: {

      wins:['M57,32 L87,32 L87,46 L51,46 Z','M93,32 L109,32 L117,46 L93,46 Z'],

  let __artSeq = 0;

  const KIND_HINTS = [
    ['suv', ['compass','renegade','hr-v','creta','tracker','t-cross','sw4','commander','kicks','corolla cross','duster','tiggo','pulse','fastback']],
    ['picape', ['toro','hilux','rampage','saveiro','ranger','s10','strada','montana','picape','frontier']],
    ['sedan', ['corolla','civic','city','virtus','sentra','cronos','versa','sedan']],
    ['hatch', ['polo','onix','hb20','nivus','argo','gol','hatch','ka','march']],
  ];
  function guessKind(kind, title){
    if(CAR_SHAPES[kind]) return kind;
    const t = (title||'').toLowerCase();
    for(const [k, words] of KIND_HINTS){ if(words.some(w=>t.includes(w))) return k; }
    return 'sedan';
  }

  function vehicleArt(kind, paint){
    const S = CAR_SHAPES[kind] || CAR_SHAPES.sedan;
    const base = paint || '#5b6470';
    const lightC = shade(base, .22), midC = base, darkC = shade(base, -.26), edge = shade(base, -.5);
    const isPale = /^#(f|e)/i.test(String(base));
    const glass = '#c3d0de', glassD = '#93a6bb';
    const id = 'ag' + (++__artSeq);
    const wheel = (cx)=>`
      <g>
        <circle cx="${cx}" cy="84" r="15.5" fill="#191d23"/>
        <circle cx="${cx}" cy="84" r="14" fill="#2b3038"/>
        <circle cx="${cx}" cy="84" r="8.6" fill="#d5dae1"/>
        <circle cx="${cx}" cy="84" r="8.6" fill="none" stroke="#aab1bb" stroke-width="1"/>
        <circle cx="${cx}" cy="84" r="3.2" fill="#8d949e"/>
      </g>`;
    const arch = (cx)=>`<path d="M${cx-17},84 A17,17 0 0 1 ${cx+17},84" fill="none" stroke="${edge}" stroke-width="1.4" opacity=".55"/>`;
    return `<svg class="art-svg" viewBox="0 0 200 104" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${lightC}"/>
          <stop offset="0.5" stop-color="${midC}"/>
          <stop offset="1" stop-color="${darkC}"/>
        </linearGradient>
      </defs>
      <ellipse cx="100" cy="95" rx="80" ry="5.5" fill="rgba(16,20,24,.13)"/>
      <path d="${S.body}" fill="url(#${id})" stroke="${edge}" stroke-width="${isPale?1.5:1.2}" stroke-linejoin="round"/>
      ${S.bed? `<path d="${S.bed}" fill="${darkC}" opacity=".55" stroke="${edge}" stroke-width="1"/>`:''}
      ${S.wins.map(w=>`<path d="${w}" fill="${glass}" stroke="${glassD}" stroke-width="1" stroke-linejoin="round"/>`).join('')}
      <path d="${S.belt}" stroke="${edge}" stroke-width="1" opacity=".45"/>
      <rect x="${S.nose[0]}" y="${S.nose[1]}" width="13" height="7" rx="3.5" fill="#ffe6a0" stroke="${edge}" stroke-width=".9"/>
      <rect x="${S.tail[0]}" y="${S.tail[1]}" width="11" height="6.5" rx="3" fill="#e2564a" stroke="${edge}" stroke-width=".9"/>
      ${S.arches.map(arch).join('')}
      <path d="M13,84 L${S.bed?189:185},84" stroke="${edge}" stroke-width="1.2" opacity=".7"/>
      ${S.wheels.map(wheel).join('')}
    </svg>`;
  }

  const PROP_SHAPES = {
    apto:    {floors:5, cols:3, roofPeak:false},
    alto:    {floors:7, cols:3, roofPeak:false},
    studio:  {floors:3, cols:2, roofPeak:false},
    locacao: {floors:4, cols:3, roofPeak:false},
    comercial:{floors:6, cols:4, roofPeak:false},
    casa:    {floors:2, cols:3, roofPeak:true},
  };

  function propertyArt(kind, tint){
    const S = PROP_SHAPES[kind] || PROP_SHAPES.apto;
    const base = tint || '#7C3AED';
    const wall = '#f2f3f6', wallD = '#dfe2e8', edge = '#c3c8d1';
    const win = shade(base, .55), winD = shade(base, .18);
    const W = S.roofPeak? 116 : 96, X = (200-W)/2;
    const topY = S.roofPeak? 34 : 16;
    const H = 92 - topY;
    const rows = [];
    const padX = 12, padY = S.roofPeak? 10 : 12;
    const availW = W - padX*2, availH = H - padY - 22;
    const wW = Math.min(17, (availW - (S.cols-1)*8)/S.cols);
    const wH = Math.min(13, (availH - (S.floors-1)*7)/S.floors);
    for(let r=0;r<S.floors;r++){
      for(let c=0;c<S.cols;c++){
        const x = X + padX + c*(wW+8);
        const y = topY + padY + r*(wH+7);
        const lit = ((r*S.cols+c) % 3 === 0);
        rows.push(`<rect x="${x}" y="${y}" width="${wW}" height="${wH}" rx="2.5" fill="${lit?win:winD}" stroke="${edge}" stroke-width=".7"/>`);
      }
    }
    return `<svg class="art-svg" viewBox="0 0 200 112" preserveAspectRatio="xMidYMid meet">
      <ellipse cx="100" cy="99" rx="72" ry="6" fill="rgba(16,20,24,.10)"/>
      ${S.roofPeak? `<path d="M${X-10},${topY+2} L100,10 L${X+W+10},${topY+2} Z" fill="${shade(base,-.15)}" stroke="${shade(base,-.4)}" stroke-width="1.1" stroke-linejoin="round"/>`
                  : `<rect x="${X-6}" y="${topY-6}" width="${W+12}" height="8" rx="3" fill="${shade(base,-.1)}"/>`}
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="${wall}" stroke="${edge}" stroke-width="1.2"/>
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="url(#none)" />
      ${rows.join('')}
      <rect x="${100-11}" y="72" width="22" height="20" rx="2.5" fill="${shade(base,-.05)}" stroke="${shade(base,-.35)}" stroke-width="1"/>
      <circle cx="${100+5}" cy="82" r="1.6" fill="#fff"/>
      <rect x="${X-4}" y="90" width="${W+8}" height="4" rx="2" fill="${wallD}"/>
    </svg>`;
  }

  const PAINT_NAMES = [
    ['cinza grafite','#4a4f57'],['grafite','#4a4f57'],['branco pérola','#f2f3f5'],['branco polar','#f4f5f7'],
    ['branco','#f2f3f5'],['preto','#23272e'],['prata','#c2c6cc'],['vermelho','#b0271f'],
    ['azul','#1f4f8f'],['verde','#1f6b4a'],['cinza','#8f959e'],['bege','#cbbfa6'],
  ];
  function paintOf(it){
    if(it.paint) return it.paint;
    const t = ((it.sub||'') + ' ' + (it.extra||'')).toLowerCase();
    for(const [name, hex] of PAINT_NAMES){ if(t.includes(name)) return hex; }
    return '#6b7280';
  }

  function itemArt(it){
    if(it.photo){
      return `<img class="art-photo" src="${it.photo}" alt="${(it.title||'').replace(/"/g,'')}"/>`;
    }
    const style = (DATA.inventoryView && DATA.inventoryView.artStyle) || it.artStyle;
    if(style==='vehicle') return vehicleArt(guessKind(it.art || it.category, it.title || it.sub), paintOf(it));
    if(style==='property') return propertyArt(it.art || it.category, DATA.accent);
    return `<span class="icon-badge"><span class="em">${it.emoji||'📦'}</span></span>`;
  }

  const AVATAR_COLORS = ['#EF6C42','#7C3AED','#2563EB','#0EA5A4','#DB2777','#F59E0B','#16A34A','#6366F1'];
  function colorFor(id){
    let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0)) % 997;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  /* ---------------- Sidebar / Nav (folder tree) ---------------- */
  function collectExpandable(items){
    let ids=[];
    (items||[]).forEach(i=>{ if(i.children && i.children.length){ ids.push(i.id); ids = ids.concat(collectExpandable(i.children)); } });
    return ids;
  }
  state.expanded = new Set(collectExpandable(DATA.nav));

  function nodeIsActive(item){
    if(item.id===state.navId) return true;
    if(item.children) return item.children.some(nodeIsActive);
    return false;
  }

  function renderNav(){
    const nav = $('#navList');
    nav.innerHTML = '';
    DATA.nav.forEach(item=>{
      if(item.section){
        const lab = document.createElement('div');
        lab.className='nav-label';
        lab.textContent = item.section;
        nav.appendChild(lab);
        return;
      }
      nav.appendChild(renderNode(item, 0, null));
    });
  }

  function renderNode(item, depth, ctx){
    const wrap = document.createElement('div');
    const hasChildren = item.children && item.children.length;
    const isTag = !!item.tagColor;
    const newCtx = item.view ? item : ctx;

    const btn = document.createElement('button');
    let active = item.id===state.navId;
    btn.className = 'nav-item' + (active ? ' active':'');
    btn.style.paddingLeft = (8 + depth*13) + 'px';
    const chev = hasChildren ? `<span class="chev${state.expanded.has(item.id)?' open':''}">▸</span>` : (depth>0 ? '<span class="chev-spacer"></span>' : '');
    const svg = item.icon ? iconSvg(item.icon) : null;
    const iconHtml = isTag
      ? `<span class="tag-dot" style="background:${item.tagColor}"></span>`
      : (svg ? `<span class="ic">${svg}</span>`
             : (item.icon ? `<span class="ic">${item.icon}</span>`
                          : (depth>0? '<span class="chev-spacer"></span>' : '')));
    btn.innerHTML = chev + iconHtml + `<span>${item.label}</span>` + (item.count!==undefined? `<span class="count">${item.count}</span>`:'');
    btn.onclick = ()=>{
      if(hasChildren){
        if(state.expanded.has(item.id)) state.expanded.delete(item.id); else state.expanded.add(item.id);
        renderNav();
        return;
      }
      if(isTag){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses || [item.label], statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.filter){
        if(!ctx) return;
        activateWithFilter(ctx, { unreadOnly: item.filter==='unread', navId: item.id });
        return;
      }
      if(item.statuses){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses, statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.view){ selectNav(item); }
    };
    wrap.appendChild(btn);

    if(hasChildren && state.expanded.has(item.id)){
      const kids = document.createElement('div');
      kids.className='nav-children';
      item.children.forEach(c=> kids.appendChild(renderNode(c, depth+1, newCtx)));
      wrap.appendChild(kids);
    }
    return wrap;
  }

  function activateWithFilter(ctx, opts){
    selectNav(ctx, true);
    if(opts.list) state.contactList = opts.list;
    state.listQuery = '';
    state.statusFilter = opts.statuses || null;
    state.statusLabel = opts.statusLabel || '';
    state.unreadOnly = !!opts.unreadOnly;
    if(opts.navId){ state.navId = opts.navId; renderNav(); }
    if(ctx.view==='conversas'){
      $('#listSearch').value = '';
      renderConvList();
    } else if(ctx.view==='contacts'){
      renderContacts();
      cvPage = 1;
      paintContactsList('');
    }
  }

  function clearStatusFilter(){
    state.statusFilter = null;
    state.statusLabel = '';
    cvPage = 1;
    paintContactsList($('#cvSearch') ? $('#cvSearch').value : '');
  }

  function selectNav(item, keepNavId){
    state.navId = item.id;
    state.view = item.view;
    if(item.view==='contacts') state.contactList = item.list || null;
    if(!keepNavId){ state.listQuery=''; state.unreadOnly=false; state.statusFilter=null; state.statusLabel=''; }
    renderNav();
    if(item.view==='conversas'){
      $('#listCol').style.display='flex';
      $('#chatCol').style.display='flex';
      $('#fullView').style.display='none';
      if(!keepNavId){ $('#listSearch').value=''; }
      renderConvList();
      renderChat();
    } else {
      $('#listCol').style.display='none';
      $('#chatCol').style.display='none';
      $('#fullView').style.display='flex';
      if(item.view==='contacts') renderContacts();
      else if(item.view==='agenda') renderCalendar();
      else if(item.view==='inventory') renderInventory();
      else if(item.view==='campaigns') renderCampaigns();
      else if(item.view==='dashboard') renderDashboard();
      else if(item.view==='finance') renderFinance();
      else if(item.view==='trades') renderTrades();
      else if(item.view==='reports') renderReports();
      else if(item.view==='tasks') renderTasks();
      else if(item.view==='whatsapp') renderWhatsapp();
      else if(item.view==='settings') renderSettings();
      else if(item.view==='billing') renderBilling();
      else if(item.view==='services') renderServices();
      else if(item.view==='margem') renderMargem();
      else if(item.view==='reativacao') renderReativacao();
      else renderPlaceholder(item.label);
    }
    $('#appRoot').classList.add('chat-mobile');
    $('#sidebar').classList.remove('open');
  }

  /* ---------------- Conversation list ---------------- */
  function filteredConvs(){
    let list = DATA.conversations.slice();
    if(state.activeTab && state.activeTab!=='todas'){
      list = list.filter(c => (c.tabs||[]).includes(state.activeTab));
    }
    if(state.unreadOnly) list = list.filter(c=>c.unread);
    if(state.listQuery){
      const q = state.listQuery.toLowerCase();
      list = list.filter(c => c.name.toLowerCase().includes(q) || c.preview.toLowerCase().includes(q));
    }
    return list;
  }

  function renderTabs(){
    const row = $('#tabsRow');
    row.innerHTML='';
    (DATA.filterTabs||[]).forEach(t=>{
      const chip = document.createElement('button');
      chip.className = 'tab-chip' + (state.activeTab===t.id?' active':'');
      const count = t.id==='todas' ? DATA.conversations.length : DATA.conversations.filter(c=>(c.tabs||[]).includes(t.id)).length;
      chip.textContent = `${t.label} ${count}`;
      chip.onclick = ()=>{ state.activeTab=t.id; renderTabs(); renderConvList(); };
      row.appendChild(chip);

  function renderMessages(){
    const c = getConv(state.activeConvId);
    const scroll = $('#chatScroll');
    scroll.innerHTML = `<div class="day-sep">Hoje</div>`;
    const avaColor = colorFor(c.id);
    c.messages.forEach(m=>{
      if(m.note){

        n.innerHTML = `📌 <b>Nota interna</b> · ${m.note}`;

        return;

  function nowTime(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }

  function sendMessage(){
    const input = $('#msgInput');
    const text = input.value.trim();
    if(!text) return;
    const c = getConv(state.activeConvId);
    c.messages.push({from:'agent', text: escapeHtml(text), time: nowTime()});
    c.preview = text;
    c.time = 'Agora';
    input.value='';
    renderMessages();
    renderConvList();
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function simulateIncoming(c){
    const scroll = $('#chatScroll');
    const typing = document.createElement('div');
    typing.className='typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    scroll.appendChild(typing);
    scroll.scrollTop = scroll.scrollHeight;
    setTimeout(()=>{
      typing.remove();
      const replies = DATA.simReplies || ['Perfeito, muito obrigado pela atenção!', 'Combinado então 👍', 'Pode ser, sim!'];
      const text = replies[Math.floor(Math.random()*replies.length)];
      c.messages.push({from:'client', text, time: nowTime()});
      c.preview = text; c.time='Agora'; c.unread = state.activeConvId!==c.id;
      renderMessages();
      renderConvList();
      toast('Nova mensagem simulada do cliente 📩');
    }, 1300);
  }

  function openConversationFor(name){
    const nav = DATA.nav.find(n=>n.view==='conversas');
    if(nav) selectNav(nav);
    const first = String(name).split(' ')[0];
    const hit = DATA.conversations.find(c=>c.name.toLowerCase().includes(first.toLowerCase()));
    if(hit){
      hit.unread = false;
      state.activeConvId = hit.id;
      renderConvList(); renderChat();
      toast('Conversa de ' + hit.name + ' aberta');
    } else {
      toast('Nenhuma conversa aberta com ' + name + ' ainda — inicie uma nova.');
    }
  }

  function paintContactsList(q){
    const cv = currentContactsView();
    q = (q||'').toLowerCase();
    let rows = cv.rows;
    if(state.statusFilter && state.statusFilter.length){
      const want = state.statusFilter.map(x=>String(x).toLowerCase());
      rows = rows.filter(r => want.includes(String(r.status.text).toLowerCase()));
    }
    rows = rows.filter(r => !q || (r.name+' '+r.phone+' '+r.tag+' '+r.status.text).toLowerCase().includes(q));
    const total = rows.length;
    const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
    if(cvPage>totalPages) cvPage = totalPages;
    const start = (cvPage-1)*PAGE_SIZE;
    const pageRows = rows.slice(start, start+PAGE_SIZE);

    const fb = $('#cvFilterBar');
    if(fb){
      if(state.statusFilter && state.statusFilter.length){
        const col = (cv.statusOptions||[]).find(o=>o.t.toLowerCase()===String(state.statusLabel).toLowerCase());
        fb.innerHTML = `<span class="filter-chip" style="${col?`background:${col.c}1a;color:${col.c}`:''}">
            <span class="status-dot" style="background:${col?col.c:'var(--primary)'}"></span>
            ${state.statusLabel || state.statusFilter.join(', ')}
            <button id="cvClearFilter" title="Remover filtro">✕</button>
          </span>
          <span class="filter-count">${total} de ${cv.rows.length} ${cv.itemLabel||'registros'}</span>`;
        fb.style.display = 'flex';
        const cb = $('#cvClearFilter');
        if(cb) cb.onclick = clearStatusFilter;
      } else {
        fb.innerHTML = '';
        fb.style.display = 'none';
      }
    }

    const wrap = $('#cvListWrap');
    wrap.innerHTML = pageRows.map((r,idx)=>`
      <div class="contact-card" data-idx="${idx}">
        <div class="cc-ava" style="background:${colorFor(r.name)}">${initials(r.name)}</div>
        <div class="cc-body">
          <div class="cc-name">${r.name}</div>
          <div class="cc-sub"><span>${r.phone}</span><span>·</span><span>${r.tag}</span><span>·</span><span class="lk">Ver detalhes</span></div>
        </div>
        <div class="cc-status"><span class="status-dot" style="background:${r.status.color}"></span>${r.status.text}</div>
        <button class="cc-menu-btn" data-menu="${idx}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>`).join('') || `<div class="empty-list">
        <div class="el-ic">🔍</div>
        <div class="el-t">Nenhum registro nesse filtro</div>
        <div class="el-s">${state.statusFilter? 'Não há '+(cv.itemLabel||'registros')+' marcados como “'+state.statusLabel+'” no momento.' : 'Tente outro termo de busca.'}</div>
        ${state.statusFilter? '<button class="btn" id="elClear">Ver todos</button>':''}
      </div>`;

    const elc = $('#elClear');
    if(elc) elc.onclick = clearStatusFilter;

    wrap.querySelectorAll('.cc-menu-btn').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const idx = btn.getAttribute('data-menu');
        const card = btn.closest('.contact-card');
        const existing = card.querySelector('.cc-dropdown');
        wrap.querySelectorAll('.cc-dropdown').forEach(d=>d.remove());
        if(existing) return;
        const dd = document.createElement('div');
        dd.className='cc-dropdown';
        dd.innerHTML = `<button data-a="msg">💬 Abrir conversa</button><button data-a="edit">📄 Ver ficha completa</button><button data-a="del">🗑️ Remover</button>`;
        dd.querySelectorAll('button').forEach(b=> b.onclick=(ev)=>{
          ev.stopPropagation();
          const a = b.getAttribute('data-a');
          dd.remove();
          const rowRef = pageRows[Number(idx)];
          if(a==='msg') openConversationFor(rowRef.name);
          else if(a==='edit') openContactDrawer(rowRef, cv);
          else toast('Remoção — disponível na versão completa.');
        });
        card.appendChild(dd);
      };
    });
    wrap.querySelectorAll('.contact-card').forEach((card, i)=>{
      card.addEventListener('click', ()=>{
        wrap.querySelectorAll('.cc-dropdown').forEach(d=>d.remove());
        openContactDrawer(pageRows[i], cv);
      });
    });

    const pager = $('#cvPagerWrap');
    const from = total? start+1 : 0;
    const to = Math.min(start+PAGE_SIZE, total);
    pager.innerHTML = `
      <div class="pagination-bar">
        <span>Exibindo ${from} - ${to} de ${total} ${cv.itemLabel||'contatos'}</span>
        <div class="pg-controls">
          <button class="pg-btn" id="pgFirst" ${cvPage<=1?'disabled':''}>«</button>
          <button class="pg-btn" id="pgPrev" ${cvPage<=1?'disabled':''}>‹</button>
          <span class="pg-current">${cvPage} de ${totalPages}</span>
          <button class="pg-btn" id="pgNext" ${cvPage>=totalPages?'disabled':''}>›</button>
          <button class="pg-btn" id="pgLast" ${cvPage>=totalPages?'disabled':''}>»</button>
        </div>
      </div>`;
    $('#pgFirst').onclick = ()=>{ cvPage=1; paintContactsList(q); };
    $('#pgPrev').onclick = ()=>{ cvPage=Math.max(1,cvPage-1); paintContactsList(q); };
    $('#pgNext').onclick = ()=>{ cvPage=Math.min(totalPages,cvPage+1); paintContactsList(q); };
    $('#pgLast').onclick = ()=>{ cvPage=totalPages; paintContactsList(q); };
  }

  /* ---------------- Gerenciador de fotos ---------------- */
  function normalizeName(t){
    return String(t).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/\.(jpe?g|png|webp|avif|gif)$/,'')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  // casa o nome do arquivo com o item de estoque por palavras em comum
  function matchItemIndex(fileName, items){
    const fw = normalizeName(fileName).split(' ').filter(w => w.length > 2);
    if(!fw.length) return -1;
    let best = -1, bestScore = 0;
    items.forEach((it, i)=>{
      const tw = normalizeName(it.title).split(' ').filter(Boolean);
      let score = 0;
      fw.forEach(w=>{ if(tw.some(t => t === w || (w.length>3 && t.startsWith(w)) || (t.length>3 && w.startsWith(t)))) score++; });
      // exige pelo menos duas palavras batendo, ou uma bem específica (modelo)
      const strong = score >= 2 || (score === 1 && fw.length === 1 && fw[0].length >= 4);
      if(strong && score > bestScore){ bestScore = score; best = i; }
    });
    return best;
  }

  // reduz a imagem para não inchar o arquivo exportado
  function shrinkImage(file, maxW, quality){
    return new Promise(function(resolve, reject){
      const rd = new FileReader();
      rd.onerror = reject;
      rd.onload = function(){
        const img = new Image();
        img.onerror = reject;
        img.onload = function(){
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(cv.toDataURL('image/jpeg', quality)); }
          catch(e){ resolve(rd.result); }
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  async function handlePhotoFiles(fileList){
    const iv = DATA.inventoryView;
    const files = Array.prototype.slice.call(fileList || []).filter(f => /^image\//.test(f.type));
    if(!files.length) return;

    // foto individual pedida por um item específico
    if(pmPending !== null && iv.items[pmPending]){
      const uri = await shrinkImage(files[0], 640, .72);
      iv.items[pmPending].photo = uri;
      pmPending = null;
      paintPhotoList();
      toast('Foto aplicada ✅');
      return;
    }

    let hit = 0;
    const misses = [];
    for(const f of files){
      const idx = matchItemIndex(f.name, iv.items);
      if(idx < 0){ misses.push(f.name); continue; }
      iv.items[idx].photo = await shrinkImage(f, 640, .72);
      hit++;
    }
    paintPhotoList(misses);
    if(hit && !misses.length) toast(hit + ' foto(s) aplicadas automaticamente ✅');
    else if(hit) toast(hit + ' aplicadas · ' + misses.length + ' sem correspondência');
    else toast('Nenhum nome bateu — use o botão da linha para escolher manualmente');
  }

  const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function todayISO(){
    const t = DATA.calendarView && DATA.calendarView.today;

  function isoOf(y,m,d){
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }
  function parseISO(iso){

  function evTypeMeta(type){

  function paintCalendar(){
    const cv = DATA.calendarView;
    const evs = calFilteredEvents();
    const byDate = {};
    evs.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
    Object.values(byDate).forEach(a=>a.sort((x,y)=> x.time.localeCompare(y.time)));

    $('#calMonthLabel').textContent = capFirst(MONTHS[calCursor.m]) + ' de ' + calCursor.y;

    // KPIs for the visible month
    const monthPrefix = calCursor.y + '-' + String(calCursor.m+1).padStart(2,'0');
    const monthEvs = evs.filter(e=>e.date.startsWith(monthPrefix));
    const todayEvs = byDate[todayISO()] || [];
    const confirmed = monthEvs.filter(e=>e.status==='Confirmado').length;
    const pending = monthEvs.filter(e=>e.status==='Pendente').length;
    $('#calKpis').innerHTML = `
      <div class="kpi"><div class="l">📅 No mês</div><div class="v">${monthEvs.length}</div><div class="d flat">compromissos agendados</div></div>
      <div class="kpi"><div class="l">⏱️ Hoje</div><div class="v">${todayEvs.length}</div><div class="d flat">na agenda de hoje</div></div>
      <div class="kpi"><div class="l">✅ Confirmados</div><div class="v">${confirmed}</div><div class="d up">${monthEvs.length? Math.round(confirmed/monthEvs.length*100):0}% do mês</div></div>
      <div class="kpi"><div class="l">⚠️ A confirmar</div><div class="v">${pending}</div><div class="d down">exigem follow-up</div></div>
    `;

    // grid
    const first = new Date(calCursor.y, calCursor.m, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(calCursor.y, calCursor.m+1, 0).getDate();
    const daysPrev = new Date(calCursor.y, calCursor.m, 0).getDate();
    const cells = [];
    for(let i=startOffset-1;i>=0;i--){
      const d = daysPrev-i;
      const pm = calCursor.m===0? 11 : calCursor.m-1;
      const py = calCursor.m===0? calCursor.y-1 : calCursor.y;
      cells.push({iso:isoOf(py,pm,d), d, other:true});
    }
    for(let d=1;d<=daysInMonth;d++) cells.push({iso:isoOf(calCursor.y,calCursor.m,d), d, other:false});
    while(cells.length % 7 !== 0 || cells.length < 35){
      const idx = cells.length - (startOffset + daysInMonth) + 1;
      const nm = calCursor.m===11? 0 : calCursor.m+1;
      const ny = calCursor.m===11? calCursor.y+1 : calCursor.y;
      cells.push({iso:isoOf(ny,nm,idx), d:idx, other:true});
    }

    const grid = $('#calGrid');
    grid.innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('') +
      cells.map(c=>{
        const dayEvs = byDate[c.iso] || [];
        const shown = dayEvs.slice(0,3);
        const rest = dayEvs.length - shown.length;
        const cls = ['cal-cell'];
        if(c.other) cls.push('other');
        if(c.iso===todayISO()) cls.push('today');
        if(c.iso===calSelected) cls.push('sel');
        return `<div class="${cls.join(' ')}" data-iso="${c.iso}">
          <div class="cal-num">${c.d}</div>
          ${shown.map(e=>{ const m=evTypeMeta(e.type); return `<div class="cal-ev" style="background:${m.soft};color:${m.color}">${e.time} ${e.who}</div>`; }).join('')}
          ${rest>0? `<div class="cal-more">+${rest} mais</div>`:''}
        </div>`;
      }).join('');
    grid.querySelectorAll('.cal-cell').forEach(cell=>{
      cell.onclick = ()=>{
        calSelected = cell.getAttribute('data-iso');
        const d = parseISO(calSelected);
        if(d.getMonth()!==calCursor.m){ calCursor = {y:d.getFullYear(), m:d.getMonth()}; }
        paintCalendar();
      };
    });

    // selected day panel
    const selEvs = byDate[calSelected] || [];
    const sd = parseISO(calSelected);
    $('#calDayPanel').innerHTML = `
      <div class="cal-side-head">
        <span class="d">${sd.getDate()} de ${capFirst(MONTHS[sd.getMonth()])}</span>
        <span class="n">${DOW_FULL[sd.getDay()]}</span>
      </div>
      <button class="btn" id="calDayAdd" style="width:100%;justify-content:center;margin-bottom:10px;">+ Adicionar neste dia</button>
      ${selEvs.length? selEvs.map(e=>{ const m=evTypeMeta(e.type); return `
        <div class="slot">
          <div class="slot-time">${e.time}</div>
          <div class="slot-bar" style="background:${m.color}"></div>
          <div class="slot-body">
            <div class="slot-title">${e.title}</div>
            <div class="slot-sub">${e.who}${e.note? ' · '+e.note : ''}</div>
            <span class="slot-tag" style="background:${m.soft};color:${m.color}">${e.status}</span>
          </div>
        </div>`; }).join('') : '<div class="cal-empty">Nenhum compromisso neste dia.<br/>Clique em outro dia do calendário.</div>'}
    `;
    $('#calDayPanel').querySelectorAll('.slot').forEach(s=> s.onclick = ()=> toast('Detalhe do agendamento — disponível na versão completa.'));
    const addBtn = $('#calDayAdd');
    if(addBtn) addBtn.onclick = ()=> openNewEventModal(calSelected);

    // upcoming panel
    const upcoming = evs.filter(e=> e.date >= todayISO()).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);
    $('#calNextPanel').innerHTML = `
      <h3>Próximos compromissos</h3>
      <div class="ph-sub">Ordenados por data</div>
      ${upcoming.map(e=>{ const m=evTypeMeta(e.type); const d=parseISO(e.date); return `
        <div class="slot">
          <div class="slot-time">${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}</div>
          <div class="slot-bar" style="background:${m.color}"></div>
          <div class="slot-body">
            <div class="slot-title">${e.who}</div>
            <div class="slot-sub">${e.time} · ${e.title}</div>
          </div>
        </div>`; }).join('') || '<div class="cal-empty">Nada por vir.</div>'}
    `;
    $('#calNextPanel').querySelectorAll('.slot').forEach(s=> s.onclick = ()=> toast('Detalhe do agendamento — disponível na versão completa.'));
  }

        <div class="panel-card">

                </tr>`).join('')}
            </tbody>
          </table>
          </div>
        </div>
      </div>`;

    $('#finNew').onclick = ()=> openNewSimModal(lastCalc);
    const veic = $('#finVeic'), valor = $('#finValor');
    lastCalc = null;
    function priceOf(i){ return Number(String(DATA.inventoryView.items[i].price).replace(/[^\d]/g,'')); }
    valor.value = priceOf(0);
    function calc(){
      const P = Math.max(0, Number(valor.value)||0);
      const E = Math.min(P, Math.max(0, Number($('#finEntrada').value)||0));
      const n = Number($('#finParc').value)||(DATA.financeView.defaultTerm||48);
      const i = (Number($('#finTaxa').value)||0)/100;
      const fin = P - E;
      const parcela = i>0 ? fin * (i*Math.pow(1+i,n))/(Math.pow(1+i,n)-1) : (n? fin/n : 0);
      const total = parcela*n;
      const juros = total - fin;
      lastCalc = {P, E, n, i, fin, parcela, itemIdx: Number(veic.value)||0};
      const grand = Math.max(1, E + fin + juros);
      $('#finResult').innerHTML = `
        <div class="rb"><div class="l">Parcela mensal</div><div class="v">${brl(parcela)}</div></div>

        <div class="rb small"><div class="l">Juros do período</div><div class="v">${brl(juros)}</div></div>
        <div class="rb small"><div class="l">Entrada</div><div class="v">${brl(E)}</div></div>`;
      const compo = $('#finCompo');
      if(compo){
        const seg = (label, val, cls)=> val<=0 ? '' :
          `<div class="cmp-seg ${cls}" style="width:${(val/grand*100).toFixed(2)}%" title="${label}: ${brl(val)}"></div>`;
        compo.innerHTML = `
          <div class="cmp-bar">${seg('Entrada',E,'a')}${seg('Principal financiado',fin,'b')}${seg('Juros',juros,'c')}</div>
          <div class="cmp-leg">
            <span><i class="a"></i>Entrada ${brl(E)}</span>
            <span><i class="b"></i>Principal ${brl(fin)}</span>
            <span><i class="c"></i>Juros ${brl(juros)}</span>
            <span class="cmp-tot">${n}x · ${((juros/Math.max(1,fin))*100).toFixed(0)}% de juros sobre o financiado</span>
          </div>`;
      }
    }
    veic.onchange = ()=>{ valor.value = priceOf(Number(veic.value)); calc(); };
    ['finValor','finEntrada','finParc','finTaxa'].forEach(id=>{
      $('#'+id).addEventListener('input', calc);
      $('#'+id).addEventListener('change', calc);
    });
    fv.querySelectorAll('[data-sim]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); toast('Abrindo PDF da simulação — disponível na versão completa.'); });
    calc();
  }

  function dueMeta(due){
    if(!due) return null;
    const today = todayISO();
    const d = parseISO(due);
    const label = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    if(due < today) return {label: label + ' · atrasada', cls:'late'};
    if(due === today) return {label:'hoje', cls:'today'};
    const diff = Math.round((d - parseISO(today)) / 86400000);
    if(diff === 1) return {label:'amanhã', cls:'soon'};
    if(diff <= 3) return {label:'em ' + diff + ' dias', cls:'soon'};
    return {label: label, cls:''};
  }

        <div class="kb-list" data-list="${col.id}">
        ${items.map(t=>{
          const gi = tv.tasks.indexOf(t);
          const pc = tv.prios[t.prio] || {color:'#6b7280',soft:'#f1f2f4'};
          const due = dueMeta(t.due);
          const done = t.checklist ? t.checklist.done : null;
          const total = t.checklist ? t.checklist.total : null;
          const pct = total ? Math.round(done/total*100) : 0;
          return `<div class="kb-card ${prioClass[t.prio]||''}" draggable="true" data-idx="${gi}" style="background:#fff">
            <button class="kb-del" data-del="${gi}" title="Excluir">✕</button>
            <div class="t">${t.title}</div>
            <div class="s">${t.sub}</div>
            ${t.rel? `<div class="kb-rel"><span class="kb-rel-ava" style="background:${colorFor(t.rel)}">${initials(t.rel)}</span>${t.rel}</div>`:''}
            ${(t.tags&&t.tags.length)? `<div class="kb-tags">${t.tags.map(x=>`<span class="kb-tag">${x}</span>`).join('')}</div>`:''}
            ${total? `<div class="kb-prog">
                <div class="kb-prog-bar"><span style="width:${pct}%"></span></div>
                <span class="kb-prog-n">${done}/${total}</span>
              </div>`:''}
            <div class="m">
              <span class="kb-chip" style="background:${pc.soft};color:${pc.color}">${t.prio}</span>
              ${due? `<span class="kb-chip kb-due ${due.cls}">🗓 ${due.label}</span>`:''}
              ${t.comments? `<span class="kb-mini">💬 ${t.comments}</span>`:''}
              <span class="kb-who" style="background:${colorFor(t.who)}" title="${t.who}">${initials(t.who)}</span>
            </div>
          </div>`;
        }).join('') || '<div class="kb-empty">Solte um cartão aqui</div>'}
        </div>
      </div>`;
    }).join('');

    board.querySelectorAll('.kb-card').forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        dragTaskIdx = Number(card.getAttribute('data-idx'));
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', String(dragTaskIdx)); }catch(err){}
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        board.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drop'));
      });
    });

    board.querySelectorAll('.kb-col').forEach(col=>{
      col.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; col.classList.add('drop'); });
      col.addEventListener('dragleave', (e)=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop', (e)=>{
        e.preventDefault();
        col.classList.remove('drop');
        let idx = dragTaskIdx;
        if(idx===null || idx===undefined){
          const raw = e.dataTransfer.getData('text/plain');
          idx = raw===''? null : Number(raw);
        }
        if(idx===null || Number.isNaN(idx)) return;
        const target = col.getAttribute('data-col');
        const t = tv.tasks[idx];
        if(!t || t.col===target){ dragTaskIdx=null; return; }
        t.col = target;
        dragTaskIdx = null;
        paintTasks();
        const cl = tv.columns.find(c=>c.id===target);
        toast('Movida para "' + (cl?cl.label:target) + '"');
      });
    });

    board.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const i = Number(b.getAttribute('data-del'));
        const t = tv.tasks[i];
        tv.tasks.splice(i,1);
        paintTasks();
        toast('Tarefa "' + (t?t.title:'') + '" excluída');
      };
    });
  }
