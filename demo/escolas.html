<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AutoGenius Escolas — Demonstração</title>
</head>
<body style="margin:0;">
<style>
  .ag-escolas *{box-sizing:border-box;}
  .ag-escolas {
    --primary: #059669;
    --primary-dark: #047857;
    --primary-light: #6EE7B7;
    --primary-soft: #E6F9F1;
    --primary-tint: rgba(5,150,105,.45);
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e6e8ec;
    --text: #14161a;
    --text-dim: #6b7280;
    --text-faint: #9aa0aa;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,20,24,.04), 0 8px 24px -12px rgba(16,20,24,.10);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .ag-escolas { width:100%; }
  .ag-escolas .app { display:flex; height:100vh; min-height:640px; width:100%; overflow:hidden; background:var(--bg);}
  .ag-escolas button { font-family:inherit; cursor:pointer; }
  .ag-escolas input, .ag-escolas textarea { font-family:inherit; }

  /* ---------- Top demo banner ---------- */

  /* ---------- Sidebar ---------- */
  .ag-escolas .sidebar{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-escolas .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;}
  .ag-escolas .brand-mark{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1px var(--border);}
  .ag-escolas .brand-mark img{width:26px;height:26px;object-fit:contain;}
  .ag-escolas .brand-text{line-height:1.15;}
  .ag-escolas .brand-text .name{font-weight:700;font-size:15.5px;color:var(--text);}
  .ag-escolas .brand-text .tag{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--primary-dark);background:var(--primary-soft);padding:1px 6px;border-radius:4px;display:inline-block;margin-top:2px;}
  .ag-escolas .side-search{margin:2px 12px 10px;position:relative;}
  .ag-escolas .side-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;color:var(--text);outline:none;}
  .ag-escolas .side-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-escolas .side-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-escolas .side-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--text-faint);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}
  .ag-escolas .nav{flex:1;overflow-y:auto;padding:2px 10px 10px;}
  .ag-escolas .nav-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;font-size:13.5px;color:var(--text-dim);cursor:pointer;user-select:none;font-weight:500;margin-bottom:0;border:none;background:transparent;width:100%;text-align:left;}
  .ag-escolas .nav-item .ic{width:16px;height:16px;flex:none;font-size:13px;opacity:.95;display:flex;align-items:center;justify-content:center;}
  .ag-escolas .nav-item .nvic{width:16px;height:16px;display:block;}
  .ag-escolas .nav-item:hover{background:var(--bg);color:var(--text);}
  .ag-escolas .nav-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600;}
  .ag-escolas .nav-item .count{margin-left:auto;font-size:11px;color:var(--text-faint);}
  .ag-escolas .nav-divider{height:1px;background:var(--border);margin:8px 4px;}
  .ag-escolas .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--text-faint);text-transform:uppercase;padding:10px 9px 3px;}
  .ag-escolas .tag-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .ag-escolas .chev{display:inline-block;width:11px;flex:none;font-size:10px;color:var(--text-faint);transition:transform .15s;transform:rotate(0deg);text-align:center;}
  .ag-escolas .chev.open{transform:rotate(90deg);}
  .ag-escolas .chev-spacer{width:11px;flex:none;display:inline-block;}
  .ag-escolas .nav-children{display:flex;flex-direction:column;}
  .ag-escolas .sidebar-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:9px;}
  .ag-escolas .avatar-sq{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;}
  .ag-escolas .foot-text{line-height:1.2;overflow:hidden;}
  .ag-escolas .foot-text .n{font-size:12.5px;font-weight:600;white-space:nowrap;}
  .ag-escolas .foot-text .e{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- List column ---------- */
  .ag-escolas .list-col{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-escolas .list-head{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .ag-escolas .list-head h1{font-size:17px;font-weight:700;margin:0;}
  .ag-escolas .list-head .tools{display:flex;gap:4px;}
  .ag-escolas .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .ag-escolas .icon-btn:hover{background:var(--bg);}
  .ag-escolas .icon-btn svg{width:14px;height:14px;}
  .ag-escolas .list-search{margin:2px 16px 10px;position:relative;}
  .ag-escolas .list-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;outline:none;}
  .ag-escolas .list-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-escolas .list-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-escolas .tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;}
  .ag-escolas .tabs::-webkit-scrollbar{display:none;}
  .ag-escolas .tab-chip{flex:none;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-dim);white-space:nowrap;}
  .ag-escolas .tab-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-escolas .conv-scroll{flex:1;overflow-y:auto;border-top:1px solid var(--border);}
  .ag-escolas .conv-item{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);position:relative;}
  .ag-escolas .conv-item:hover{background:var(--bg);}
  .ag-escolas .conv-item.active{background:var(--primary-soft);}
  .ag-escolas .conv-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);}
  .ag-escolas .conv-ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-escolas .conv-body{flex:1;min-width:0;}
  .ag-escolas .conv-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
  .ag-escolas .conv-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ag-escolas .conv-time{font-size:11px;color:var(--text-faint);flex:none;}
  .ag-escolas .conv-prev{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .ag-escolas .conv-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .ag-escolas .mini-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--text-dim);}
  .ag-escolas .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;margin-top:3px;}
  .ag-escolas .resolved-pill{font-size:10px;font-weight:700;color:#16794e;background:#e6f7ee;padding:1px 6px;border-radius:5px;}
  .ag-escolas .list-foot{padding:12px;text-align:center;font-size:12px;color:var(--text-faint);}

  /* ---------- Chat panel ---------- */
  .ag-escolas .chat-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--bg);}
  .ag-escolas .chat-head{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;}
  .ag-escolas .chat-head-row{display:flex;align-items:center;gap:10px;}
  .ag-escolas .chat-ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none;}
  .ag-escolas .chat-name{font-size:15px;font-weight:700;}
  .ag-escolas .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-escolas .badge.status-open{background:#fff2df;color:#9a5b00;}
  .ag-escolas .badge.status-resolved{background:#e6f7ee;color:#16794e;}
  .ag-escolas .chat-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .ag-escolas .btn{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
  .ag-escolas .btn:hover{background:var(--bg);}
  .ag-escolas .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-escolas .btn.primary:hover{background:var(--primary-dark);}
  .ag-escolas .btn.ghost{border-color:transparent;background:transparent;}
  .ag-escolas .chat-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .ag-escolas .meta-chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);border:1px solid var(--border);}
  .ag-escolas .meta-chip.strong{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent;}
  .ag-escolas .chat-scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .ag-escolas .chat-scroll > *{flex:0 0 auto;}
  .ag-escolas .day-sep{align-self:center;font-size:11px;color:var(--text-faint);background:#eef0f3;padding:3px 10px;border-radius:999px;margin:4px 0 8px;}
  .ag-escolas .msg-row{display:flex;max-width:70%;}
  .ag-escolas .msg-row.in{align-self:flex-start;}
  .ag-escolas .msg-row.out{align-self:flex-end;flex-direction:row-reverse;}
  .ag-escolas .msg-bubble{padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.48;box-shadow:var(--shadow);}
  .ag-escolas .msg-row.in .msg-bubble{background:#fff;border-bottom-left-radius:4px;color:var(--text);}
  .ag-escolas .msg-row.out .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .ag-escolas .msg-time{font-size:10.5px;color:var(--text-faint);margin-top:3px;display:flex;gap:4px;align-items:center;}
  .ag-escolas .msg-row.out .msg-time{justify-content:flex-end;}
  .ag-escolas .msg-wrap{display:flex;flex-direction:column;}
  .ag-escolas .msg-row.out .msg-wrap{align-items:flex-end;}
  .ag-escolas .cards-row{display:flex;gap:10px;overflow-x:auto;align-self:flex-end;max-width:78%;padding-bottom:4px;flex-wrap:wrap;justify-content:flex-end;}
  .ag-escolas .cards-label{width:100%;text-align:right;font-size:11px;font-weight:600;color:var(--text-faint);margin-bottom:1px;}
  .ag-escolas .item-card{flex:none;width:172px;background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);}
  .ag-escolas .item-card .thumb{height:92px;background:linear-gradient(140deg,#f7f8fa,#eceef2);display:flex;align-items:center;justify-content:center;font-size:24px;border-bottom:1px solid var(--border);padding:6px 8px;}
  .ag-escolas .item-card .ic-body{padding:9px 10px;}
  .ag-escolas .item-card .price{font-size:13px;font-weight:700;}
  .ag-escolas .item-card .sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
  .ag-escolas .item-card .loc{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .ag-escolas .msg-ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none;align-self:flex-end;margin-bottom:17px;}
  .ag-escolas .msg-row.in .msg-ava{margin-right:8px;}
  .ag-escolas .msg-row.out .msg-ava{margin-left:8px;background:var(--primary-dark);}
  .ag-escolas .note-row{align-self:center;max-width:76%;background:#fffaf0;border:1px dashed #e3c88f;border-radius:10px;padding:8px 13px;font-size:12px;color:#8a6415;line-height:1.45;}
  .ag-escolas .note-row b{font-weight:700;}
  .ag-escolas .sys-row{align-self:center;font-size:11.5px;color:var(--text-faint);background:#eef0f3;padding:4px 12px;border-radius:999px;}
  .ag-escolas .typing{align-self:flex-start;display:flex;gap:4px;background:#fff;padding:11px 14px;border-radius:14px;border-bottom-left-radius:4px;box-shadow:var(--shadow);}
  .ag-escolas .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:blink 1.2s infinite ease-in-out;}
  .ag-escolas .typing span:nth-child(2){animation-delay:.15s;}
  .ag-escolas .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .ag-escolas .quick-row{display:flex;gap:8px;padding:10px 20px 0;flex-wrap:wrap;}
  .ag-escolas .quick-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--primary-dark);}
  .ag-escolas .quick-chip:hover{background:var(--primary-soft);}
  .ag-escolas .composer{background:var(--panel);border-top:1px solid var(--border);padding:10px 20px 14px;}
  .ag-escolas .composer textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;resize:none;min-height:44px;max-height:110px;outline:none;font-family:inherit;}
  .ag-escolas .composer textarea:focus{border-color:var(--primary);}
  .ag-escolas .composer-bottom{display:flex;align-items:center;margin-top:8px;gap:6px;}
  .ag-escolas .composer-icons{display:flex;gap:4px;}
  .ag-escolas .composer-icons .icon-btn{border-color:transparent;}
  .ag-escolas .send-btn{margin-left:auto;background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;}
  .ag-escolas .send-btn:hover{background:var(--primary-dark);}
  .ag-escolas .hint{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .ag-escolas .empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-faint);gap:8px;}
  .ag-escolas .empty-chat .em-ic{font-size:34px;}

  /* ---------- Full-width views (contacts / agenda / placeholder) ---------- */
  .ag-escolas .full-view{flex:1;display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden;}
  .ag-escolas .full-head{padding:20px 26px 14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--border);}
  .ag-escolas .full-head h1{font-size:18px;font-weight:700;margin:0;}
  .ag-escolas .full-head .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .ag-escolas .full-search{margin-left:auto;position:relative;width:230px;}
  .ag-escolas .full-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;}
  .ag-escolas .full-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-escolas .full-body{flex:1;overflow:auto;padding:16px 22px;}

  /* ---- contact cards + pagination ---- */
  .ag-escolas .contact-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-bottom:9px;position:relative;}
  .ag-escolas .contact-card:hover{border-color:var(--primary-light);}
  .ag-escolas .cc-ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-escolas .cc-body{flex:1;min-width:0;}
  .ag-escolas .cc-name{font-size:13.5px;font-weight:700;}
  .ag-escolas .cc-sub{font-size:12px;color:var(--text-dim);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .ag-escolas .cc-sub .lk{color:var(--primary-dark);font-weight:600;cursor:pointer;}
  .ag-escolas .cc-sub .lk:hover{text-decoration:underline;}
  .ag-escolas .cc-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);flex:none;display:flex;align-items:center;gap:5px;}
  .ag-escolas .cc-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex:none;}
  .ag-escolas .cc-menu-btn:hover{background:var(--bg);}
  .ag-escolas .cc-dropdown{position:absolute;right:14px;top:46px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);z-index:10;overflow:hidden;min-width:170px;}
  .ag-escolas .cc-dropdown button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12.5px;background:#fff;border:none;color:var(--text);}
  .ag-escolas .cc-dropdown button:hover{background:var(--bg);}
  .ag-escolas .filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .ag-escolas .filter-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
    padding:6px 8px 6px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-escolas .filter-chip button{border:none;background:rgba(0,0,0,.08);color:inherit;width:18px;height:18px;
    border-radius:50%;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .ag-escolas .filter-chip button:hover{background:rgba(0,0,0,.18);}
  .ag-escolas .filter-count{font-size:12px;color:var(--text-faint);font-weight:600;}
  .ag-escolas .empty-list{text-align:center;padding:44px 20px;background:#fff;border:1px solid var(--border);
    border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ag-escolas .empty-list .el-ic{font-size:26px;opacity:.5;}
  .ag-escolas .empty-list .el-t{font-size:14px;font-weight:700;}
  .ag-escolas .empty-list .el-s{font-size:12.5px;color:var(--text-faint);max-width:340px;line-height:1.5;}
  .ag-escolas .empty-list .btn{margin-top:8px;}
  .ag-escolas .pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 4px;font-size:12.5px;color:var(--text-faint);}
  .ag-escolas .pg-controls{display:flex;align-items:center;gap:4px;}
  .ag-escolas .pg-btn{width:27px;height:27px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:12px;}
  .ag-escolas .pg-btn:hover:not(:disabled){background:var(--bg);}
  .ag-escolas .pg-btn:disabled{opacity:.4;cursor:default;}
  .ag-escolas .pg-current{font-size:12.5px;font-weight:600;color:var(--text);padding:0 6px;}

  /* ---- inventory grid ---- */
  .ag-escolas .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:14px;}
  .ag-escolas .inv-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .ag-escolas .inv-thumb{height:104px;background:linear-gradient(140deg,#f7f8fa 0%,#eceef2 100%);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;border-bottom:1px solid var(--border);}
  .ag-escolas .inv-thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 120%, var(--primary-soft) 0%, transparent 62%);}
  .ag-escolas .inv-thumb > span.em{position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(16,20,24,.16));}
  .ag-escolas .inv-card.sold{opacity:.62;}
  .ag-escolas .inv-card.sold .inv-thumb > span.em{filter:grayscale(1) drop-shadow(0 3px 6px rgba(16,20,24,.12));}
  .ag-escolas .inv-thumb .inv-status{position:absolute;z-index:2;top:8px;right:8px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.92);}
  .ag-escolas .inv-body{padding:11px 12px 12px;}
  .ag-escolas .inv-title{font-size:13.5px;font-weight:700;}
  .ag-escolas .inv-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-escolas .inv-price{font-size:14.5px;font-weight:800;color:var(--primary-dark);margin-top:7px;}
  .ag-escolas .inv-actions{display:flex;gap:6px;margin-top:9px;}
  .ag-escolas .inv-actions .btn{flex:1;justify-content:center;padding:6px 8px;font-size:11.5px;}

  /* ---- campaigns ---- */
  .ag-escolas .camp-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .ag-escolas .camp-top{display:flex;align-items:center;gap:10px;}
  .ag-escolas .camp-ic{width:36px;height:36px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .ag-escolas .camp-name{font-size:14px;font-weight:700;}
  .ag-escolas .camp-channel{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .ag-escolas .camp-status{margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex:none;}
  .ag-escolas .camp-status.on{background:#e6f7ee;color:#16794e;}
  .ag-escolas .camp-status.off{background:#f1f2f4;color:var(--text-faint);}
  .ag-escolas .camp-metrics{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;}
  .ag-escolas .camp-metric .v{font-size:15px;font-weight:800;}
  .ag-escolas .camp-metric .l{font-size:11px;color:var(--text-faint);margin-top:1px;}

  /* ---- KPI / dashboard ---- */
  .ag-escolas .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px;}
  .ag-escolas .kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);}
  .ag-escolas .kpi .l{font-size:11.5px;color:var(--text-faint);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px;}
  .ag-escolas .kpi .v{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.02em;}
  .ag-escolas .kpi .d{font-size:11.5px;margin-top:3px;font-weight:600;}
  .ag-escolas .kpi .d.up{color:#16794e;}
  .ag-escolas .kpi .d.down{color:#c0392b;}
  .ag-escolas .kpi .d.flat{color:var(--text-faint);}
  .ag-escolas .dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start;}
  @media(max-width:1180px){ .ag-escolas .dash-grid{grid-template-columns:1fr;} }
  .ag-escolas .panel-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .ag-escolas .panel-card h3{font-size:13.5px;font-weight:700;margin:0 0 2px;}
  .ag-escolas .panel-card .ph-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
  .ag-escolas .chart{display:flex;align-items:flex-end;gap:9px;height:150px;padding-top:6px;}
  .ag-escolas .bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;}
  .ag-escolas .bar-val{font-size:10.5px;font-weight:700;color:var(--text-dim);}
  .ag-escolas .bar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--primary-light),var(--primary));transition:.25s;}
  .ag-escolas .bar-wrap:hover .bar{background:var(--primary-dark);}
  .ag-escolas .bar-lab{font-size:10.5px;color:var(--text-faint);font-weight:600;}
  .ag-escolas .funnel-step{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .ag-escolas .funnel-lab{font-size:12px;font-weight:600;width:112px;flex:none;color:var(--text-dim);}
  .ag-escolas .funnel-track{flex:1;height:22px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .ag-escolas .funnel-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary-light),var(--primary));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;}
  .ag-escolas .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .ag-escolas .rank-row:last-child{border-bottom:none;}
  .ag-escolas .rank-pos{width:20px;height:20px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .ag-escolas .rank-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ag-escolas .rank-val{font-size:12.5px;font-weight:700;color:var(--primary-dark);flex:none;}
  .ag-escolas .feed-row{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-escolas .feed-row:last-child{border-bottom:none;}
  .ag-escolas .feed-ic{width:26px;height:26px;border-radius:7px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
  .ag-escolas .feed-txt{font-size:12.5px;line-height:1.4;flex:1;}
  .ag-escolas .feed-time{font-size:11px;color:var(--text-faint);flex:none;}

  /* ---- calendar ---- */
  .ag-escolas .cal-wrap{display:flex;gap:14px;align-items:flex-start;}
  .ag-escolas .cal-main{flex:1;min-width:0;}
  .ag-escolas .cal-side{width:296px;flex:none;}
  @media(max-width:1080px){ .ag-escolas .cal-wrap{flex-direction:column;} .ag-escolas .cal-side{width:100%;} }
  .ag-escolas .cal-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .ag-escolas .cal-month{font-size:16px;font-weight:800;min-width:170px;}
  .ag-escolas .cal-legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;}
  .ag-escolas .cal-leg{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px;font-weight:600;}
  .ag-escolas .cal-leg .sw{width:9px;height:9px;border-radius:3px;}
  .ag-escolas .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .ag-escolas .cal-dow{background:#fafbfc;padding:8px 6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--text-faint);text-align:center;text-transform:uppercase;}
  .ag-escolas .cal-cell{background:#fff;min-height:98px;padding:6px 6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:.12s;}
  .ag-escolas .cal-cell:hover{background:var(--bg);}
  .ag-escolas .cal-cell.other{background:#fbfbfc;}
  .ag-escolas .cal-cell.other .cal-num{color:var(--text-faint);opacity:.55;}
  .ag-escolas .cal-cell.sel{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary);}
  .ag-escolas .cal-num{font-size:11.5px;font-weight:700;color:var(--text-dim);width:21px;height:21px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;}
  .ag-escolas .cal-cell.today .cal-num{background:var(--primary);color:#fff;}
  .ag-escolas .cal-ev{font-size:10.5px;font-weight:600;padding:2.5px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
  .ag-escolas .cal-more{font-size:10px;color:var(--text-faint);font-weight:600;padding-left:3px;}
  .ag-escolas .cal-side-head{display:flex;align-items:baseline;gap:8px;margin-bottom:11px;}
  .ag-escolas .cal-side-head .d{font-size:15px;font-weight:800;}
  .ag-escolas .cal-side-head .n{font-size:11.5px;color:var(--text-faint);margin-left:auto;font-weight:600;}
  .ag-escolas .slot{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-escolas .slot:last-child{border-bottom:none;}
  .ag-escolas .slot-time{font-size:12px;font-weight:800;width:42px;flex:none;color:var(--text-dim);padding-top:1px;}
  .ag-escolas .slot-bar{width:3px;border-radius:2px;flex:none;}
  .ag-escolas .slot-body{flex:1;min-width:0;}
  .ag-escolas .slot-title{font-size:12.5px;font-weight:700;line-height:1.32;}
  .ag-escolas .slot-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-escolas .slot-tag{font-size:10px;font-weight:700;padding:1.5px 7px;border-radius:5px;display:inline-block;margin-top:5px;}
  .ag-escolas .cal-empty{font-size:12.5px;color:var(--text-faint);text-align:center;padding:26px 6px;}

  /* ---- forms / simulator ---- */
  .ag-escolas .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;}
  .ag-escolas .field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);margin-bottom:5px;}
  .ag-escolas .field input, .ag-escolas .field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:#fff;color:var(--text);}
  .ag-escolas .field input:focus, .ag-escolas .field select:focus{border-color:var(--primary);}
  .ag-escolas .field .hintx{font-size:10.5px;color:var(--text-faint);margin-top:4px;}
  .ag-escolas .result-box{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:12px;padding:16px 18px;margin-top:14px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;}
  .ag-escolas .result-box .rb{min-width:120px;}
  .ag-escolas .result-box .rb .l{font-size:11px;opacity:.85;font-weight:600;}
  .ag-escolas .result-box .rb .v{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.02em;}
  .ag-escolas .result-box .rb.small .v{font-size:15px;}
  .ag-escolas .cmp-wrap{margin-top:14px;}
  .ag-escolas .cmp-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg);border:1px solid var(--border);}
  .ag-escolas .cmp-seg{height:100%;transition:width .2s;}
  .ag-escolas .cmp-seg.a{background:var(--primary-dark);}
  .ag-escolas .cmp-seg.b{background:var(--primary);}
  .ag-escolas .cmp-seg.c{background:var(--primary-light);}
  .ag-escolas .cmp-leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--text-dim);font-weight:600;align-items:center;}
  .ag-escolas .cmp-leg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;}
  .ag-escolas .cmp-leg i.a{background:var(--primary-dark);}
  .ag-escolas .cmp-leg i.b{background:var(--primary);}
  .ag-escolas .cmp-leg i.c{background:var(--primary-light);}
  .ag-escolas .cmp-leg .cmp-tot{margin-left:auto;color:var(--text-faint);font-weight:600;}

  /* ---- toggle switch ---- */
  .ag-escolas .sw-toggle{width:38px;height:22px;border-radius:999px;background:#d3d6db;position:relative;flex:none;border:none;padding:0;transition:.18s;}
  .ag-escolas .sw-toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .ag-escolas .sw-toggle.on{background:var(--primary);}
  .ag-escolas .sw-toggle.on::after{left:19px;}
  .ag-escolas .set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .ag-escolas .set-row:last-child{border-bottom:none;}
  .ag-escolas .set-txt{flex:1;min-width:0;}
  .ag-escolas .set-txt .t{font-size:13px;font-weight:600;}
  .ag-escolas .set-txt .s{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  /* ---- in-page tabs ---- */
  .ag-escolas .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
  .ag-escolas .ptab{font-size:13px;font-weight:600;padding:9px 14px;border:none;background:transparent;color:var(--text-dim);border-bottom:2px solid transparent;white-space:nowrap;}
  .ag-escolas .ptab:hover{color:var(--text);}
  .ag-escolas .ptab.active{color:var(--primary-dark);border-bottom-color:var(--primary);}

  /* ---- kanban ---- */
  .ag-escolas .kb-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start;}
  .ag-escolas .kb-col{background:#f2f3f5;border-radius:12px;padding:10px;min-height:120px;}
  .ag-escolas .kb-col-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:0 3px;}
  .ag-escolas .kb-col-head .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .ag-escolas .kb-col-head .t{font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--text-dim);}
  .ag-escolas .kb-col-head .n{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-faint);background:#fff;border-radius:999px;padding:1px 8px;}
  .ag-escolas .kb-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.14s;}
  .ag-escolas .kb-card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .ag-escolas .kb-card .t{font-size:12.5px;font-weight:700;line-height:1.35;}
  .ag-escolas .kb-card .s{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .ag-escolas .kb-card .m{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .ag-escolas .kb-chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .ag-escolas .kb-who{margin-left:auto;width:21px;height:21px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;}
  .ag-escolas .kb-move{display:flex;gap:5px;margin-top:8px;}
  .ag-escolas .kb-move button{flex:1;font-size:10.5px;font-weight:700;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-dim);}
  .ag-escolas .kb-move button:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-light);}
  .ag-escolas .kb-move button:disabled{opacity:.35;cursor:default;}

  /* ---- generic status pills ---- */
  .ag-escolas .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;}
  .ag-escolas .tbl-actions{display:flex;gap:5px;}
  .ag-escolas .mini-btn{font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-dim);}
  .ag-escolas .mini-btn:hover{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-light);}
  .ag-escolas .wa-num{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
  .ag-escolas .wa-num:last-child{border-bottom:none;}
  .ag-escolas .wa-ic{width:38px;height:38px;border-radius:10px;background:#e4f6ec;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
  .ag-escolas .live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.18);flex:none;}
  .ag-escolas .live-dot.off{background:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.16);}

  /* ---- drawer (ficha) ---- */
  .ag-escolas .dw-back{position:fixed;inset:0;background:rgba(16,20,24,.42);z-index:88;opacity:0;pointer-events:none;transition:.16s;}
  .ag-escolas .dw-back.open{opacity:1;pointer-events:auto;}
  .ag-escolas .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--bg);z-index:89;transform:translateX(102%);transition:transform .2s cubic-bezier(.25,.8,.4,1);display:flex;flex-direction:column;box-shadow:-18px 0 46px -18px rgba(16,20,24,.34);}
  .ag-escolas .drawer.open{transform:none;}
  .ag-escolas .dw-head{background:#fff;padding:18px 20px 16px;border-bottom:1px solid var(--border);}
  .ag-escolas .dw-top{display:flex;align-items:flex-start;gap:12px;}
  .ag-escolas .dw-ava{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;flex:none;}
  .ag-escolas .dw-name{font-size:16.5px;font-weight:800;line-height:1.25;}
  .ag-escolas .dw-meta{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .ag-escolas .dw-x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text-dim);font-size:15px;line-height:1;flex:none;}
  .ag-escolas .dw-x:hover{background:var(--bg);}
  .ag-escolas .dw-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .ag-escolas .dw-actions{display:flex;gap:8px;margin-top:14px;}
  .ag-escolas .dw-actions .btn{flex:1;justify-content:center;padding:8px 6px;font-size:12px;}
  .ag-escolas .dw-body{flex:1;overflow-y:auto;padding:16px 20px 24px;}
  .ag-escolas .dw-sec{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:12px;}
  .ag-escolas .dw-sec h4{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 11px;}
  .ag-escolas .dw-kv{display:flex;justify-content:space-between;gap:12px;padding:6.5px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
  .ag-escolas .dw-kv:last-child{border-bottom:none;}
  .ag-escolas .dw-kv .k{color:var(--text-faint);font-weight:600;flex:none;}
  .ag-escolas .dw-kv .v{font-weight:600;text-align:right;}
  .ag-escolas .dw-person{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-escolas .dw-person:last-child{border-bottom:none;}
  .ag-escolas .dw-person .pa{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;flex:none;}
  .ag-escolas .dw-person .pn{font-size:13px;font-weight:700;}
  .ag-escolas .dw-person .ps{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-escolas .dw-person .pt{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--primary-soft);color:var(--primary-dark);flex:none;}
  .ag-escolas .dw-tl{position:relative;padding-left:20px;}
  .ag-escolas .dw-tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);border-radius:2px;}
  .ag-escolas .dw-tl-item{position:relative;padding:0 0 13px;}
  .ag-escolas .dw-tl-item:last-child{padding-bottom:0;}
  .ag-escolas .dw-tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .ag-escolas .dw-tl-item .tt{font-size:12.5px;line-height:1.4;}
  .ag-escolas .dw-tl-item .td{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .ag-escolas .dw-note{background:#fffaf0;border:1px dashed #e3c88f;border-radius:10px;padding:10px 12px;font-size:12px;color:#8a6415;line-height:1.45;}

  /* ---- financeiro / serviços ---- */
  .ag-escolas .money{font-variant-numeric:tabular-nums;font-weight:700;}
  .ag-escolas .late{color:#c0392b;font-weight:800;font-variant-numeric:tabular-nums;}
  .ag-escolas .muted-cell{color:var(--text-faint);}
  .ag-escolas .ruler{display:flex;flex-direction:column;gap:0;}
  .ag-escolas .ruler-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border);}

    return `<svg class="nvic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }

  function openModal(cfg){
    const box = $('#modalBox');
    const back = $('#modalBack');
    box.innerHTML = `
      <div class="modal-head">
        <div class="mh-ic">${cfg.icon||'✏️'}</div>
        <div><h2>${cfg.title}</h2>${cfg.subtitle?`<div class="mh-sub">${cfg.subtitle}</div>`:''}</div>

      </div>
      <div class="modal-body">
        ${cfg.preview? '<div class="modal-preview" id="mdPreview"></div>':''}
        <div class="form-grid" id="mdFields"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="mdCancel">Cancelar</button>
        <button class="btn primary" id="mdOk">${cfg.submitLabel||'Salvar'}</button>
      </div>`;

    const wrap = $('#mdFields');
    const refs = {};
    cfg.fields.forEach(f=>{
      const d = document.createElement('div');
      d.className = 'field' + (f.wide?' wide':'');
      let input;
      if(f.type==='select'){
        input = `<select data-f="${f.k}">${f.options.map(o=>`<option value="${o.v!==undefined?o.v:o}"${(f.value!==undefined&&String(f.value)===String(o.v!==undefined?o.v:o))?' selected':''}>${o.l||o}</option>`).join('')}</select>`;
      } else if(f.type==='swatch'){
        input = `<div class="swatch-row" data-f="${f.k}">${f.options.map(o=>`<button type="button" class="swatch${o.v===f.value?' sel':''}" data-v="${o.v}" title="${o.l}" style="background:${o.v}"></button>`).join('')}</div>`;
      } else if(f.type==='photo'){
        input = `<div class="drop-zone" data-f="${f.k}" data-val="">
            <b id="dzT-${f.k}">📷 Escolher foto</b>
            <span id="dzS-${f.k}">Clique ou arraste uma imagem — ela aparece no card</span>
            <input type="file" accept="image/*"/>
          </div>`;
      } else {
        input = `<input data-f="${f.k}" type="${f.type||'text'}" value="${f.value!==undefined?f.value:''}" placeholder="${f.ph||''}"${f.step?` step="${f.step}"`:''}/>`;
      }
      d.innerHTML = `<label>${f.l}${f.req?' *':''}</label>${input}${f.h?`<div class="hintx">${f.h}</div>`:''}<div class="err">${f.errMsg||'Campo obrigatório'}</div>`;
      wrap.appendChild(d);
      refs[f.k] = d;
    });

    function readValues(){
      const out = {};
      cfg.fields.forEach(f=>{
        const d = refs[f.k];
        if(f.type==='swatch'){
          const sel = d.querySelector('.swatch.sel');
          out[f.k] = sel? sel.getAttribute('data-v') : (f.value||'');
        } else if(f.type==='photo'){
          out[f.k] = d.querySelector('.drop-zone').getAttribute('data-val') || '';
        } else {
          out[f.k] = d.querySelector('[data-f]').value;
        }
      });
      return out;
    }

    // swatch picking + live preview
    wrap.querySelectorAll('.swatch').forEach(sw=>{
      sw.onclick = ()=>{
        sw.parentElement.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));
        sw.classList.add('sel');
        refresh();
      };
    });
    wrap.querySelectorAll('[data-f]').forEach(el=>{
      if(el.classList.contains('swatch-row') || el.classList.contains('drop-zone')) return;
      el.addEventListener('input', refresh);
      el.addEventListener('change', refresh);
    });

    // photo drop zones
    wrap.querySelectorAll('.drop-zone').forEach(dz=>{
      const key = dz.getAttribute('data-f');
      const fileInput = dz.querySelector('input[type=file]');
      const loadFile = (file)=>{
        if(!file || !/^image\//.test(file.type)) return;
        const rd = new FileReader();
        rd.onload = ()=>{
          dz.setAttribute('data-val', rd.result);
          const t = dz.querySelector('#dzT-'+key), sub = dz.querySelector('#dzS-'+key);
          if(t) t.textContent = '✅ ' + file.name;
          if(sub) sub.textContent = 'Clique para trocar a foto';
          refresh();
        };
        rd.readAsDataURL(file);
      };
      dz.onclick = ()=> fileInput.click();
      fileInput.onchange = ()=> loadFile(fileInput.files[0]);
      dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', ()=> dz.classList.remove('over'));
      dz.addEventListener('drop', (e)=>{
        e.preventDefault(); dz.classList.remove('over');
        loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
      });
    });

    function refresh(){
      if(cfg.preview && $('#mdPreview')) $('#mdPreview').innerHTML = cfg.preview(readValues());
    }
    refresh();

    $('#mdX').onclick = closeModal;
    $('#mdCancel').onclick = closeModal;
    $('#mdOk').onclick = ()=>{
      const v = readValues();
      let bad = false;
      cfg.fields.forEach(f=>{
        const empty = !String(v[f.k]||'').trim();
        const invalid = f.req && empty;
        refs[f.k].classList.toggle('invalid', !!invalid);
        if(invalid) bad = true;
      });
      if(bad) return;
      cfg.onSubmit(v);
      closeModal();
    };
    back.onclick = (e)=>{ if(e.target===back) closeModal(); };
    back.classList.add('open');
    const first = wrap.querySelector('input,select');
    if(first) setTimeout(()=>first.focus(), 60);
  }

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){

    }
  });

  /* ---------------- Vector art (veículos / imóveis) ---------------- */
  function shade(hex, amt){
    const h = hex.replace('#','');
    const n = parseInt(h.length===3? h.split('').map(c=>c+c).join('') : h, 16);
    let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    const f = (c)=> Math.max(0, Math.min(255, Math.round(amt>0 ? c + (255-c)*amt : c*(1+amt))));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  function guessKind(kind, title){
    if(CAR_SHAPES[kind]) return kind;
    const t = (title||'').toLowerCase();
    for(const [k, words] of KIND_HINTS){ if(words.some(w=>t.includes(w))) return k; }
    return 'sedan';
  }

  function vehicleArt(kind, paint){

    const lightC = shade(base, .22), midC = base, darkC = shade(base, -.26), edge = shade(base, -.5);
    const isPale = /^#(f|e)/i.test(String(base));

      <g>

        <circle cx="${cx}" cy="84" r="3.2" fill="#8d949e"/>

    const arch = (cx)=>`<path d="M${cx-17},84 A17,17 0 0 1 ${cx+17},84" fill="none" stroke="${edge}" stroke-width="1.4" opacity=".55"/>`;
    return `<svg class="art-svg" viewBox="0 0 200 104" preserveAspectRatio="xMidYMid meet">

  const PROP_SHAPES = {
    apto:    {floors:5, cols:3, roofPeak:false},
    alto:    {floors:7, cols:3, roofPeak:false},
    studio:  {floors:3, cols:2, roofPeak:false},

  function propertyArt(kind, tint){
    const S = PROP_SHAPES[kind] || PROP_SHAPES.apto;
    const base = tint || '#7C3AED';
    const wall = '#f2f3f6', wallD = '#dfe2e8', edge = '#c3c8d1';
    const win = shade(base, .55), winD = shade(base, .18);
    const W = S.roofPeak? 116 : 96, X = (200-W)/2;
    const topY = S.roofPeak? 34 : 16;
    const H = 92 - topY;
    const rows = [];
    const padX = 12, padY = S.roofPeak? 10 : 12;
    const availW = W - padX*2, availH = H - padY - 22;
    const wW = Math.min(17, (availW - (S.cols-1)*8)/S.cols);
    const wH = Math.min(13, (availH - (S.floors-1)*7)/S.floors);
    for(let r=0;r<S.floors;r++){
      for(let c=0;c<S.cols;c++){
        const x = X + padX + c*(wW+8);
        const y = topY + padY + r*(wH+7);
        const lit = ((r*S.cols+c) % 3 === 0);
        rows.push(`<rect x="${x}" y="${y}" width="${wW}" height="${wH}" rx="2.5" fill="${lit?win:winD}" stroke="${edge}" stroke-width=".7"/>`);
      }
    }
    return `<svg class="art-svg" viewBox="0 0 200 112" preserveAspectRatio="xMidYMid meet">
      <ellipse cx="100" cy="99" rx="72" ry="6" fill="rgba(16,20,24,.10)"/>
      ${S.roofPeak? `<path d="M${X-10},${topY+2} L100,10 L${X+W+10},${topY+2} Z" fill="${shade(base,-.15)}" stroke="${shade(base,-.4)}" stroke-width="1.1" stroke-linejoin="round"/>`
                  : `<rect x="${X-6}" y="${topY-6}" width="${W+12}" height="8" rx="3" fill="${shade(base,-.1)}"/>`}
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="${wall}" stroke="${edge}" stroke-width="1.2"/>
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="url(#none)" />
      ${rows.join('')}
      <rect x="${100-11}" y="72" width="22" height="20" rx="2.5" fill="${shade(base,-.05)}" stroke="${shade(base,-.35)}" stroke-width="1"/>
      <circle cx="${100+5}" cy="82" r="1.6" fill="#fff"/>
      <rect x="${X-4}" y="90" width="${W+8}" height="4" rx="2" fill="${wallD}"/>
    </svg>`;
  }

  const PAINT_NAMES = [
    ['cinza grafite','#4a4f57'],['grafite','#4a4f57'],['branco pérola','#f2f3f5'],['branco polar','#f4f5f7'],

  function paintOf(it){
    if(it.paint) return it.paint;
    const t = ((it.sub||'') + ' ' + (it.extra||'')).toLowerCase();
    for(const [name, hex] of PAINT_NAMES){ if(t.includes(name)) return hex; }
    return '#6b7280';
  }

  function itemArt(it){
    if(it.photo){
      return `<img class="art-photo" src="${it.photo}" alt="${(it.title||'').replace(/"/g,'')}"/>`;
    }
    const style = (DATA.inventoryView && DATA.inventoryView.artStyle) || it.artStyle;
    if(style==='vehicle') return vehicleArt(guessKind(it.art || it.category, it.title || it.sub), paintOf(it));
    if(style==='property') return propertyArt(it.art || it.category, DATA.accent);
    return `<span class="icon-badge"><span class="em">${it.emoji||'📦'}</span></span>`;

  const AVATAR_COLORS = ['#EF6C42','#7C3AED','#2563EB','#0EA5A4','#DB2777','#F59E0B','#16A34A','#6366F1'];
  function colorFor(id){
    let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0)) % 997;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  /* ---------------- Sidebar / Nav (folder tree) ---------------- */
  function collectExpandable(items){
    let ids=[];
    (items||[]).forEach(i=>{ if(i.children && i.children.length){ ids.push(i.id); ids = ids.concat(collectExpandable(i.children)); } });
    return ids;
  }
  state.expanded = new Set(collectExpandable(DATA.nav));

  function nodeIsActive(item){
    if(item.id===state.navId) return true;
    if(item.children) return item.children.some(nodeIsActive);
    return false;
  }

  function renderNav(){
    const nav = $('#navList');
    nav.innerHTML = '';
    DATA.nav.forEach(item=>{
      if(item.section){
        const lab = document.createElement('div');
        lab.className='nav-label';
        lab.textContent = item.section;
        nav.appendChild(lab);
        return;
      }
      nav.appendChild(renderNode(item, 0, null));
    });
  }

  function renderNode(item, depth, ctx){
    const wrap = document.createElement('div');
    const hasChildren = item.children && item.children.length;
    const isTag = !!item.tagColor;
    const newCtx = item.view ? item : ctx;

    const btn = document.createElement('button');
    let active = item.id===state.navId;
    btn.className = 'nav-item' + (active ? ' active':'');
    btn.style.paddingLeft = (8 + depth*13) + 'px';
    const chev = hasChildren ? `<span class="chev${state.expanded.has(item.id)?' open':''}">▸</span>` : (depth>0 ? '<span class="chev-spacer"></span>' : '');
    const svg = item.icon ? iconSvg(item.icon) : null;
    const iconHtml = isTag
      ? `<span class="tag-dot" style="background:${item.tagColor}"></span>`
      : (svg ? `<span class="ic">${svg}</span>`
             : (item.icon ? `<span class="ic">${item.icon}</span>`
                          : (depth>0? '<span class="chev-spacer"></span>' : '')));
    btn.innerHTML = chev + iconHtml + `<span>${item.label}</span>` + (item.count!==undefined? `<span class="count">${item.count}</span>`:'');
    btn.onclick = ()=>{
      if(hasChildren){
        if(state.expanded.has(item.id)) state.expanded.delete(item.id); else state.expanded.add(item.id);
        renderNav();
        return;
      }
      if(isTag){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses || [item.label], statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.filter){
        if(!ctx) return;
        activateWithFilter(ctx, { unreadOnly: item.filter==='unread', navId: item.id });
        return;
      }
      if(item.statuses){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses, statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.view){ selectNav(item); }
    };
    wrap.appendChild(btn);

    if(hasChildren && state.expanded.has(item.id)){
      const kids = document.createElement('div');
      kids.className='nav-children';
      item.children.forEach(c=> kids.appendChild(renderNode(c, depth+1, newCtx)));
      wrap.appendChild(kids);
    }
    return wrap;
  }

  function activateWithFilter(ctx, opts){
    selectNav(ctx, true);
    if(opts.list) state.contactList = opts.list;
    state.listQuery = '';
    state.statusFilter = opts.statuses || null;
    state.statusLabel = opts.statusLabel || '';
    state.unreadOnly = !!opts.unreadOnly;
    if(opts.navId){ state.navId = opts.navId; renderNav(); }
    if(ctx.view==='conversas'){
      $('#listSearch').value = '';
      renderConvList();
    } else if(ctx.view==='contacts'){
      renderContacts();
      cvPage = 1;
      paintContactsList('');
    }
  }

  function clearStatusFilter(){
    state.statusFilter = null;
    state.statusLabel = '';
    cvPage = 1;
    paintContactsList($('#cvSearch') ? $('#cvSearch').value : '');
  }

  function selectNav(item, keepNavId){
    state.navId = item.id;
    state.view = item.view;
    if(item.view==='contacts') state.contactList = item.list || null;
    if(!keepNavId){ state.listQuery=''; state.unreadOnly=false; state.statusFilter=null; state.statusLabel=''; }
    renderNav();
    if(item.view==='conversas'){
      $('#listCol').style.display='flex';
      $('#chatCol').style.display='flex';
      $('#fullView').style.display='none';
      if(!keepNavId){ $('#listSearch').value=''; }
      renderConvList();
      renderChat();
    } else {
      $('#listCol').style.display='none';
      $('#chatCol').style.display='none';
      $('#fullView').style.display='flex';
      if(item.view==='contacts') renderContacts();
      else if(item.view==='agenda') renderCalendar();
      else if(item.view==='inventory') renderInventory();
      else if(item.view==='campaigns') renderCampaigns();
      else if(item.view==='dashboard') renderDashboard();
      else if(item.view==='finance') renderFinance();
      else if(item.view==='trades') renderTrades();
      else if(item.view==='reports') renderReports();
      else if(item.view==='tasks') renderTasks();
      else if(item.view==='whatsapp') renderWhatsapp();
      else if(item.view==='settings') renderSettings();
      else if(item.view==='billing') renderBilling();
      else if(item.view==='services') renderServices();
      else if(item.view==='margem') renderMargem();
      else if(item.view==='reativacao') renderReativacao();
      else renderPlaceholder(item.label);
    }
    $('#appRoot').classList.add('chat-mobile');
    $('#sidebar').classList.remove('open');
  }

  /* ---------------- Conversation list ---------------- */
  function filteredConvs(){
    let list = DATA.conversations.slice();
    if(state.activeTab && state.activeTab!=='todas'){
      list = list.filter(c => (c.tabs||[]).includes(state.activeTab));
    }
    if(state.unreadOnly) list = list.filter(c=>c.unread);
    if(state.listQuery){
      const q = state.listQuery.toLowerCase();
      list = list.filter(c => c.name.toLowerCase().includes(q) || c.preview.toLowerCase().includes(q));
    }
    return list;
  }

  function renderTabs(){
    const row = $('#tabsRow');
    row.innerHTML='';
    (DATA.filterTabs||[]).forEach(t=>{
      const chip = document.createElement('button');
      chip.className = 'tab-chip' + (state.activeTab===t.id?' active':'');
      const count = t.id==='todas' ? DATA.conversations.length : DATA.conversations.filter(c=>(c.tabs||[]).includes(t.id)).length;
      chip.textContent = `${t.label} ${count}`;
      chip.onclick = ()=>{ state.activeTab=t.id; renderTabs(); renderConvList(); };
      row.appendChild(chip);
    });
  }

  function renderConvList(){
    const scroll = $('#convScroll');
    scroll.innerHTML='';
    const list = filteredConvs();
    if(!list.length){
      scroll.innerHTML = `<div style="padding:30px 16px;text-align:center;color:var(--text-faint);font-size:13px;">Nenhuma conversa encontrada.</div>`;
      return;
    }
    list.forEach(c=>{
      const el = document.createElement('div');
      el.className = 'conv-item' + (c.id===state.activeConvId?' active':'');

            <div class="conv-time">${c.time}</div>

  /* ---------------- Chat panel ---------------- */
  function getConv(id){ return DATA.conversations.find(c=>c.id===id); }

  function renderChat(){
    const c = getConv(state.activeConvId);
    const col = $('#chatCol');
    if(!c){ col.innerHTML = `<div class="empty-chat"><div class="em-ic">💬</div><div>Selecione uma conversa</div></div>`; return; }
    const avaColor = colorFor(c.id);
    col.innerHTML = `
      <div class="chat-head">
        <div class="chat-head-row">
          <button class="icon-btn mobile-back" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="chat-ava" style="background:${avaColor}">${initials(c.name)}</div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="chat-name">${c.name}</span>
              <span class="badge">${c.badge||'Lead'}</span>
              <span class="badge ${c.resolved?'status-resolved':'status-open'}">${c.resolved?'Resolvida':'Em aberto'}</span>
            </div>
          </div>
          <div class="chat-actions">
            <button class="btn ghost" id="simBtn">✨ Simular resposta</button>
            <button class="btn" id="resolveBtn">${c.resolved? 'Reabrir':'Resolver'} ▾</button>
            <button class="btn primary" id="primaryActionBtn">${c.primaryAction||'Ver detalhes'}</button>
          </div>
        </div>
        <div class="chat-meta">
          ${(c.metaChips||[]).map(m=>`<span class="meta-chip ${m.strong?'strong':''}">${m.icon||''} ${m.text}</span>`).join('')}
        </div>
      </div>
      <div class="chat-scroll" id="chatScroll"></div>
      <div class="quick-row" id="quickRow"></div>
      <div class="composer">
        <textarea id="msgInput" placeholder="Digite sua mensagem... (Shift+Enter = nova linha)"></textarea>
        <div class="composer-bottom">
          <div class="composer-icons">
            <button class="icon-btn" title="Emoji">🙂</button>
            <button class="icon-btn" title="Anexar">📎</button>
            <button class="icon-btn" title="Modelos">🧩</button>
          </div>
          <button class="send-btn" id="sendBtn">Enviar ⌘⏎</button>
        </div>
      </div>
    `;
    renderMessages();
    renderQuickReplies();

    $('#backBtn').onclick = ()=> $('#appRoot').classList.remove('chat-mobile');
    $('#sendBtn').onclick = sendMessage;
    $('#msgInput').addEventListener('keydown', (e)=>{
      if((e.key==='Enter' && (e.metaKey||e.ctrlKey)) ){ sendMessage(); }
    });
    $('#resolveBtn').onclick = ()=>{
      c.resolved = !c.resolved;
      toast(c.resolved? 'Conversa marcada como resolvida ✅' : 'Conversa reaberta');
      renderChat(); renderConvList();
    };
    $('#primaryActionBtn').onclick = ()=> toast('Ação de demonstração: "' + (c.primaryAction||'Ver detalhes') + '" — disponível na versão completa.');
    $('#simBtn').onclick = ()=> simulateIncoming(c);
  }

  function renderMessages(){
    const c = getConv(state.activeConvId);
    const scroll = $('#chatScroll');
    scroll.innerHTML = `<div class="day-sep">Hoje</div>`;
    const avaColor = colorFor(c.id);
    c.messages.forEach(m=>{
      if(m.note){
        const n = document.createElement('div');
        n.className='note-row';
        n.innerHTML = `📌 <b>Nota interna</b> · ${m.note}`;
        scroll.appendChild(n);
        return;
      }
      if(m.system){
        const n = document.createElement('div');
        n.className='sys-row';
        n.textContent = m.system;
        scroll.appendChild(n);
        return;
      }
      if(m.cards){
        const row = document.createElement('div');
        row.className='cards-row';
        row.innerHTML = `<div class="cards-label">📎 ${m.cardsLabel || 'Fotos e detalhes enviados'}</div>` + m.cards.map(card=>`
          <div class="item-card">
            <div class="thumb">${(card.photo || card.art)? itemArt({category:card.art, art:card.art, paint:card.paint, photo:card.photo, emoji:card.emoji, title:card.sub}) : `<span class="em" style="font-size:34px">${card.emoji||'🏷️'}</span>`}</div>
            <div class="ic-body">
              <div class="price">${card.title}</div>
              <div class="sub">${card.sub}</div>
              <div class="loc">${card.extra||''}</div>
            </div>
          </div>`).join('');
        scroll.appendChild(row);
        return;
      }
      const wrap = document.createElement('div');
      const isAgent = m.from==='agent';
      wrap.className = 'msg-row ' + (isAgent ? 'out':'in');
      const ava = isAgent
        ? `<div class="msg-ava">${DATA.agentInitials||'AG'}</div>`
        : `<div class="msg-ava" style="background:${avaColor}">${initials(c.name)}</div>`;
      wrap.innerHTML = ava + `<div class="msg-wrap"><div class="msg-bubble">${m.text}</div><div class="msg-time">${m.time}${isAgent?' ✓✓':''}</div></div>`;
      scroll.appendChild(wrap);
    });
    scroll.scrollTop = scroll.scrollHeight;
  }

  function renderQuickReplies(){
    const row = $('#quickRow');
    row.innerHTML='';
    (DATA.quickReplies||[]).forEach(q=>{
      const chip = document.createElement('button');
      chip.className='quick-chip';
      chip.textContent = q.label;
      chip.onclick = ()=>{
        const input = $('#msgInput');
        input.value = q.text;
        input.focus();
      };
      row.appendChild(chip);
    });
  }

  function nowTime(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }

  function sendMessage(){
    const input = $('#msgInput');
    const text = input.value.trim();
    if(!text) return;
    const c = getConv(state.activeConvId);
    c.messages.push({from:'agent', text: escapeHtml(text), time: nowTime()});
    c.preview = text;
    c.time = 'Agora';
    input.value='';
    renderMessages();
    renderConvList();
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function simulateIncoming(c){
    const scroll = $('#chatScroll');
    const typing = document.createElement('div');
    typing.className='typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    scroll.appendChild(typing);
    scroll.scrollTop = scroll.scrollHeight;
    setTimeout(()=>{
      typing.remove();
      const replies = DATA.simReplies || ['Perfeito, muito obrigado pela atenção!', 'Combinado então 👍', 'Pode ser, sim!'];
      const text = replies[Math.floor(Math.random()*replies.length)];
      c.messages.push({from:'client', text, time: nowTime()});
      c.preview = text; c.time='Agora'; c.unread = state.activeConvId!==c.id;
      renderMessages();
      renderConvList();
      toast('Nova mensagem simulada do cliente 📩');
    }, 1300);
  }

    $('#dwBack').classList.remove('open');

              <div class="pa" style="background:${colorFor(pp.name)}">${initials(pp.name)}</div>

        <div class="dw-sec">
          <h4>${row.statsLabel || 'Resumo financeiro'}</h4>
          ${row.stats.map(x=>`<div class="dw-kv"><span class="k">${x.l}</span><span class="v">${x.v}</span></div>`).join('')}
        </div>`:''}
        <div class="dw-sec">
          <h4>Atividade recente</h4>
          <div class="dw-tl">
            ${timeline.map(t=>`<div class="dw-tl-item"><div class="tt">${t.t}</div><div class="td">${t.d}</div></div>`).join('')}

        if(a==='msg'){ closeDrawer(); openConversationFor(row.name); return; }

  function openConversationFor(name){
    const nav = DATA.nav.find(n=>n.view==='conversas');
    if(nav) selectNav(nav);
    const first = String(name).split(' ')[0];
    const hit = DATA.conversations.find(c=>c.name.toLowerCase().includes(first.toLowerCase()));
    if(hit){
      hit.unread = false;
      state.activeConvId = hit.id;
      renderConvList(); renderChat();
      toast('Conversa de ' + hit.name + ' aberta');
    } else {
      toast('Nenhuma conversa aberta com ' + name + ' ainda — inicie uma nova.');
    }
  }

  /* ---------------- Contacts (card list + pagination) ---------------- */
  const PAGE_SIZE = 8;
  let cvPage = 1;
  let cvOpenMenu = null;

  function currentContactsView(){
    const map = DATA.contactsViews || {};
    return map[state.contactList] || DATA.contactsView;
  }

  function renderContacts(){
    const cv = currentContactsView();
    const fv = $('#fullView');
    cvPage = 1; cvOpenMenu = null;
    fv.innerHTML = `
      <div class="full-head">
        <button class="icon-btn mobile-back" id="fvBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

    $('#cvNewBtn').onclick = ()=> toast('Selecione um contato para iniciar uma nova conversa — disponível na versão completa.');
    $('#cvAddBtn').onclick = openNewContactModal;
    $('#cvSearch').addEventListener('input', (e)=>{ cvPage=1; paintContactsList(e.target.value); });
    paintContactsList(state.listQuery||'');
  }

  function paintContactsList(q){
    const cv = currentContactsView();
    q = (q||'').toLowerCase();
    let rows = cv.rows;
    if(state.statusFilter && state.statusFilter.length){
      const want = state.statusFilter.map(x=>String(x).toLowerCase());
      rows = rows.filter(r => want.includes(String(r.status.text).toLowerCase()));
    }
    rows = rows.filter(r => !q || (r.name+' '+r.phone+' '+r.tag+' '+r.status.text).toLowerCase().includes(q));
    const total = rows.length;
    const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
    if(cvPage>totalPages) cvPage = totalPages;
    const start = (cvPage-1)*PAGE_SIZE;
    const pageRows = rows.slice(start, start+PAGE_SIZE);

    const fb = $('#cvFilterBar');
    if(fb){
      if(state.statusFilter && state.statusFilter.length){
        const col = (cv.statusOptions||[]).find(o=>o.t.toLowerCase()===String(state.statusLabel).toLowerCase());
        fb.innerHTML = `<span class="filter-chip" style="${col?`background:${col.c}1a;color:${col.c}`:''}">
            <span class="status-dot" style="background:${col?col.c:'var(--primary)'}"></span>
            ${state.statusLabel || state.statusFilter.join(', ')}
            <button id="cvClearFilter" title="Remover filtro">✕</button>
          </span>
          <span class="filter-count">${total} de ${cv.rows.length} ${cv.itemLabel||'registros'}</span>`;
        fb.style.display = 'flex';
        const cb = $('#cvClearFilter');
        if(cb) cb.onclick = clearStatusFilter;
      } else {
        fb.innerHTML = '';
        fb.style.display = 'none';
      }
    }

    const wrap = $('#cvListWrap');
    wrap.innerHTML = pageRows.map((r,idx)=>`
      <div class="contact-card" data-idx="${idx}">
        <div class="cc-ava" style="background:${colorFor(r.name)}">${initials(r.name)}</div>
        <div class="cc-body">
          <div class="cc-name">${r.name}</div>
          <div class="cc-sub"><span>${r.phone}</span><span>·</span><span>${r.tag}</span><span>·</span><span class="lk">Ver detalhes</span></div>
        </div>
        <div class="cc-status"><span class="status-dot" style="background:${r.status.color}"></span>${r.status.text}</div>
        <button class="cc-menu-btn" data-menu="${idx}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>`).join('') || `<div class="empty-list">
        <div class="el-ic">🔍</div>
        <div class="el-t">Nenhum registro nesse filtro</div>
        <div class="el-s">${state.statusFilter? 'Não há '+(cv.itemLabel||'registros')+' marcados como “'+state.statusLabel+'” no momento.' : 'Tente outro termo de busca.'}</div>
        ${state.statusFilter? '<button class="btn" id="elClear">Ver todos</button>':''}
      </div>`;

    const elc = $('#elClear');
    if(elc) elc.onclick = clearStatusFilter;

    wrap.querySelectorAll('.cc-menu-btn').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const idx = btn.getAttribute('data-menu');
        const card = btn.closest('.contact-card');
        const existing = card.querySelector('.cc-dropdown');
        wrap.querySelectorAll('.cc-dropdown').forEach(d=>d.remove());
        if(existing) return;
        const dd = document.createElement('div');
        dd.className='cc-dropdown';
        dd.innerHTML = `<button data-a="msg">💬 Abrir conversa</button><button data-a="edit">📄 Ver ficha completa</button><button data-a="del">🗑️ Remover</button>`;
        dd.querySelectorAll('button').forEach(b=> b.onclick=(ev)=>{
          ev.stopPropagation();
          const a = b.getAttribute('data-a');
          dd.remove();
          const rowRef = pageRows[Number(idx)];
          if(a==='msg') openConversationFor(rowRef.name);
          else if(a==='edit') openContactDrawer(rowRef, cv);
          else toast('Remoção — disponível na versão completa.');
        });
        card.appendChild(dd);
      };
    });
    wrap.querySelectorAll('.contact-card').forEach((card, i)=>{
      card.addEventListener('click', ()=>{
        wrap.querySelectorAll('.cc-dropdown').forEach(d=>d.remove());
        openContactDrawer(pageRows[i], cv);
      });
    });

    const pager = $('#cvPagerWrap');
    const from = total? start+1 : 0;
    const to = Math.min(start+PAGE_SIZE, total);
    pager.innerHTML = `
      <div class="pagination-bar">
        <span>Exibindo ${from} - ${to} de ${total} ${cv.itemLabel||'contatos'}</span>
        <div class="pg-controls">
          <button class="pg-btn" id="pgFirst" ${cvPage<=1?'disabled':''}>«</button>
          <button class="pg-btn" id="pgPrev" ${cvPage<=1?'disabled':''}>‹</button>
          <span class="pg-current">${cvPage} de ${totalPages}</span>
          <button class="pg-btn" id="pgNext" ${cvPage>=totalPages?'disabled':''}>›</button>
          <button class="pg-btn" id="pgLast" ${cvPage>=totalPages?'disabled':''}>»</button>
        </div>
      </div>`;
    $('#pgFirst').onclick = ()=>{ cvPage=1; paintContactsList(q); };
    $('#pgPrev').onclick = ()=>{ cvPage=Math.max(1,cvPage-1); paintContactsList(q); };
    $('#pgNext').onclick = ()=>{ cvPage=Math.min(totalPages,cvPage+1); paintContactsList(q); };
    $('#pgLast').onclick = ()=>{ cvPage=totalPages; paintContactsList(q); };
  }

  function openNewContactModal(){
    const cv = currentContactsView();
    const singular = (cv.itemLabel||'contatos').replace(/s$/,'');
    const stOpts = cv.statusOptions || [
      {t:'Quente', c:'#EF4444'},{t:'Morno', c:'#F59E0B'},
      {t:'Frio', c:'#60A5FA'},{t:'Negociação', c:'#22C55E'},
    ];
    openModal({
      icon:'👤',
      title:'Cadastrar ' + singular,
      subtitle:'Entra na lista imediatamente, no topo',
      submitLabel:'Cadastrar',
      fields:[
        {k:'name', l:'Nome completo', req:true, wide:true, ph:'Ex: Maria Fernanda Souza'},
        {k:'phone', l:'Telefone', req:true, ph:'(81) 98888-7777'},
        {k:'origin', l:'Origem', type:'select', options:['WhatsApp','Instagram Ads','Site','Facebook Ads','Indicação','Google Ads','Recepção']},
        {k:'tag', l: cv.interestLabel || 'Interesse', wide:true, ph: cv.interestPh || 'Ex: Jeep Compass Limited'},
        {k:'status', l:'Situação', type:'select', options: stOpts.map((o,i)=>({v:i, l:o.t}))},
      ],
      onSubmit:(v)=>{
        const st = stOpts[Number(v.status)||0];
        cv.rows.unshift({
          name: v.name,
          phone: v.phone,
          tag: [v.tag, v.origin].filter(Boolean).join(' · '),
          status: {color: st.c, text: st.t},
        });
        cvPage = 1;
        if($('#cvSearch')) $('#cvSearch').value = '';
        paintContactsList('');
        toast(v.name + ' cadastrado ✅');
      },
    });
  }

  /* ---------------- Gerenciador de fotos ---------------- */
  function normalizeName(t){
    return String(t).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/\.(jpe?g|png|webp|avif|gif)$/,'')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  // casa o nome do arquivo com o item de estoque por palavras em comum
  function matchItemIndex(fileName, items){
    const fw = normalizeName(fileName).split(' ').filter(w => w.length > 2);
    if(!fw.length) return -1;
    let best = -1, bestScore = 0;
    items.forEach((it, i)=>{
      const tw = normalizeName(it.title).split(' ').filter(Boolean);
      let score = 0;
      fw.forEach(w=>{ if(tw.some(t => t === w || (w.length>3 && t.startsWith(w)) || (t.length>3 && w.startsWith(t)))) score++; });
      // exige pelo menos duas palavras batendo, ou uma bem específica (modelo)
      const strong = score >= 2 || (score === 1 && fw.length === 1 && fw[0].length >= 4);
      if(strong && score > bestScore){ bestScore = score; best = i; }
    });
    return best;
  }

  // reduz a imagem para não inchar o arquivo exportado
  function shrinkImage(file, maxW, quality){
    return new Promise(function(resolve, reject){
      const rd = new FileReader();
      rd.onerror = reject;
      rd.onload = function(){
        const img = new Image();
        img.onerror = reject;
        img.onload = function(){
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(cv.toDataURL('image/jpeg', quality)); }
          catch(e){ resolve(rd.result); }
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  async function handlePhotoFiles(fileList){
    const iv = DATA.inventoryView;
    const files = Array.prototype.slice.call(fileList || []).filter(f => /^image\//.test(f.type));
    if(!files.length) return;

    // foto individual pedida por um item específico
    if(pmPending !== null && iv.items[pmPending]){
      const uri = await shrinkImage(files[0], 640, .72);
      iv.items[pmPending].photo = uri;
      pmPending = null;
      paintPhotoList();
      toast('Foto aplicada ✅');
      return;
    }

    let hit = 0;
    const misses = [];
    for(const f of files){
      const idx = matchItemIndex(f.name, iv.items);
      if(idx < 0){ misses.push(f.name); continue; }
      iv.items[idx].photo = await shrinkImage(f, 640, .72);
      hit++;
    }
    paintPhotoList(misses);
    if(hit && !misses.length) toast(hit + ' foto(s) aplicadas automaticamente ✅');
    else if(hit) toast(hit + ' aplicadas · ' + misses.length + ' sem correspondência');
    else toast('Nenhum nome bateu — use o botão da linha para escolher manualmente');
  }

  /* ---------------- Calendar ---------------- */
  const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
  const DOW_FULL = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  let calCursor = null;
  let calSelected = null;

  function todayISO(){
    const t = DATA.calendarView && DATA.calendarView.today;
    return t || new Date().toISOString().slice(0,10);
  }
  function isoOf(y,m,d){
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }
  function parseISO(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function evTypeMeta(type){
    const t = (DATA.calendarView.types||[]).find(x=>x.id===type);
    return t || {id:type, label:type, color:'#6b7280', soft:'#f1f2f4'};
  }

  function calFilteredEvents(){

    const q = (el? el.value : '').toLowerCase();

  function paintCalendar(){
    const cv = DATA.calendarView;
    const evs = calFilteredEvents();
    const byDate = {};
    evs.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
    Object.values(byDate).forEach(a=>a.sort((x,y)=> x.time.localeCompare(y.time)));

    $('#calMonthLabel').textContent = capFirst(MONTHS[calCursor.m]) + ' de ' + calCursor.y;

    // KPIs for the visible month
    const monthPrefix = calCursor.y + '-' + String(calCursor.m+1).padStart(2,'0');
    const monthEvs = evs.filter(e=>e.date.startsWith(monthPrefix));
    const todayEvs = byDate[todayISO()] || [];
    const confirmed = monthEvs.filter(e=>e.status==='Confirmado').length;
    const pending = monthEvs.filter(e=>e.status==='Pendente').length;
    $('#calKpis').innerHTML = `
      <div class="kpi"><div class="l">📅 No mês</div><div class="v">${monthEvs.length}</div><div class="d flat">compromissos agendados</div></div>
      <div class="kpi"><div class="l">⏱️ Hoje</div><div class="v">${todayEvs.length}</div><div class="d flat">na agenda de hoje</div></div>
      <div class="kpi"><div class="l">✅ Confirmados</div><div class="v">${confirmed}</div><div class="d up">${monthEvs.length? Math.round(confirmed/monthEvs.length*100):0}% do mês</div></div>
      <div class="kpi"><div class="l">⚠️ A confirmar</div><div class="v">${pending}</div><div class="d down">exigem follow-up</div></div>
    `;

    // grid
    const first = new Date(calCursor.y, calCursor.m, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(calCursor.y, calCursor.m+1, 0).getDate();
    const daysPrev = new Date(calCursor.y, calCursor.m, 0).getDate();
    const cells = [];
    for(let i=startOffset-1;i>=0;i--){
      const d = daysPrev-i;
      const pm = calCursor.m===0? 11 : calCursor.m-1;
      const py = calCursor.m===0? calCursor.y-1 : calCursor.y;
      cells.push({iso:isoOf(py,pm,d), d, other:true});
    }
    for(let d=1;d<=daysInMonth;d++) cells.push({iso:isoOf(calCursor.y,calCursor.m,d), d, other:false});
    while(cells.length % 7 !== 0 || cells.length < 35){
      const idx = cells.length - (startOffset + daysInMonth) + 1;
      const nm = calCursor.m===11? 0 : calCursor.m+1;
      const ny = calCursor.m===11? calCursor.y+1 : calCursor.y;
      cells.push({iso:isoOf(ny,nm,idx), d:idx, other:true});
    }

    const grid = $('#calGrid');
    grid.innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('') +
      cells.map(c=>{
        const dayEvs = byDate[c.iso] || [];
        const shown = dayEvs.slice(0,3);
        const rest = dayEvs.length - shown.length;
        const cls = ['cal-cell'];
        if(c.other) cls.push('other');
        if(c.iso===todayISO()) cls.push('today');
        if(c.iso===calSelected) cls.push('sel');
        return `<div class="${cls.join(' ')}" data-iso="${c.iso}">
          <div class="cal-num">${c.d}</div>
          ${shown.map(e=>{ const m=evTypeMeta(e.type); return `<div class="cal-ev" style="background:${m.soft};color:${m.color}">${e.time} ${e.who}</div>`; }).join('')}
          ${rest>0? `<div class="cal-more">+${rest} mais</div>`:''}
        </div>`;
      }).join('');
    grid.querySelectorAll('.cal-cell').forEach(cell=>{
      cell.onclick = ()=>{
        calSelected = cell.getAttribute('data-iso');
        const d = parseISO(calSelected);
        if(d.getMonth()!==calCursor.m){ calCursor = {y:d.getFullYear(), m:d.getMonth()}; }
        paintCalendar();
      };
    });

    // selected day panel
    const selEvs = byDate[calSelected] || [];
    const sd = parseISO(calSelected);
    $('#calDayPanel').innerHTML = `

  function renderFinance(){
    const fvd = DATA.financeView;
    const fv = $('#fullView');
    fv.innerHTML = fvHeader(fvd.title, fvd.subtitle,
      `<button class="btn primary" style="margin-left:auto" id="finNew">+ Nova simulação</button>`) + `
      <div class="full-body">
        <div class="kpi-row">

        </div>

          <div class="form-grid">
            <div class="field"><label>${fvd.itemLabel||'Veículo'}</label>
