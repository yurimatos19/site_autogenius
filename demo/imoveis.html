<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AutoGenius Imóveis — Demonstração</title>
</head>
<body style="margin:0;">
<style>
  .ag-imoveis *{box-sizing:border-box;}
  .ag-imoveis {
    --primary: #7C3AED;
    --primary-dark: #5B21B6;
    --primary-light: #B794F6;
    --primary-soft: #F3ECFE;
    --primary-tint: rgba(124,58,237,.45);
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e6e8ec;
    --text: #14161a;
    --text-dim: #6b7280;
    --text-faint: #9aa0aa;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,20,24,.04), 0 8px 24px -12px rgba(16,20,24,.10);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .ag-imoveis { width:100%; }
  .ag-imoveis .app { display:flex; height:100vh; min-height:640px; width:100%; overflow:hidden; background:var(--bg);}
  .ag-imoveis button { font-family:inherit; cursor:pointer; }
  .ag-imoveis input, .ag-imoveis textarea { font-family:inherit; }

  /* ---------- Top demo banner ---------- */

  /* ---------- Sidebar ---------- */
  .ag-imoveis .sidebar{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-imoveis .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;}
  .ag-imoveis .brand-mark{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1px var(--border);}
  .ag-imoveis .brand-mark img{width:26px;height:26px;object-fit:contain;}
  .ag-imoveis .brand-text{line-height:1.15;}
  .ag-imoveis .brand-text .name{font-weight:700;font-size:15.5px;color:var(--text);}
  .ag-imoveis .brand-text .tag{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--primary-dark);background:var(--primary-soft);padding:1px 6px;border-radius:4px;display:inline-block;margin-top:2px;}
  .ag-imoveis .side-search{margin:2px 12px 10px;position:relative;}
  .ag-imoveis .side-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;color:var(--text);outline:none;}
  .ag-imoveis .side-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-imoveis .side-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-imoveis .side-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--text-faint);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}
  .ag-imoveis .nav{flex:1;overflow-y:auto;padding:2px 10px 10px;}
  .ag-imoveis .nav-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;font-size:13.5px;color:var(--text-dim);cursor:pointer;user-select:none;font-weight:500;margin-bottom:0;border:none;background:transparent;width:100%;text-align:left;}
  .ag-imoveis .nav-item .ic{width:16px;height:16px;flex:none;font-size:13px;opacity:.95;display:flex;align-items:center;justify-content:center;}
  .ag-imoveis .nav-item .nvic{width:16px;height:16px;display:block;}
  .ag-imoveis .nav-item:hover{background:var(--bg);color:var(--text);}
  .ag-imoveis .nav-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600;}
  .ag-imoveis .nav-item .count{margin-left:auto;font-size:11px;color:var(--text-faint);}
  .ag-imoveis .nav-divider{height:1px;background:var(--border);margin:8px 4px;}
  .ag-imoveis .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--text-faint);text-transform:uppercase;padding:10px 9px 3px;}
  .ag-imoveis .tag-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .ag-imoveis .chev{display:inline-block;width:11px;flex:none;font-size:10px;color:var(--text-faint);transition:transform .15s;transform:rotate(0deg);text-align:center;}
  .ag-imoveis .chev.open{transform:rotate(90deg);}
  .ag-imoveis .chev-spacer{width:11px;flex:none;display:inline-block;}
  .ag-imoveis .nav-children{display:flex;flex-direction:column;}
  .ag-imoveis .sidebar-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:9px;}
  .ag-imoveis .avatar-sq{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;}
  .ag-imoveis .foot-text{line-height:1.2;overflow:hidden;}
  .ag-imoveis .foot-text .n{font-size:12.5px;font-weight:600;white-space:nowrap;}
  .ag-imoveis .foot-text .e{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- List column ---------- */
  .ag-imoveis .list-col{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-imoveis .list-head{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .ag-imoveis .list-head h1{font-size:17px;font-weight:700;margin:0;}
  .ag-imoveis .list-head .tools{display:flex;gap:4px;}
  .ag-imoveis .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .ag-imoveis .icon-btn:hover{background:var(--bg);}
  .ag-imoveis .icon-btn svg{width:14px;height:14px;}
  .ag-imoveis .list-search{margin:2px 16px 10px;position:relative;}
  .ag-imoveis .list-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;outline:none;}
  .ag-imoveis .list-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-imoveis .list-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-imoveis .tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;}
  .ag-imoveis .tabs::-webkit-scrollbar{display:none;}
  .ag-imoveis .tab-chip{flex:none;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-dim);white-space:nowrap;}
  .ag-imoveis .tab-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-imoveis .conv-scroll{flex:1;overflow-y:auto;border-top:1px solid var(--border);}
  .ag-imoveis .conv-item{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);position:relative;}
  .ag-imoveis .conv-item:hover{background:var(--bg);}
  .ag-imoveis .conv-item.active{background:var(--primary-soft);}
  .ag-imoveis .conv-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);}
  .ag-imoveis .conv-ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-imoveis .conv-body{flex:1;min-width:0;}
  .ag-imoveis .conv-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
  .ag-imoveis .conv-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ag-imoveis .conv-time{font-size:11px;color:var(--text-faint);flex:none;}
  .ag-imoveis .conv-prev{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .ag-imoveis .conv-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .ag-imoveis .mini-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--text-dim);}
  .ag-imoveis .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;margin-top:3px;}
  .ag-imoveis .resolved-pill{font-size:10px;font-weight:700;color:#16794e;background:#e6f7ee;padding:1px 6px;border-radius:5px;}
  .ag-imoveis .list-foot{padding:12px;text-align:center;font-size:12px;color:var(--text-faint);}

  /* ---------- Chat panel ---------- */
  .ag-imoveis .chat-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--bg);}
  .ag-imoveis .chat-head{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;}
  .ag-imoveis .chat-head-row{display:flex;align-items:center;gap:10px;}
  .ag-imoveis .chat-ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none;}
  .ag-imoveis .chat-name{font-size:15px;font-weight:700;}
  .ag-imoveis .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-imoveis .badge.status-open{background:#fff2df;color:#9a5b00;}
  .ag-imoveis .badge.status-resolved{background:#e6f7ee;color:#16794e;}
  .ag-imoveis .chat-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .ag-imoveis .btn{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
  .ag-imoveis .btn:hover{background:var(--bg);}
  .ag-imoveis .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-imoveis .btn.primary:hover{background:var(--primary-dark);}
  .ag-imoveis .btn.ghost{border-color:transparent;background:transparent;}
  .ag-imoveis .chat-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .ag-imoveis .meta-chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);border:1px solid var(--border);}
  .ag-imoveis .meta-chip.strong{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent;}
  .ag-imoveis .chat-scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .ag-imoveis .chat-scroll > *{flex:0 0 auto;}
  .ag-imoveis .day-sep{align-self:center;font-size:11px;color:var(--text-faint);background:#eef0f3;padding:3px 10px;border-radius:999px;margin:4px 0 8px;}
  .ag-imoveis .msg-row{display:flex;max-width:70%;}
  .ag-imoveis .msg-row.in{align-self:flex-start;}
  .ag-imoveis .msg-row.out{align-self:flex-end;flex-direction:row-reverse;}
  .ag-imoveis .msg-bubble{padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.48;box-shadow:var(--shadow);}
  .ag-imoveis .msg-row.in .msg-bubble{background:#fff;border-bottom-left-radius:4px;color:var(--text);}
  .ag-imoveis .msg-row.out .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .ag-imoveis .msg-time{font-size:10.5px;color:var(--text-faint);margin-top:3px;display:flex;gap:4px;align-items:center;}
  .ag-imoveis .msg-row.out .msg-time{justify-content:flex-end;}
  .ag-imoveis .msg-wrap{display:flex;flex-direction:column;}
  .ag-imoveis .msg-row.out .msg-wrap{align-items:flex-end;}
  .ag-imoveis .cards-row{display:flex;gap:10px;overflow-x:auto;align-self:flex-end;max-width:78%;padding-bottom:4px;flex-wrap:wrap;justify-content:flex-end;}
  .ag-imoveis .cards-label{width:100%;text-align:right;font-size:11px;font-weight:600;color:var(--text-faint);margin-bottom:1px;}
  .ag-imoveis .item-card{flex:none;width:172px;background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);}
  .ag-imoveis .item-card .thumb{height:92px;background:linear-gradient(140deg,#f7f8fa,#eceef2);display:flex;align-items:center;justify-content:center;font-size:24px;border-bottom:1px solid var(--border);padding:6px 8px;}
  .ag-imoveis .item-card .ic-body{padding:9px 10px;}
  .ag-imoveis .item-card .price{font-size:13px;font-weight:700;}
  .ag-imoveis .item-card .sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
  .ag-imoveis .item-card .loc{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .ag-imoveis .msg-ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none;align-self:flex-end;margin-bottom:17px;}
  .ag-imoveis .msg-row.in .msg-ava{margin-right:8px;}
  .ag-imoveis .msg-row.out .msg-ava{margin-left:8px;background:var(--primary-dark);}
  .ag-imoveis .note-row{align-self:center;max-width:76%;background:#fffaf0;border:1px dashed #e3c88f;border-radius:10px;padding:8px 13px;font-size:12px;color:#8a6415;line-height:1.45;}
  .ag-imoveis .note-row b{font-weight:700;}
  .ag-imoveis .sys-row{align-self:center;font-size:11.5px;color:var(--text-faint);background:#eef0f3;padding:4px 12px;border-radius:999px;}
  .ag-imoveis .typing{align-self:flex-start;display:flex;gap:4px;background:#fff;padding:11px 14px;border-radius:14px;border-bottom-left-radius:4px;box-shadow:var(--shadow);}
  .ag-imoveis .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:blink 1.2s infinite ease-in-out;}
  .ag-imoveis .typing span:nth-child(2){animation-delay:.15s;}
  .ag-imoveis .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .ag-imoveis .quick-row{display:flex;gap:8px;padding:10px 20px 0;flex-wrap:wrap;}
  .ag-imoveis .quick-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--primary-dark);}
  .ag-imoveis .quick-chip:hover{background:var(--primary-soft);}
  .ag-imoveis .composer{background:var(--panel);border-top:1px solid var(--border);padding:10px 20px 14px;}
  .ag-imoveis .composer textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;resize:none;min-height:44px;max-height:110px;outline:none;font-family:inherit;}
  .ag-imoveis .composer textarea:focus{border-color:var(--primary);}
  .ag-imoveis .composer-bottom{display:flex;align-items:center;margin-top:8px;gap:6px;}
  .ag-imoveis .composer-icons{display:flex;gap:4px;}
  .ag-imoveis .composer-icons .icon-btn{border-color:transparent;}
  .ag-imoveis .send-btn{margin-left:auto;background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;}
  .ag-imoveis .send-btn:hover{background:var(--primary-dark);}
  .ag-imoveis .hint{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .ag-imoveis .empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-faint);gap:8px;}
  .ag-imoveis .empty-chat .em-ic{font-size:34px;}

  /* ---------- Full-width views (contacts / agenda / placeholder) ---------- */
  .ag-imoveis .full-view{flex:1;display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden;}
  .ag-imoveis .full-head{padding:20px 26px 14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--border);}
  .ag-imoveis .full-head h1{font-size:18px;font-weight:700;margin:0;}
  .ag-imoveis .full-head .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .ag-imoveis .full-search{margin-left:auto;position:relative;width:230px;}
  .ag-imoveis .full-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;}
  .ag-imoveis .full-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-imoveis .full-body{flex:1;overflow:auto;padding:16px 22px;}

  /* ---- contact cards + pagination ---- */
  .ag-imoveis .contact-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-bottom:9px;position:relative;}
  .ag-imoveis .contact-card:hover{border-color:var(--primary-light);}
  .ag-imoveis .cc-ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-imoveis .cc-body{flex:1;min-width:0;}
  .ag-imoveis .cc-name{font-size:13.5px;font-weight:700;}
  .ag-imoveis .cc-sub{font-size:12px;color:var(--text-dim);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .ag-imoveis .cc-sub .lk{color:var(--primary-dark);font-weight:600;cursor:pointer;}
  .ag-imoveis .cc-sub .lk:hover{text-decoration:underline;}
  .ag-imoveis .cc-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);flex:none;display:flex;align-items:center;gap:5px;}
  .ag-imoveis .cc-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex:none;}
  .ag-imoveis .cc-menu-btn:hover{background:var(--bg);}
  .ag-imoveis .cc-dropdown{position:absolute;right:14px;top:46px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);z-index:10;overflow:hidden;min-width:170px;}
  .ag-imoveis .cc-dropdown button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12.5px;background:#fff;border:none;color:var(--text);}
  .ag-imoveis .cc-dropdown button:hover{background:var(--bg);}
  .ag-imoveis .filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .ag-imoveis .filter-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
    padding:6px 8px 6px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-imoveis .filter-chip button{border:none;background:rgba(0,0,0,.08);color:inherit;width:18px;height:18px;
    border-radius:50%;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .ag-imoveis .filter-chip button:hover{background:rgba(0,0,0,.18);}
  .ag-imoveis .filter-count{font-size:12px;color:var(--text-faint);font-weight:600;}
  .ag-imoveis .empty-list{text-align:center;padding:44px 20px;background:#fff;border:1px solid var(--border);
    border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ag-imoveis .empty-list .el-ic{font-size:26px;opacity:.5;}
  .ag-imoveis .empty-list .el-t{font-size:14px;font-weight:700;}
  .ag-imoveis .empty-list .el-s{font-size:12.5px;color:var(--text-faint);max-width:340px;line-height:1.5;}
  .ag-imoveis .empty-list .btn{margin-top:8px;}
  .ag-imoveis .pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 4px;font-size:12.5px;color:var(--text-faint);}
  .ag-imoveis .pg-controls{display:flex;align-items:center;gap:4px;}
  .ag-imoveis .pg-btn{width:27px;height:27px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:12px;}
  .ag-imoveis .pg-btn:hover:not(:disabled){background:var(--bg);}
  .ag-imoveis .pg-btn:disabled{opacity:.4;cursor:default;}
  .ag-imoveis .pg-current{font-size:12.5px;font-weight:600;color:var(--text);padding:0 6px;}

  /* ---- inventory grid ---- */
  .ag-imoveis .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:14px;}
  .ag-imoveis .inv-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .ag-imoveis .inv-thumb{height:104px;background:linear-gradient(140deg,#f7f8fa 0%,#eceef2 100%);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;border-bottom:1px solid var(--border);}
  .ag-imoveis .inv-thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 120%, var(--primary-soft) 0%, transparent 62%);}
  .ag-imoveis .inv-thumb > span.em{position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(16,20,24,.16));}
  .ag-imoveis .inv-card.sold{opacity:.62;}

  /* ---- toggle switch ---- */

<script>
(function(){
  const DATA_EL = document.getElementById('ag-imoveis-data');
  const DATA = JSON.parse(DATA_EL.textContent);
  const ROOT_ID = "ag-imoveis";
  const root = document.querySelector('.' + ROOT_ID);
  const $ = (sel) => root.querySelector(sel);
  const $$ = (sel) => Array.from(root.querySelectorAll(sel));

  const state = {
    view: 'conversas',
    navId: DATA.nav.find(n=>n.view==='conversas').id,
    activeConvId: DATA.conversations[0].id,
    activeTab: 'todas',
    contactList: null,
    statusFilter: null,
    statusLabel: '',
    listQuery: '',
    unreadOnly: false,
  };

  function toast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  function initials(name){
    return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }

  const ICON_PATHS = {
    dashboard:'<path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6v-9h-6v9zm0-16v5h6V4h-6z"/>',
    inbox:'<path d="M4 13h4l1.5 3h5L16 13h4M4 13l2.5-7.5A2 2 0 018.4 4h7.2a2 2 0 011.9 1.5L20 13v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5z"/>',
    chat:'<path d="M20 12a8 8 0 01-8 8H4l2.2-2.6A8 8 0 1120 12z"/>',
    users:'<path d="M16 20v-1.5a4 4 0 00-4-4H6a4 4 0 00-4 4V20"/><circle cx="9" cy="7" r="3.5"/><path d="M17 4.2a3.5 3.5 0 010 6.6M22 20v-1.5a4 4 0 00-3-3.8"/>',
    car:'<path d="M5 16.5V19a1 1 0 01-1 1H3a1 1 0 01-1-1v-2.5M19 16.5V19a1 1 0 001 1h1a1 1 0 001-1v-2.5"/><path d="M2.5 16.5h19v-4l-1.6-4.2A2 2 0 0018 7H6a2 2 0 00-1.9 1.3L2.5 12.5v4z"/><circle cx="6.5" cy="14" r="1"/><circle cx="17.5" cy="14" r="1"/>',
    home:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20a1 1 0 001 1h11a1 1 0 001-1V9.5"/><path d="M10 21v-6h4v6"/>',
    book:'<path d="M4 4.5A2.5 2.5 0 016.5 2H19a1 1 0 011 1v15a1 1 0 01-1 1H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 17.5A2.5 2.5 0 016.5 15H20"/>',
    clipboard:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M9 11h6M9 15h4"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    credit:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>',
    swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
    megaphone:'<path d="M3 11v2a2 2 0 002 2h1l2.5 5h2.5l-2-5h1L19 20V4l-9 5H5a2 2 0 00-2 2z"/>',
    chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    check:'<path d="M9 11l3 3 6-6"/><rect x="3" y="4" width="18" height="17" rx="2"/>',
    whatsapp:'<path d="M20 12a8 8 0 01-11.9 7L4 20l1.1-4A8 8 0 1120 12z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.5 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 14.6H3a2 2 0 010-4h.1A1.6 1.6 0 004.6 8.5l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009.4 4.6V3a2 2 0 014 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1.4z"/>',
  };
  function iconSvg(key){
    const p = ICON_PATHS[key];
    if(!p) return null;
    return `<svg class="nvic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }
  function capFirst(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* ---------------- Modal ---------------- */
  function closeModal(){
    const b = $('#modalBack');
    b.classList.remove('open');
    setTimeout(()=>{ if(!b.classList.contains('open')) $('#modalBox').innerHTML=''; }, 200);
  }

  function openModal(cfg){
    const box = $('#modalBox');
    const back = $('#modalBack');
    box.innerHTML = `
      <div class="modal-head">
        <div class="mh-ic">${cfg.icon||'✏️'}</div>
        <div><h2>${cfg.title}</h2>${cfg.subtitle?`<div class="mh-sub">${cfg.subtitle}</div>`:''}</div>
        <button class="modal-x" id="mdX">✕</button>
      </div>
      <div class="modal-body">
        ${cfg.preview? '<div class="modal-preview" id="mdPreview"></div>':''}
        <div class="form-grid" id="mdFields"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="mdCancel">Cancelar</button>
        <button class="btn primary" id="mdOk">${cfg.submitLabel||'Salvar'}</button>
      </div>`;

    const wrap = $('#mdFields');
    const refs = {};
    cfg.fields.forEach(f=>{
      const d = document.createElement('div');
      d.className = 'field' + (f.wide?' wide':'');
      let input;
      if(f.type==='select'){
        input = `<select data-f="${f.k}">${f.options.map(o=>`<option value="${o.v!==undefined?o.v:o}"${(f.value!==undefined&&String(f.value)===String(o.v!==undefined?o.v:o))?' selected':''}>${o.l||o}</option>`).join('')}</select>`;
      } else if(f.type==='swatch'){
        input = `<div class="swatch-row" data-f="${f.k}">${f.options.map(o=>`<button type="button" class="swatch${o.v===f.value?' sel':''}" data-v="${o.v}" title="${o.l}" style="background:${o.v}"></button>`).join('')}</div>`;
      } else if(f.type==='photo'){
        input = `<div class="drop-zone" data-f="${f.k}" data-val="">
            <b id="dzT-${f.k}">📷 Escolher foto</b>
            <span id="dzS-${f.k}">Clique ou arraste uma imagem — ela aparece no card</span>
            <input type="file" accept="image/*"/>
          </div>`;
      } else {
        input = `<input data-f="${f.k}" type="${f.type||'text'}" value="${f.value!==undefined?f.value:''}" placeholder="${f.ph||''}"${f.step?` step="${f.step}"`:''}/>`;
      }
      d.innerHTML = `<label>${f.l}${f.req?' *':''}</label>${input}${f.h?`<div class="hintx">${f.h}</div>`:''}<div class="err">${f.errMsg||'Campo obrigatório'}</div>`;
      wrap.appendChild(d);
      refs[f.k] = d;
    });

    function readValues(){
      const out = {};
      cfg.fields.forEach(f=>{
        const d = refs[f.k];
        if(f.type==='swatch'){
          const sel = d.querySelector('.swatch.sel');
          out[f.k] = sel? sel.getAttribute('data-v') : (f.value||'');
        } else if(f.type==='photo'){
          out[f.k] = d.querySelector('.drop-zone').getAttribute('data-val') || '';
        } else {
          out[f.k] = d.querySelector('[data-f]').value;
        }
      });
      return out;
    }

    // swatch picking + live preview
    wrap.querySelectorAll('.swatch').forEach(sw=>{
      sw.onclick = ()=>{
        sw.parentElement.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));
        sw.classList.add('sel');
        refresh();
      };
    });
    wrap.querySelectorAll('[data-f]').forEach(el=>{
      if(el.classList.contains('swatch-row') || el.classList.contains('drop-zone')) return;
      el.addEventListener('input', refresh);
      el.addEventListener('change', refresh);
    });

    // photo drop zones
    wrap.querySelectorAll('.drop-zone').forEach(dz=>{
      const key = dz.getAttribute('data-f');
      const fileInput = dz.querySelector('input[type=file]');
      const loadFile = (file)=>{
        if(!file || !/^image\//.test(file.type)) return;
        const rd = new FileReader();
        rd.onload = ()=>{
          dz.setAttribute('data-val', rd.result);
          const t = dz.querySelector('#dzT-'+key), sub = dz.querySelector('#dzS-'+key);
          if(t) t.textContent = '✅ ' + file.name;
          if(sub) sub.textContent = 'Clique para trocar a foto';
          refresh();
        };
        rd.readAsDataURL(file);
      };
      dz.onclick = ()=> fileInput.click();
      fileInput.onchange = ()=> loadFile(fileInput.files[0]);
      dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', ()=> dz.classList.remove('over'));
      dz.addEventListener('drop', (e)=>{
        e.preventDefault(); dz.classList.remove('over');
        loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
      });
    });

    function refresh(){
      if(cfg.preview && $('#mdPreview')) $('#mdPreview').innerHTML = cfg.preview(readValues());
    }
    refresh();

    $('#mdX').onclick = closeModal;
    $('#mdCancel').onclick = closeModal;
    $('#mdOk').onclick = ()=>{
      const v = readValues();
      let bad = false;
      cfg.fields.forEach(f=>{
        const empty = !String(v[f.k]||'').trim();
        const invalid = f.req && empty;
        refs[f.k].classList.toggle('invalid', !!invalid);
        if(invalid) bad = true;
      });
      if(bad) return;
      cfg.onSubmit(v);
      closeModal();
    };
    back.onclick = (e)=>{ if(e.target===back) closeModal(); };
    back.classList.add('open');

  /* ---------------- Vector art (veículos / imóveis) ---------------- */
  function shade(hex, amt){
    const h = hex.replace('#','');
    const n = parseInt(h.length===3? h.split('').map(c=>c+c).join('') : h, 16);
    let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    const f = (c)=> Math.max(0, Math.min(255, Math.round(amt>0 ? c + (255-c)*amt : c*(1+amt))));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  const CAR_SHAPES = {
    sedan: {
      body:'M13,84 L13,68 C13,61 18,56 26,54 L61,47 C70,40 83,36 100,36 L120,36 C133,36 144,39 152,45 L173,57 C181,61 185,65 185,72 L185,84 Z',
      wins:['M65,49 L85,41 L103,41 L103,52 L65,52 Z','M109,41 L127,41 L145,52 L109,52 Z'],
      belt:'M30,58 L178,58', wheels:[52,148], nose:[15,60], tail:[172,60], arches:[52,148],
    },
    suv: {
      body:'M13,84 L13,62 C13,55 18,51 26,50 L47,49 L55,31 C57,27 61,25 67,25 L139,25 C146,25 150,27 152,31 L161,49 L175,51 C183,52 187,57 187,63 L187,84 Z',
      wins:['M59,33 L95,33 L95,47 L53,47 Z','M101,33 L137,33 L147,47 L101,47 Z'],
      belt:'M28,53 L180,53', wheels:[54,150], nose:[15,58], tail:[174,58], arches:[54,150],
    },
    hatch: {
      body:'M13,84 L13,66 C13,59 18,55 26,53 L57,46 C66,38 79,34 95,34 L115,34 C128,34 138,38 145,45 L161,58 C166,62 169,66 169,72 L169,84 Z',
      wins:['M61,47 L81,39 L99,39 L99,50 L61,50 Z','M105,39 L121,39 L139,50 L105,50 Z'],
      belt:'M28,56 L162,56', wheels:[50,138], nose:[15,58], tail:[156,58], arches:[50,138],
    },
    picape: {
      body:'M13,84 L13,62 C13,55 18,51 26,50 L45,49 L53,29 C55,26 59,24 65,24 L105,24 C111,24 115,26 117,30 L125,49 L189,49 L189,84 Z',
      wins:['M57,32 L87,32 L87,46 L51,46 Z','M93,32 L109,32 L117,46 L93,46 Z'],
      belt:'M28,53 L124,53', wheels:[52,160], nose:[15,58], tail:[176,58], arches:[52,160],
      bed:'M131,55 L183,55 L183,71 L131,71 Z',
    },
  };

  let __artSeq = 0;

  const KIND_HINTS = [
    ['suv', ['compass','renegade','hr-v','creta','tracker','t-cross','sw4','commander','kicks','corolla cross','duster','tiggo','pulse','fastback']],
    ['picape', ['toro','hilux','rampage','saveiro','ranger','s10','strada','montana','picape','frontier']],
    ['sedan', ['corolla','civic','city','virtus','sentra','cronos','versa','sedan']],
    ['hatch', ['polo','onix','hb20','nivus','argo','gol','hatch','ka','march']],
  ];
  function guessKind(kind, title){
    if(CAR_SHAPES[kind]) return kind;
    const t = (title||'').toLowerCase();
    for(const [k, words] of KIND_HINTS){ if(words.some(w=>t.includes(w))) return k; }
    return 'sedan';
  }

  function vehicleArt(kind, paint){
    const S = CAR_SHAPES[kind] || CAR_SHAPES.sedan;
    const base = paint || '#5b6470';
    const lightC = shade(base, .22), midC = base, darkC = shade(base, -.26), edge = shade(base, -.5);
    const isPale = /^#(f|e)/i.test(String(base));
    const glass = '#c3d0de', glassD = '#93a6bb';
    const id = 'ag' + (++__artSeq);
    const wheel = (cx)=>`
      <g>
        <circle cx="${cx}" cy="84" r="15.5" fill="#191d23"/>
        <circle cx="${cx}" cy="84" r="14" fill="#2b3038"/>
        <circle cx="${cx}" cy="84" r="8.6" fill="#d5dae1"/>
        <circle cx="${cx}" cy="84" r="8.6" fill="none" stroke="#aab1bb" stroke-width="1"/>
        <circle cx="${cx}" cy="84" r="3.2" fill="#8d949e"/>
      </g>`;
    const arch = (cx)=>`<path d="M${cx-17},84 A17,17 0 0 1 ${cx+17},84" fill="none" stroke="${edge}" stroke-width="1.4" opacity=".55"/>`;
    return `<svg class="art-svg" viewBox="0 0 200 104" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${lightC}"/>
          <stop offset="0.5" stop-color="${midC}"/>
          <stop offset="1" stop-color="${darkC}"/>
        </linearGradient>
      </defs>
      <ellipse cx="100" cy="95" rx="80" ry="5.5" fill="rgba(16,20,24,.13)"/>
      <path d="${S.body}" fill="url(#${id})" stroke="${edge}" stroke-width="${isPale?1.5:1.2}" stroke-linejoin="round"/>
      ${S.bed? `<path d="${S.bed}" fill="${darkC}" opacity=".55" stroke="${edge}" stroke-width="1"/>`:''}
      ${S.wins.map(w=>`<path d="${w}" fill="${glass}" stroke="${glassD}" stroke-width="1" stroke-linejoin="round"/>`).join('')}
      <path d="${S.belt}" stroke="${edge}" stroke-width="1" opacity=".45"/>
      <rect x="${S.nose[0]}" y="${S.nose[1]}" width="13" height="7" rx="3.5" fill="#ffe6a0" stroke="${edge}" stroke-width=".9"/>
      <rect x="${S.tail[0]}" y="${S.tail[1]}" width="11" height="6.5" rx="3" fill="#e2564a" stroke="${edge}" stroke-width=".9"/>
      ${S.arches.map(arch).join('')}
      <path d="M13,84 L${S.bed?189:185},84" stroke="${edge}" stroke-width="1.2" opacity=".7"/>
      ${S.wheels.map(wheel).join('')}
    </svg>`;
  }

  const PROP_SHAPES = {
    apto:    {floors:5, cols:3, roofPeak:false},
    alto:    {floors:7, cols:3, roofPeak:false},
    studio:  {floors:3, cols:2, roofPeak:false},
    locacao: {floors:4, cols:3, roofPeak:false},
    comercial:{floors:6, cols:4, roofPeak:false},
    casa:    {floors:2, cols:3, roofPeak:true},
  };

  function propertyArt(kind, tint){
    const S = PROP_SHAPES[kind] || PROP_SHAPES.apto;
    const base = tint || '#7C3AED';
    const wall = '#f2f3f6', wallD = '#dfe2e8', edge = '#c3c8d1';
    const win = shade(base, .55), winD = shade(base, .18);
    const W = S.roofPeak? 116 : 96, X = (200-W)/2;
    const topY = S.roofPeak? 34 : 16;
    const H = 92 - topY;
    const rows = [];
    const padX = 12, padY = S.roofPeak? 10 : 12;
    const availW = W - padX*2, availH = H - padY - 22;
    const wW = Math.min(17, (availW - (S.cols-1)*8)/S.cols);
    const wH = Math.min(13, (availH - (S.floors-1)*7)/S.floors);
    for(let r=0;r<S.floors;r++){
      for(let c=0;c<S.cols;c++){
        const x = X + padX + c*(wW+8);
        const y = topY + padY + r*(wH+7);
        const lit = ((r*S.cols+c) % 3 === 0);
        rows.push(`<rect x="${x}" y="${y}" width="${wW}" height="${wH}" rx="2.5" fill="${lit?win:winD}" stroke="${edge}" stroke-width=".7"/>`);
      }
    }
    return `<svg class="art-svg" viewBox="0 0 200 112" preserveAspectRatio="xMidYMid meet">
      <ellipse cx="100" cy="99" rx="72" ry="6" fill="rgba(16,20,24,.10)"/>
      ${S.roofPeak? `<path d="M${X-10},${topY+2} L100,10 L${X+W+10},${topY+2} Z" fill="${shade(base,-.15)}" stroke="${shade(base,-.4)}" stroke-width="1.1" stroke-linejoin="round"/>`
                  : `<rect x="${X-6}" y="${topY-6}" width="${W+12}" height="8" rx="3" fill="${shade(base,-.1)}"/>`}
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="${wall}" stroke="${edge}" stroke-width="1.2"/>
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="url(#none)" />
      ${rows.join('')}
      <rect x="${100-11}" y="72" width="22" height="20" rx="2.5" fill="${shade(base,-.05)}" stroke="${shade(base,-.35)}" stroke-width="1"/>
      <circle cx="${100+5}" cy="82" r="1.6" fill="#fff"/>
      <rect x="${X-4}" y="90" width="${W+8}" height="4" rx="2" fill="${wallD}"/>
    </svg>`;
  }

  const PAINT_NAMES = [
    ['cinza grafite','#4a4f57'],['grafite','#4a4f57'],['branco pérola','#f2f3f5'],['branco polar','#f4f5f7'],
    ['branco','#f2f3f5'],['preto','#23272e'],['prata','#c2c6cc'],['vermelho','#b0271f'],
    ['azul','#1f4f8f'],['verde','#1f6b4a'],['cinza','#8f959e'],['bege','#cbbfa6'],
  ];
  function paintOf(it){
    if(it.paint) return it.paint;
    const t = ((it.sub||'') + ' ' + (it.extra||'')).toLowerCase();
    for(const [name, hex] of PAINT_NAMES){ if(t.includes(name)) return hex; }
    return '#6b7280';
  }

  function itemArt(it){
    if(it.photo){
      return `<img class="art-photo" src="${it.photo}" alt="${(it.title||'').replace(/"/g,'')}"/>`;
    }
    const style = (DATA.inventoryView && DATA.inventoryView.artStyle) || it.artStyle;
    if(style==='vehicle') return vehicleArt(guessKind(it.art || it.category, it.title || it.sub), paintOf(it));
    if(style==='property') return propertyArt(it.art || it.category, DATA.accent);
    return `<span class="icon-badge"><span class="em">${it.emoji||'📦'}</span></span>`;
  }

  const AVATAR_COLORS = ['#EF6C42','#7C3AED','#2563EB','#0EA5A4','#DB2777','#F59E0B','#16A34A','#6366F1'];
  function colorFor(id){
    let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0)) % 997;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  /* ---------------- Sidebar / Nav (folder tree) ---------------- */
  function collectExpandable(items){
    let ids=[];
    (items||[]).forEach(i=>{ if(i.children && i.children.length){ ids.push(i.id); ids = ids.concat(collectExpandable(i.children)); } });
    return ids;
  }
  state.expanded = new Set(collectExpandable(DATA.nav));

  function nodeIsActive(item){
    if(item.id===state.navId) return true;
    if(item.children) return item.children.some(nodeIsActive);
    return false;
  }

  function renderNav(){
    const nav = $('#navList');
    nav.innerHTML = '';
    DATA.nav.forEach(item=>{
      if(item.section){
        const lab = document.createElement('div');
        lab.className='nav-label';
        lab.textContent = item.section;
        nav.appendChild(lab);
        return;
      }
      nav.appendChild(renderNode(item, 0, null));
    });
  }

  function renderNode(item, depth, ctx){
    const wrap = document.createElement('div');
    const hasChildren = item.children && item.children.length;
    const isTag = !!item.tagColor;
    const newCtx = item.view ? item : ctx;

    const btn = document.createElement('button');
    let active = item.id===state.navId;
    btn.className = 'nav-item' + (active ? ' active':'');
    btn.style.paddingLeft = (8 + depth*13) + 'px';
    const chev = hasChildren ? `<span class="chev${state.expanded.has(item.id)?' open':''}">▸</span>` : (depth>0 ? '<span class="chev-spacer"></span>' : '');
    const svg = item.icon ? iconSvg(item.icon) : null;
    const iconHtml = isTag
      ? `<span class="tag-dot" style="background:${item.tagColor}"></span>`
      : (svg ? `<span class="ic">${svg}</span>`
             : (item.icon ? `<span class="ic">${item.icon}</span>`
                          : (depth>0? '<span class="chev-spacer"></span>' : '')));
    btn.innerHTML = chev + iconHtml + `<span>${item.label}</span>` + (item.count!==undefined? `<span class="count">${item.count}</span>`:'');
    btn.onclick = ()=>{
      if(hasChildren){
        if(state.expanded.has(item.id)) state.expanded.delete(item.id); else state.expanded.add(item.id);
        renderNav();
        return;
      }
      if(isTag){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses || [item.label], statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.filter){
        if(!ctx) return;
        activateWithFilter(ctx, { unreadOnly: item.filter==='unread', navId: item.id });
        return;
      }
      if(item.statuses){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses, statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.view){ selectNav(item); }
    };
    wrap.appendChild(btn);

    if(hasChildren && state.expanded.has(item.id)){
      const kids = document.createElement('div');
      kids.className='nav-children';
      item.children.forEach(c=> kids.appendChild(renderNode(c, depth+1, newCtx)));
      wrap.appendChild(kids);
    }
    return wrap;
  }

  function activateWithFilter(ctx, opts){
    selectNav(ctx, true);
    if(opts.list) state.contactList = opts.list;
    state.listQuery = '';
    state.statusFilter = opts.statuses || null;
    state.statusLabel = opts.statusLabel || '';
    state.unreadOnly = !!opts.unreadOnly;
    if(opts.navId){ state.navId = opts.navId; renderNav(); }
    if(ctx.view==='conversas'){
      $('#listSearch').value = '';
      renderConvList();
    } else if(ctx.view==='contacts'){
      renderContacts();
      cvPage = 1;
      paintContactsList('');
    }
  }

  function clearStatusFilter(){
    state.statusFilter = null;
    state.statusLabel = '';
    cvPage = 1;
    paintContactsList($('#cvSearch') ? $('#cvSearch').value : '');
  }

  function selectNav(item, keepNavId){
    state.navId = item.id;
    state.view = item.view;
    if(item.view==='contacts') state.contactList = item.list || null;
    if(!keepNavId){ state.listQuery=''; state.unreadOnly=false; state.statusFilter=null; state.statusLabel=''; }
    renderNav();
    if(item.view==='conversas'){
      $('#listCol').style.display='flex';
      $('#chatCol').style.display='flex';
      $('#fullView').style.display='none';
      if(!keepNavId){ $('#listSearch').value=''; }
      renderConvList();
      renderChat();
    } else {
      $('#listCol').style.display='none';
      $('#chatCol').style.display='none';
      $('#fullView').style.display='flex';
      if(item.view==='contacts') renderContacts();
      else if(item.view==='agenda') renderCalendar();
      else if(item.view==='inventory') renderInventory();
      else if(item.view==='campaigns') renderCampaigns();
      else if(item.view==='dashboard') renderDashboard();
      else if(item.view==='finance') renderFinance();
      else if(item.view==='trades') renderTrades();
      else if(item.view==='reports') renderReports();
      else if(item.view==='tasks') renderTasks();
      else if(item.view==='whatsapp') renderWhatsapp();
      else if(item.view==='settings') renderSettings();
      else if(item.view==='billing') renderBilling();
      else if(item.view==='services') renderServices();
      else if(item.view==='margem') renderMargem();
      else if(item.view==='reativacao') renderReativacao();
      else renderPlaceholder(item.label);
    }
    $('#appRoot').classList.add('chat-mobile');
    $('#sidebar').classList.remove('open');
  }

  /* ---------------- Conversation list ---------------- */
  function filteredConvs(){
    let list = DATA.conversations.slice();
    if(state.activeTab && state.activeTab!=='todas'){
      list = list.filter(c => (c.tabs||[]).includes(state.activeTab));
    }
    if(state.unreadOnly) list = list.filter(c=>c.unread);
    if(state.listQuery){
      const q = state.listQuery.toLowerCase();
      list = list.filter(c => c.name.toLowerCase().includes(q) || c.preview.toLowerCase().includes(q));
    }
    return list;
  }

  function renderTabs(){
    const row = $('#tabsRow');
    row.innerHTML='';
    (DATA.filterTabs||[]).forEach(t=>{
      const chip = document.createElement('button');
      chip.className = 'tab-chip' + (state.activeTab===t.id?' active':'');
      const count = t.id==='todas' ? DATA.conversations.length : DATA.conversations.filter(c=>(c.tabs||[]).includes(t.id)).length;
      chip.textContent = `${t.label} ${count}`;
      chip.onclick = ()=>{ state.activeTab=t.id; renderTabs(); renderConvList(); };
      row.appendChild(chip);
    });
  }

  function renderConvList(){
    const scroll = $('#convScroll');
    scroll.innerHTML='';
    const list = filteredConvs();
    if(!list.length){
      scroll.innerHTML = `<div style="padding:30px 16px;text-align:center;color:var(--text-faint);font-size:13px;">Nenhuma conversa encontrada.</div>`;
      return;
    }
    list.forEach(c=>{
      const el = document.createElement('div');
      el.className = 'conv-item' + (c.id===state.activeConvId?' active':'');
      const avaColor = colorFor(c.id);
      el.innerHTML = `
        <div class="conv-ava" style="background:${avaColor}">${initials(c.name)}</div>
        <div class="conv-body">
          <div class="conv-top">
            <div class="conv-name">${c.name}</div>
            <div class="conv-time">${c.time}</div>
          </div>
          <div class="conv-prev">${c.preview}</div>
          <div class="conv-tags">
            ${(c.tags||[]).map(t=>`<span class="mini-tag">${t}</span>`).join('')}
            ${c.resolved?'<span class="resolved-pill">Resolvida</span>':''}
          </div>
        </div>
        ${c.unread?'<div class="unread-dot"></div>':''}
      `;
      el.onclick = ()=>{ c.unread=false; state.activeConvId=c.id; renderConvList(); renderChat(); $('#appRoot').classList.add('chat-mobile'); };
      scroll.appendChild(el);
    });
  }

  /* ---------------- Chat panel ---------------- */
  function getConv(id){ return DATA.conversations.find(c=>c.id===id); }

  function renderChat(){
    const c = getConv(state.activeConvId);

    if(!c){ col.innerHTML = `<div class="empty-chat"><div class="em-ic">💬</div><div>Selecione uma conversa</div></div>`; return; }

  function renderMessages(){
    const c = getConv(state.activeConvId);
    const scroll = $('#chatScroll');
    scroll.innerHTML = `<div class="day-sep">Hoje</div>`;
    const avaColor = colorFor(c.id);
    c.messages.forEach(m=>{
      if(m.note){
        const n = document.createElement('div');
        n.className='note-row';
        n.innerHTML = `📌 <b>Nota interna</b> · ${m.note}`;
        scroll.appendChild(n);
        return;
      }
      if(m.system){
        const n = document.createElement('div');
        n.className='sys-row';
        n.textContent = m.system;
        scroll.appendChild(n);
        return;
      }
      if(m.cards){
        const row = document.createElement('div');
        row.className='cards-row';
        row.innerHTML = `<div class="cards-label">📎 ${m.cardsLabel || 'Fotos e detalhes enviados'}</div>` + m.cards.map(card=>`
          <div class="item-card">
            <div class="thumb">${(card.photo || card.art)? itemArt({category:card.art, art:card.art, paint:card.paint, photo:card.photo, emoji:card.emoji, title:card.sub}) : `<span class="em" style="font-size:34px">${card.emoji||'🏷️'}</span>`}</div>
            <div class="ic-body">
              <div class="price">${card.title}</div>
              <div class="sub">${card.sub}</div>
              <div class="loc">${card.extra||''}</div>
            </div>
          </div>`).join('');
        scroll.appendChild(row);
        return;
      }
      const wrap = document.createElement('div');
      const isAgent = m.from==='agent';
      wrap.className = 'msg-row ' + (isAgent ? 'out':'in');
      const ava = isAgent
        ? `<div class="msg-ava">${DATA.agentInitials||'AG'}</div>`
        : `<div class="msg-ava" style="background:${avaColor}">${initials(c.name)}</div>`;
      wrap.innerHTML = ava + `<div class="msg-wrap"><div class="msg-bubble">${m.text}</div><div class="msg-time">${m.time}${isAgent?' ✓✓':''}</div></div>`;
      scroll.appendChild(wrap);
    });

  function renderQuickReplies(){
    const row = $('#quickRow');
    row.innerHTML='';
    (DATA.quickReplies||[]).forEach(q=>{
      const chip = document.createElement('button');
      chip.className='quick-chip';
      chip.textContent = q.label;
      chip.onclick = ()=>{
        const input = $('#msgInput');
        input.value = q.text;
        input.focus();
      };
      row.appendChild(chip);
    });

  function nowTime(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }

  function sendMessage(){
    const input = $('#msgInput');
    const text = input.value.trim();
    if(!text) return;
    const c = getConv(state.activeConvId);
    c.messages.push({from:'agent', text: escapeHtml(text), time: nowTime()});
    c.preview = text;
    c.time = 'Agora';
    input.value='';
    renderMessages();
    renderConvList();
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function simulateIncoming(c){
    const scroll = $('#chatScroll');
    const typing = document.createElement('div');
    typing.className='typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    scroll.appendChild(typing);
    scroll.scrollTop = scroll.scrollHeight;
    setTimeout(()=>{
      typing.remove();
      const replies = DATA.simReplies || ['Perfeito, muito obrigado pela atenção!', 'Combinado então 👍', 'Pode ser, sim!'];
      const text = replies[Math.floor(Math.random()*replies.length)];
      c.messages.push({from:'client', text, time: nowTime()});
      c.preview = text; c.time='Agora'; c.unread = state.activeConvId!==c.id;
      renderMessages();
      renderConvList();
      toast('Nova mensagem simulada do cliente 📩');
    }, 1300);
  }

  function openConversationFor(name){
    const nav = DATA.nav.find(n=>n.view==='conversas');
    if(nav) selectNav(nav);
    const first = String(name).split(' ')[0];
    const hit = DATA.conversations.find(c=>c.name.toLowerCase().includes(first.toLowerCase()));
    if(hit){
      hit.unread = false;
      state.activeConvId = hit.id;
      renderConvList(); renderChat();
      toast('Conversa de ' + hit.name + ' aberta');

      toast('Nenhuma conversa aberta com ' + name + ' ainda — inicie uma nova.');

  function paintContactsList(q){
    const cv = currentContactsView();
    q = (q||'').toLowerCase();
    let rows = cv.rows;
    if(state.statusFilter && state.statusFilter.length){
      const want = state.statusFilter.map(x=>String(x).toLowerCase());
      rows = rows.filter(r => want.includes(String(r.status.text).toLowerCase()));
    }
    rows = rows.filter(r => !q || (r.name+' '+r.phone+' '+r.tag+' '+r.status.text).toLowerCase().includes(q));
    const total = rows.length;
    const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
    if(cvPage>totalPages) cvPage = totalPages;
    const start = (cvPage-1)*PAGE_SIZE;
    const pageRows = rows.slice(start, start+PAGE_SIZE);

    const fb = $('#cvFilterBar');
    if(fb){
      if(state.statusFilter && state.statusFilter.length){
        const col = (cv.statusOptions||[]).find(o=>o.t.toLowerCase()===String(state.statusLabel).toLowerCase());
        fb.innerHTML = `<span class="filter-chip" style="${col?`background:${col.c}1a;color:${col.c}`:''}">
            <span class="status-dot" style="background:${col?col.c:'var(--primary)'}"></span>
            ${state.statusLabel || state.statusFilter.join(', ')}
            <button id="cvClearFilter" title="Remover filtro">✕</button>
          </span>
          <span class="filter-count">${total} de ${cv.rows.length} ${cv.itemLabel||'registros'}</span>`;
        fb.style.display = 'flex';
        const cb = $('#cvClearFilter');
        if(cb) cb.onclick = clearStatusFilter;
      } else {
        fb.innerHTML = '';
        fb.style.display = 'none';
      }
    }

    const wrap = $('#cvListWrap');
    wrap.innerHTML = pageRows.map((r,idx)=>`
      <div class="contact-card" data-idx="${idx}">
        <div class="cc-ava" style="background:${colorFor(r.name)}">${initials(r.name)}</div>
        <div class="cc-body">
          <div class="cc-name">${r.name}</div>
          <div class="cc-sub"><span>${r.phone}</span><span>·</span><span>${r.tag}</span><span>·</span><span class="lk">Ver detalhes</span></div>
        </div>
        <div class="cc-status"><span class="status-dot" style="background:${r.status.color}"></span>${r.status.text}</div>
        <button class="cc-menu-btn" data-menu="${idx}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>`).join('') || `<div class="empty-list">
        <div class="el-ic">🔍</div>
        <div class="el-t">Nenhum registro nesse filtro</div>
        <div class="el-s">${state.statusFilter? 'Não há '+(cv.itemLabel||'registros')+' marcados como “'+state.statusLabel+'” no momento.' : 'Tente outro termo de busca.'}</div>
        ${state.statusFilter? '<button class="btn" id="elClear">Ver todos</button>':''}
      </div>`;

    const elc = $('#elClear');
    if(elc) elc.onclick = clearStatusFilter;

    wrap.querySelectorAll('.cc-menu-btn').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const idx = btn.getAttribute('data-menu');
        const card = btn.closest('.contact-card');
        const existing = card.querySelector('.cc-dropdown');
        wrap.querySelectorAll('.cc-dropdown').forEach(d=>d.remove());
        if(existing) return;
        const dd = document.createElement('div');
        dd.className='cc-dropdown';
        dd.innerHTML = `<button data-a="msg">💬 Abrir conversa</button><button data-a="edit">📄 Ver ficha completa</button><button data-a="del">🗑️ Remover</button>`;
        dd.querySelectorAll('button').forEach(b=> b.onclick=(ev)=>{
          ev.stopPropagation();
          const a = b.getAttribute('data-a');
          dd.remove();
          const rowRef = pageRows[Number(idx)];
          if(a==='msg') openConversationFor(rowRef.name);
          else if(a==='edit') openContactDrawer(rowRef, cv);
          else toast('Remoção — disponível na versão completa.');
        });
        card.appendChild(dd);
      };
    });
    wrap.querySelectorAll('.contact-card').forEach((card, i)=>{
      card.addEventListener('click', ()=>{
        wrap.querySelectorAll('.cc-dropdown').forEach(d=>d.remove());
        openContactDrawer(pageRows[i], cv);
      });
    });

    const pager = $('#cvPagerWrap');
    const from = total? start+1 : 0;
    const to = Math.min(start+PAGE_SIZE, total);
    pager.innerHTML = `
      <div class="pagination-bar">
        <span>Exibindo ${from} - ${to} de ${total} ${cv.itemLabel||'contatos'}</span>
        <div class="pg-controls">
          <button class="pg-btn" id="pgFirst" ${cvPage<=1?'disabled':''}>«</button>
          <button class="pg-btn" id="pgPrev" ${cvPage<=1?'disabled':''}>‹</button>
          <span class="pg-current">${cvPage} de ${totalPages}</span>
          <button class="pg-btn" id="pgNext" ${cvPage>=totalPages?'disabled':''}>›</button>
          <button class="pg-btn" id="pgLast" ${cvPage>=totalPages?'disabled':''}>»</button>
        </div>
      </div>`;
    $('#pgFirst').onclick = ()=>{ cvPage=1; paintContactsList(q); };
    $('#pgPrev').onclick = ()=>{ cvPage=Math.max(1,cvPage-1); paintContactsList(q); };
    $('#pgNext').onclick = ()=>{ cvPage=Math.min(totalPages,cvPage+1); paintContactsList(q); };
    $('#pgLast').onclick = ()=>{ cvPage=totalPages; paintContactsList(q); };
  }

  /* ---------------- Gerenciador de fotos ---------------- */
  function normalizeName(t){
    return String(t).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/\.(jpe?g|png|webp|avif|gif)$/,'')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  // casa o nome do arquivo com o item de estoque por palavras em comum
  function matchItemIndex(fileName, items){
    const fw = normalizeName(fileName).split(' ').filter(w => w.length > 2);
    if(!fw.length) return -1;
    let best = -1, bestScore = 0;
    items.forEach((it, i)=>{
      const tw = normalizeName(it.title).split(' ').filter(Boolean);
      let score = 0;
      fw.forEach(w=>{ if(tw.some(t => t === w || (w.length>3 && t.startsWith(w)) || (t.length>3 && w.startsWith(t)))) score++; });
      // exige pelo menos duas palavras batendo, ou uma bem específica (modelo)
      const strong = score >= 2 || (score === 1 && fw.length === 1 && fw[0].length >= 4);
      if(strong && score > bestScore){ bestScore = score; best = i; }
    });
    return best;
  }

  // reduz a imagem para não inchar o arquivo exportado
  function shrinkImage(file, maxW, quality){
    return new Promise(function(resolve, reject){
      const rd = new FileReader();
      rd.onerror = reject;
      rd.onload = function(){
        const img = new Image();
        img.onerror = reject;
        img.onload = function(){
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(cv.toDataURL('image/jpeg', quality)); }
          catch(e){ resolve(rd.result); }
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  async function handlePhotoFiles(fileList){
    const iv = DATA.inventoryView;
    const files = Array.prototype.slice.call(fileList || []).filter(f => /^image\//.test(f.type));
    if(!files.length) return;

    // foto individual pedida por um item específico
    if(pmPending !== null && iv.items[pmPending]){
      const uri = await shrinkImage(files[0], 640, .72);
      iv.items[pmPending].photo = uri;
      pmPending = null;
      paintPhotoList();
      toast('Foto aplicada ✅');
      return;
    }

    let hit = 0;
    const misses = [];
    for(const f of files){
      const idx = matchItemIndex(f.name, iv.items);
      if(idx < 0){ misses.push(f.name); continue; }
      iv.items[idx].photo = await shrinkImage(f, 640, .72);
      hit++;
    }
    paintPhotoList(misses);
    if(hit && !misses.length) toast(hit + ' foto(s) aplicadas automaticamente ✅');
    else if(hit) toast(hit + ' aplicadas · ' + misses.length + ' sem correspondência');
    else toast('Nenhum nome bateu — use o botão da linha para escolher manualmente');
  }

  /* ---------------- Calendar ---------------- */
  const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
  const DOW_FULL = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  let calCursor = null;
  let calSelected = null;

  function todayISO(){
    const t = DATA.calendarView && DATA.calendarView.today;
    return t || new Date().toISOString().slice(0,10);
  }
  function isoOf(y,m,d){
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }
  function parseISO(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function evTypeMeta(type){
    const t = (DATA.calendarView.types||[]).find(x=>x.id===type);

  function paintCalendar(){
    const cv = DATA.calendarView;
    const evs = calFilteredEvents();
    const byDate = {};
    evs.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
    Object.values(byDate).forEach(a=>a.sort((x,y)=> x.time.localeCompare(y.time)));

    $('#calMonthLabel').textContent = capFirst(MONTHS[calCursor.m]) + ' de ' + calCursor.y;

    // KPIs for the visible month
    const monthPrefix = calCursor.y + '-' + String(calCursor.m+1).padStart(2,'0');
    const monthEvs = evs.filter(e=>e.date.startsWith(monthPrefix));
    const todayEvs = byDate[todayISO()] || [];
    const confirmed = monthEvs.filter(e=>e.status==='Confirmado').length;
    const pending = monthEvs.filter(e=>e.status==='Pendente').length;
    $('#calKpis').innerHTML = `
      <div class="kpi"><div class="l">📅 No mês</div><div class="v">${monthEvs.length}</div><div class="d flat">compromissos agendados</div></div>
      <div class="kpi"><div class="l">⏱️ Hoje</div><div class="v">${todayEvs.length}</div><div class="d flat">na agenda de hoje</div></div>
      <div class="kpi"><div class="l">✅ Confirmados</div><div class="v">${confirmed}</div><div class="d up">${monthEvs.length? Math.round(confirmed/monthEvs.length*100):0}% do mês</div></div>
      <div class="kpi"><div class="l">⚠️ A confirmar</div><div class="v">${pending}</div><div class="d down">exigem follow-up</div></div>
    `;

    // grid
    const first = new Date(calCursor.y, calCursor.m, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(calCursor.y, calCursor.m+1, 0).getDate();
    const daysPrev = new Date(calCursor.y, calCursor.m, 0).getDate();
    const cells = [];
    for(let i=startOffset-1;i>=0;i--){
      const d = daysPrev-i;
      const pm = calCursor.m===0? 11 : calCursor.m-1;
      const py = calCursor.m===0? calCursor.y-1 : calCursor.y;
      cells.push({iso:isoOf(py,pm,d), d, other:true});
    }
    for(let d=1;d<=daysInMonth;d++) cells.push({iso:isoOf(calCursor.y,calCursor.m,d), d, other:false});
    while(cells.length % 7 !== 0 || cells.length < 35){
      const idx = cells.length - (startOffset + daysInMonth) + 1;
      const nm = calCursor.m===11? 0 : calCursor.m+1;
      const ny = calCursor.m===11? calCursor.y+1 : calCursor.y;
      cells.push({iso:isoOf(ny,nm,idx), d:idx, other:true});
    }

    const grid = $('#calGrid');
    grid.innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('') +
      cells.map(c=>{
        const dayEvs = byDate[c.iso] || [];
        const shown = dayEvs.slice(0,3);
        const rest = dayEvs.length - shown.length;
        const cls = ['cal-cell'];
        if(c.other) cls.push('other');
        if(c.iso===todayISO()) cls.push('today');
        if(c.iso===calSelected) cls.push('sel');
        return `<div class="${cls.join(' ')}" data-iso="${c.iso}">
          <div class="cal-num">${c.d}</div>
          ${shown.map(e=>{ const m=evTypeMeta(e.type); return `<div class="cal-ev" style="background:${m.soft};color:${m.color}">${e.time} ${e.who}</div>`; }).join('')}
          ${rest>0? `<div class="cal-more">+${rest} mais</div>`:''}
        </div>`;
      }).join('');
    grid.querySelectorAll('.cal-cell').forEach(cell=>{
      cell.onclick = ()=>{
        calSelected = cell.getAttribute('data-iso');
        const d = parseISO(calSelected);
        if(d.getMonth()!==calCursor.m){ calCursor = {y:d.getFullYear(), m:d.getMonth()}; }
        paintCalendar();
      };
    });

    // selected day panel
    const selEvs = byDate[calSelected] || [];
    const sd = parseISO(calSelected);
    $('#calDayPanel').innerHTML = `
      <div class="cal-side-head">
        <span class="d">${sd.getDate()} de ${capFirst(MONTHS[sd.getMonth()])}</span>
        <span class="n">${DOW_FULL[sd.getDay()]}</span>
      </div>
      <button class="btn" id="calDayAdd" style="width:100%;justify-content:center;margin-bottom:10px;">+ Adicionar neste dia</button>
      ${selEvs.length? selEvs.map(e=>{ const m=evTypeMeta(e.type); return `
        <div class="slot">
          <div class="slot-time">${e.time}</div>
          <div class="slot-bar" style="background:${m.color}"></div>
          <div class="slot-body">
            <div class="slot-title">${e.title}</div>
            <div class="slot-sub">${e.who}${e.note? ' · '+e.note : ''}</div>
            <span class="slot-tag" style="background:${m.soft};color:${m.color}">${e.status}</span>
          </div>
        </div>`; }).join('') : '<div class="cal-empty">Nenhum compromisso neste dia.<br/>Clique em outro dia do calendário.</div>'}
    `;
    $('#calDayPanel').querySelectorAll('.slot').forEach(s=> s.onclick = ()=> toast('Detalhe do agendamento — disponível na versão completa.'));
    const addBtn = $('#calDayAdd');
    if(addBtn) addBtn.onclick = ()=> openNewEventModal(calSelected);

    // upcoming panel
    const upcoming = evs.filter(e=> e.date >= todayISO()).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);
    $('#calNextPanel').innerHTML = `
      <h3>Próximos compromissos</h3>
      <div class="ph-sub">Ordenados por data</div>
      ${upcoming.map(e=>{ const m=evTypeMeta(e.type); const d=parseISO(e.date); return `
        <div class="slot">
          <div class="slot-time">${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}</div>
          <div class="slot-bar" style="background:${m.color}"></div>
          <div class="slot-body">
            <div class="slot-title">${e.who}</div>
            <div class="slot-sub">${e.time} · ${e.title}</div>
          </div>
        </div>`; }).join('') || '<div class="cal-empty">Nada por vir.</div>'}
    `;
    $('#calNextPanel').querySelectorAll('.slot').forEach(s=> s.onclick = ()=> toast('Detalhe do agendamento — disponível na versão completa.'));
  }

                </tr>`).join('')}
            </tbody>
          </table>

        </div>
      </div>`;

    $('#finNew').onclick = ()=> openNewSimModal(lastCalc);

    lastCalc = null;
    function priceOf(i){ return Number(String(DATA.inventoryView.items[i].price).replace(/[^\d]/g,'')); }
    valor.value = priceOf(0);
    function calc(){
      const P = Math.max(0, Number(valor.value)||0);
      const E = Math.min(P, Math.max(0, Number($('#finEntrada').value)||0));
      const n = Number($('#finParc').value)||(DATA.financeView.defaultTerm||48);
      const i = (Number($('#finTaxa').value)||0)/100;
      const fin = P - E;
      const parcela = i>0 ? fin * (i*Math.pow(1+i,n))/(Math.pow(1+i,n)-1) : (n? fin/n : 0);
      const total = parcela*n;
      const juros = total - fin;
      lastCalc = {P, E, n, i, fin, parcela, itemIdx: Number(veic.value)||0};
      const grand = Math.max(1, E + fin + juros);
      $('#finResult').innerHTML = `

        <div class="rb small"><div class="l">Juros do período</div><div class="v">${brl(juros)}</div></div>
        <div class="rb small"><div class="l">Entrada</div><div class="v">${brl(E)}</div></div>`;
      const compo = $('#finCompo');
      if(compo){
        const seg = (label, val, cls)=> val<=0 ? '' :
          `<div class="cmp-seg ${cls}" style="width:${(val/grand*100).toFixed(2)}%" title="${label}: ${brl(val)}"></div>`;
        compo.innerHTML = `
          <div class="cmp-bar">${seg('Entrada',E,'a')}${seg('Principal financiado',fin,'b')}${seg('Juros',juros,'c')}</div>
          <div class="cmp-leg">
            <span><i class="a"></i>Entrada ${brl(E)}</span>
            <span><i class="b"></i>Principal ${brl(fin)}</span>
            <span><i class="c"></i>Juros ${brl(juros)}</span>
            <span class="cmp-tot">${n}x · ${((juros/Math.max(1,fin))*100).toFixed(0)}% de juros sobre o financiado</span>
          </div>`;
      }
    }
    veic.onchange = ()=>{ valor.value = priceOf(Number(veic.value)); calc(); };
    ['finValor','finEntrada','finParc','finTaxa'].forEach(id=>{
      $('#'+id).addEventListener('input', calc);
      $('#'+id).addEventListener('change', calc);
    });
    fv.querySelectorAll('[data-sim]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); toast('Abrindo PDF da simulação — disponível na versão completa.'); });
    calc();
  }

  function dueMeta(due){
    if(!due) return null;
    const today = todayISO();
    const d = parseISO(due);
    const label = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    if(due < today) return {label: label + ' · atrasada', cls:'late'};
    if(due === today) return {label:'hoje', cls:'today'};
    const diff = Math.round((d - parseISO(today)) / 86400000);
    if(diff === 1) return {label:'amanhã', cls:'soon'};
    if(diff <= 3) return {label:'em ' + diff + ' dias', cls:'soon'};
    return {label: label, cls:''};
  }

        ${items.map(t=>{
          const gi = tv.tasks.indexOf(t);
          const pc = tv.prios[t.prio] || {color:'#6b7280',soft:'#f1f2f4'};
          const due = dueMeta(t.due);
          const done = t.checklist ? t.checklist.done : null;
          const total = t.checklist ? t.checklist.total : null;
          const pct = total ? Math.round(done/total*100) : 0;
          return `<div class="kb-card ${prioClass[t.prio]||''}" draggable="true" data-idx="${gi}" style="background:#fff">
            <button class="kb-del" data-del="${gi}" title="Excluir">✕</button>

            ${(t.tags&&t.tags.length)? `<div class="kb-tags">${t.tags.map(x=>`<span class="kb-tag">${x}</span>`).join('')}</div>`:''}
            ${total? `<div class="kb-prog">
                <div class="kb-prog-bar"><span style="width:${pct}%"></span></div>
                <span class="kb-prog-n">${done}/${total}</span>
              </div>`:''}
            <div class="m">
              <span class="kb-chip" style="background:${pc.soft};color:${pc.color}">${t.prio}</span>
              ${due? `<span class="kb-chip kb-due ${due.cls}">🗓 ${due.label}</span>`:''}

            </div>
          </div>`;
        }).join('') || '<div class="kb-empty">Solte um cartão aqui</div>'}
        </div>
      </div>`;
    }).join('');

    board.querySelectorAll('.kb-card').forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        dragTaskIdx = Number(card.getAttribute('data-idx'));
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', String(dragTaskIdx)); }catch(err){}
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        board.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drop'));
      });
    });

    board.querySelectorAll('.kb-col').forEach(col=>{
      col.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; col.classList.add('drop'); });
      col.addEventListener('dragleave', (e)=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop', (e)=>{
        e.preventDefault();
        col.classList.remove('drop');
        let idx = dragTaskIdx;
        if(idx===null || idx===undefined){
          const raw = e.dataTransfer.getData('text/plain');
          idx = raw===''? null : Number(raw);
        }
        if(idx===null || Number.isNaN(idx)) return;
        const target = col.getAttribute('data-col');
        const t = tv.tasks[idx];
        if(!t || t.col===target){ dragTaskIdx=null; return; }
        t.col = target;
        dragTaskIdx = null;
        paintTasks();
        const cl = tv.columns.find(c=>c.id===target);
        toast('Movida para "' + (cl?cl.label:target) + '"');
      });
    });

    board.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const i = Number(b.getAttribute('data-del'));
        const t = tv.tasks[i];
        tv.tasks.splice(i,1);
        paintTasks();
        toast('Tarefa "' + (t?t.title:'') + '" excluída');
      };
    });
  }

    $('#svKpis').innerHTML = `

  function margemCalc(it){
    const receita = it.price * it.sold;
    const custo = it.cost * it.sold;
    const lucro = receita - custo;
    const pct = it.price ? ((it.price - it.cost) / it.price * 100) : 0;
    return {receita, custo, lucro, pct};
  }

  function paintMargem(){
    const mv = DATA.margemView;
    const q = ($('#mgSearch') ? $('#mgSearch').value : '').toLowerCase();

    const todos = mv.items.map(it=> Object.assign({}, it, margemCalc(it)));
    const receita = todos.reduce((a,x)=>a+x.receita, 0);
    const custo = todos.reduce((a,x)=>a+x.custo, 0);
    const lucro = receita - custo;
    const cmv = receita ? custo/receita*100 : 0;
    const pedidos = mv.orders || 0;

    $('#mgKpis').innerHTML = `
      <div class="kpi"><div class="l">💰 Faturamento</div><div class="v">${brlNum(receita)}</div><div class="d ${mv.revDir||'up'}">${mv.revDelta||''}</div></div>
      <div class="kpi"><div class="l">🧾 Ticket médio</div><div class="v">${brlNum(pedidos? receita/pedidos : 0)}</div><div class="d flat">${pedidos} pedidos</div></div>
      <div class="kpi"><div class="l">📦 CMV</div><div class="v">${cmv.toFixed(1)}%</div><div class="d ${cmv>35?'down':'up'}">${brlNum(custo)} em insumos</div></div>
      <div class="kpi"><div class="l">📈 Lucro bruto</div><div class="v">${brlNum(lucro)}</div><div class="d up">${receita? (lucro/receita*100).toFixed(0):0}% do faturamento</div></div>
    `;

    let rows = todos;
    if(q) rows = rows.filter(r => (r.name + ' ' + (r.cat||'')).toLowerCase().includes(q));
    const ordem = {lucro:(a,b)=>b.lucro-a.lucro, pct:(a,b)=>b.pct-a.pct, sold:(a,b)=>b.sold-a.sold, receita:(a,b)=>b.receita-a.receita};
    rows = rows.slice().sort(ordem[margemOrdem] || ordem.lucro);

    const maxLucro = Math.max(1, ...rows.map(r=>r.lucro));
    const pLow = mv.pillLow || 30, pMid = mv.pillMid || 45;
    const th = (id, label)=> `<th class="mg-th" data-ord="${id}" style="cursor:pointer;white-space:nowrap">${label}${margemOrdem===id?' ▾':''}</th>`;

    $('#mgTableWrap').innerHTML = `
      <table class="data-tbl" style="border:none;border-radius:0;box-shadow:none;">
        <thead><tr>
          <th>Item</th>
          <th>Preço</th>
          <th>Custo</th>
          ${th('pct','Margem')}
          ${th('sold','Vendidos')}
          ${th('receita','Receita')}
          ${th('lucro','Lucro')}
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="row-name"><span class="conv-ava" style="width:26px;height:26px;font-size:13px;background:${r.pct<pLow?'#FCE9E6':'#E4F6EC'}">${r.emoji||'🍽'}</span>
                <div style="min-width:0"><div>${r.name}</div><div class="ph-sub" style="margin:0">${r.cat||''}</div></div></td>
              <td>${brlNum(r.price)}</td>
              <td>${brlNum(r.cost)}</td>
              <td><span class="pill" style="background:${r.pct<pLow?'#FCE9E6':(r.pct<pMid?'#FDF0DC':'#E4F6EC')};color:${r.pct<pLow?'#c0392b':(r.pct<pMid?'#9a5b00':'#16794e')}">${r.pct.toFixed(0)}%</span></td>
              <td>${r.sold}</td>
              <td>${brlNum(r.receita)}</td>
              <td style="min-width:150px">
                <div style="display:flex;align-items:center;gap:8px">
                  <b style="white-space:nowrap">${brlNum(r.lucro)}</b>
                  <span class="svc-bar" style="flex:1"><span style="width:${Math.max(4, r.lucro/maxLucro*100)}%"></span></span>
                </div>
              </td>
            </tr>`).join('') || '<tr><td colspan="7"><div class="cal-empty">Nenhum item encontrado.</div></td></tr>'}
        </tbody>
      </table>`;

    $('#mgTableWrap').querySelectorAll('.mg-th').forEach(h=>{
      h.onclick = ()=>{ margemOrdem = h.getAttribute('data-ord'); paintMargem(); };
    });

    const horas = mv.hours || [];
    const maxH = Math.max(1, ...horas.map(h=>h.v));
    $('#mgHours').innerHTML = horas.map(h=>`
      <div class="funnel-step">
        <div class="funnel-lab">${h.l}</div>
        <div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(10, h.v/maxH*100)}%">${brlNum(h.v)}</div></div>
      </div>`).join('');

    const alertas = todos.filter(x=> x.pct < (mv.alertPct || 32) && x.sold >= (mv.alertSold || 20))
                         .sort((a,b)=>a.pct-b.pct).slice(0,4);
    $('#mgAlerts').innerHTML = alertas.map(a=>`
      <div class="opp-row">
        <div class="opp-ava" style="background:#FCE9E6;color:#c0392b">${a.emoji||'🍽'}</div>
        <div class="opp-body">
          <div class="opp-t">${a.name}</div>
          <div class="opp-s">${a.sold} vendidos e só <b>${a.pct.toFixed(0)}% de margem</b></div>
        </div>
        <div class="opp-val"><div class="v">${brlNum(a.lucro)}</div><div class="l">lucro</div></div>
      </div>`).join('') || '<div class="cal-empty">Nenhum item com margem apertada. 🎉</div>';
  }

  document.addEventListener('click', (e)=>{ if(!root.contains(e.target) || !e.target.closest('.cc-menu-btn')){ root.querySelectorAll('.cc-dropdown').forEach(d=>d.remove()); } });

  renderNav();
  renderTabs();
  renderConvList();
  renderChat();
})();
</script>
