    function priceOf(i){ return Number(String(DATA.inventoryView.items[i].price).replace(/[^\d]/g,'')); }
    valor.value = priceOf(0);
    function calc(){
      const P = Math.max(0, Number(valor.value)||0);
      const E = Math.min(P, Math.max(0, Number($('#finEntrada').value)||0));
      const n = Number($('#finParc').value)||(DATA.financeView.defaultTerm||48);
      const i = (Number($('#finTaxa').value)||0)/100;
      const fin = P - E;
      const parcela = i>0 ? fin * (i*Math.pow(1+i,n))/(Math.pow(1+i,n)-1) : (n? fin/n : 0);
      const total = parcela*n;
      const juros = total - fin;
      lastCalc = {P, E, n, i, fin, parcela, itemIdx: Number(veic.value)||0};
      const grand = Math.max(1, E + fin + juros);
      $('#finResult').innerHTML = `
        <div class="rb"><div class="l">Parcela mensal</div><div class="v">${brl(parcela)}</div></div>
        <div class="rb small"><div class="l">Valor financiado</div><div class="v">${brl(fin)}</div></div>
        <div class="rb small"><div class="l">Total a pagar</div><div class="v">${brl(total + E)}</div></div>
        <div class="rb small"><div class="l">Juros do período</div><div class="v">${brl(juros)}</div></div>
        <div class="rb small"><div class="l">Entrada</div><div class="v">${brl(E)}</div></div>`;
      const compo = $('#finCompo');
      if(compo){
        const seg = (label, val, cls)=> val<=0 ? '' :
          `<div class="cmp-seg ${cls}" style="width:${(val/grand*100).toFixed(2)}%" title="${label}: ${brl(val)}"></div>`;
        compo.innerHTML = `
          <div class="cmp-bar">${seg('Entrada',E,'a')}${seg('Principal financiado',fin,'b')}${seg('Juros',juros,'c')}</div>
          <div class="cmp-leg">
            <span><i class="a"></i>Entrada ${brl(E)}</span>
            <span><i class="b"></i>Principal ${brl(fin)}</span>
            <span><i class="c"></i>Juros ${brl(juros)}</span>
            <span class="cmp-tot">${n}x · ${((juros/Math.max(1,fin))*100).toFixed(0)}% de juros sobre o financiado</span>
          </div>`;
      }
    }
    veic.onchange = ()=>{ valor.value = priceOf(Number(veic.value)); calc(); };
    ['finValor','finEntrada','finParc','finTaxa'].forEach(id=>{
      $('#'+id).addEventListener('input', calc);
      $('#'+id).addEventListener('change', calc);
    });
    fv.querySelectorAll('[data-sim]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); toast('Abrindo PDF da simulação — disponível na versão completa.'); });
    calc();
  }

  function dueMeta(due){
    if(!due) return null;
    const today = todayISO();
    const d = parseISO(due);
    const label = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    if(due < today) return {label: label + ' · atrasada', cls:'late'};
    if(due === today) return {label:'hoje', cls:'today'};
    const diff = Math.round((d - parseISO(today)) / 86400000);
    if(diff === 1) return {label:'amanhã', cls:'soon'};
    if(diff <= 3) return {label:'em ' + diff + ' dias', cls:'soon'};
    return {label: label, cls:''};
  }

  function paintTasks(){
    const tv = DATA.tasksView;
    const board = $('#kbBoard');
    const prioClass = {'Alta':'p-alta','Média':'p-media','Baixa':'p-baixa'};
    board.innerHTML = tv.columns.map(col=>{
      const items = tv.tasks.filter(t=>t.col===col.id);
      return `<div class="kb-col" data-col="${col.id}">
        <div class="kb-col-head"><span class="dot" style="background:${col.color}"></span><span class="t">${col.label}</span><span class="n">${items.length}</span></div>
        <div class="kb-list" data-list="${col.id}">
        ${items.map(t=>{
          const gi = tv.tasks.indexOf(t);
          const pc = tv.prios[t.prio] || {color:'#6b7280',soft:'#f1f2f4'};
          const due = dueMeta(t.due);
          const done = t.checklist ? t.checklist.done : null;
          const total = t.checklist ? t.checklist.total : null;
          const pct = total ? Math.round(done/total*100) : 0;
          return `<div class="kb-card ${prioClass[t.prio]||''}" draggable="true" data-idx="${gi}" style="background:#fff">
            <button class="kb-del" data-del="${gi}" title="Excluir">✕</button>
            <div class="t">${t.title}</div>
            <div class="s">${t.sub}</div>
            ${t.rel? `<div class="kb-rel"><span class="kb-rel-ava" style="background:${colorFor(t.rel)}">${initials(t.rel)}</span>${t.rel}</div>`:''}
            ${(t.tags&&t.tags.length)? `<div class="kb-tags">${t.tags.map(x=>`<span class="kb-tag">${x}</span>`).join('')}</div>`:''}
            ${total? `<div class="kb-prog">
                <div class="kb-prog-bar"><span style="width:${pct}%"></span></div>
                <span class="kb-prog-n">${done}/${total}</span>
              </div>`:''}
            <div class="m">
              <span class="kb-chip" style="background:${pc.soft};color:${pc.color}">${t.prio}</span>
              ${due? `<span class="kb-chip kb-due ${due.cls}">🗓 ${due.label}</span>`:''}
              ${t.comments? `<span class="kb-mini">💬 ${t.comments}</span>`:''}
              <span class="kb-who" style="background:${colorFor(t.who)}" title="${t.who}">${initials(t.who)}</span>
            </div>
          </div>`;
        }).join('') || '<div class="kb-empty">Solte um cartão aqui</div>'}
        </div>
      </div>`;
    }).join('');

    board.querySelectorAll('.kb-card').forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        dragTaskIdx = Number(card.getAttribute('data-idx'));
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', String(dragTaskIdx)); }catch(err){}
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        board.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drop'));
      });
    });

    board.querySelectorAll('.kb-col').forEach(col=>{
      col.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; col.classList.add('drop'); });
      col.addEventListener('dragleave', (e)=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop', (e)=>{
        e.preventDefault();
        col.classList.remove('drop');
        let idx = dragTaskIdx;
        if(idx===null || idx===undefined){
          const raw = e.dataTransfer.getData('text/plain');
          idx = raw===''? null : Number(raw);
        }
        if(idx===null || Number.isNaN(idx)) return;
        const target = col.getAttribute('data-col');
        const t = tv.tasks[idx];
        if(!t || t.col===target){ dragTaskIdx=null; return; }
        t.col = target;
        dragTaskIdx = null;
        paintTasks();
        const cl = tv.columns.find(c=>c.id===target);
        toast('Movida para "' + (cl?cl.label:target) + '"');
      });
    });

    board.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const i = Number(b.getAttribute('data-del'));
        const t = tv.tasks[i];
        tv.tasks.splice(i,1);
        paintTasks();
        toast('Tarefa "' + (t?t.title:'') + '" excluída');
      };
    });
  }

  function billRows(){
    const bv = DATA.billingView;
    const q = ($('#blSearch') ? $('#blSearch').value : '').toLowerCase();
    let rows = bv.rows.slice();
    if(billTab !== 'todas') rows = rows.filter(r => r.stage === billTab);
    if(q) rows = rows.filter(r => (r.family + ' ' + r.students).toLowerCase().includes(q));
    return rows;
  }

  function renderBillTabs(){
    const bv = DATA.billingView;
    const row = $('#blTabs');
    row.innerHTML = '';
    (bv.tabs||[]).forEach(t=>{
      const b = document.createElement('button');
      b.className = 'tab-chip' + (billTab===t.id ? ' active':'');
      const n = t.id==='todas' ? bv.rows.length : bv.rows.filter(r=>r.stage===t.id).length;
      b.textContent = `${t.label} ${n}`;
      b.onclick = ()=>{ billTab = t.id; renderBillTabs(); paintBilling(); };
      row.appendChild(b);
    });
  }

  function brlNum(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

  function paintBilling(){
    const bv = DATA.billingView;
    const all = bv.rows;
    const total = all.reduce((a,r)=>a+r.value, 0);
    const pago = all.filter(r=>r.stage==='pago').reduce((a,r)=>a+r.value, 0);
    const vencido = all.filter(r=>r.stage==='vencido').reduce((a,r)=>a+r.value, 0);
    const aberto = total - pago;
    const inad = total ? (vencido/total*100) : 0;

    $('#blKpis').innerHTML = `
      <div class="kpi"><div class="l">💰 Previsto no mês</div><div class="v">${brlNum(total)}</div><div class="d flat">${all.length} mensalidades</div></div>
      <div class="kpi"><div class="l">✅ Recebido</div><div class="v">${brlNum(pago)}</div><div class="d up">${total?Math.round(pago/total*100):0}% do previsto</div></div>
      <div class="kpi"><div class="l">⏳ Em aberto</div><div class="v">${brlNum(aberto)}</div><div class="d flat">a vencer + vencido</div></div>
      <div class="kpi"><div class="l">🔴 Inadimplência</div><div class="v">${inad.toFixed(1)}%</div><div class="d down">${brlNum(vencido)} vencidos</div></div>
      <div class="kpi"><div class="l">📞 Cobranças hoje</div><div class="v">${all.filter(r=>r.charged).length}</div><div class="d flat">follow-ups enviados</div></div>
    `;

    const rows = billRows();
    $('#blTableWrap').innerHTML = `
      <table class="data-tbl" style="border:none;border-radius:0;box-shadow:none;">
        <thead><tr>
          <th>Responsável</th><th>Aluno(s)</th><th>Referência</th><th>Valor</th>
          <th>Vencimento</th><th>Atraso</th><th>Situação</th><th></th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>{
            const i = bv.rows.indexOf(r);
            return `<tr>
              <td class="row-name"><span class="conv-ava" style="width:26px;height:26px;font-size:10px;background:${colorFor(r.family)}">${initials(r.family)}</span>${r.family}</td>
              <td class="muted-cell">${r.students}</td>
              <td class="muted-cell">${r.ref}</td>
              <td class="money">${brlNum(r.value)}</td>
              <td class="muted-cell">${r.due}</td>
              <td>${r.late>0 ? `<span class="late">${r.late} dias</span>` : '<span class="muted-cell">—</span>'}</td>
              <td><span class="pill" style="background:${r.status.soft};color:${r.status.color}">${r.status.text}</span>
                  ${r.charged? '<div style="font-size:10px;color:var(--text-faint);margin-top:3px;font-weight:600;">cobrança enviada hoje</div>':''}</td>
              <td class="tbl-actions">
                ${r.stage==='pago'
                  ? `<button class="mini-btn" data-blrec="${i}">Recibo</button>`
                  : `<button class="mini-btn" data-blcob="${i}">Cobrar</button>`}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      ${!rows.length ? '<div style="text-align:center;padding:30px;color:var(--text-faint);font-size:13px;">Nenhuma mensalidade nesse filtro.</div>' : ''}`;

    $('#blTableWrap').querySelectorAll('[data-blcob]').forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); openChargeModal(Number(b.getAttribute('data-blcob'))); };
    });
    $('#blTableWrap').querySelectorAll('[data-blrec]').forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); toast('Recibo enviado ao responsável ✅'); };
    });
  }

  function chargeMessage(r){
    const bv = DATA.billingView;
    const tpl = r.late > 15 ? bv.msgNegociar : (r.late > 0 ? bv.msgVencido : bv.msgAvencer);
    return String(tpl)
      .replace(/{{responsavel}}/g, String(r.family).split(' ')[0])
      .replace(/{{alunos}}/g, r.students)
      .replace(/{{valor}}/g, brlNum(r.value))
      .replace(/{{ref}}/g, r.ref)
      .replace(/{{venc}}/g, r.due)
      .replace(/{{atraso}}/g, r.late);
  }

    const bv = DATA.billingView;
    const r = bv.rows[idx];

    const box = $('#modalBox');
    box.innerHTML = `
      <div class="modal-head">

            ${r.late>15 ? 'Como passou de 15 dias, entra o tom de negociação com parcelamento.'

            </select></div>
        </div>
      </div>
      <div class="modal-foot">

        toast('Cobrança enviada para ' + r.family + ' 📩');
      }

      renderBillTabs();

  function chargeAllLate(){
    const bv = DATA.billingView;

    if(!late.length){ toast('Nenhum vencido sem cobrança no momento 👍'); return; }
    late.forEach(r=> r.charged = true);

    toast(late.length + ' cobranças disparadas pela régua automática 📩');

  function paintServices(){
    const sv = DATA.servicesView;
    const totalAlunos = sv.totalStudents || 1;
    const matriculados = sv.catalog.reduce((a,c)=>a+c.enrolled, 0);
    const receita = sv.catalog.reduce((a,c)=>a+c.enrolled*c.price, 0);
    const comExtra = sv.studentsWithExtra || 0;
    const penetracao = totalAlunos ? (comExtra/totalAlunos*100) : 0;
    const pipeline = sv.opportunities.filter(o=>!o.sent).reduce((a,o)=>a+o.value, 0);

    $('#svKpis').innerHTML = `
      <div class="kpi"><div class="l">💵 Receita mensal de extras</div><div class="v">${brlNum(receita)}</div><div class="d up">${matriculados} matrículas em atividades</div></div>
      <div class="kpi"><div class="l">🎯 Alunos com atividade</div><div class="v">${comExtra}/${totalAlunos}</div><div class="d up">${penetracao.toFixed(0)}% da base</div></div>
      <div class="kpi"><div class="l">🧾 Ticket extra médio</div><div class="v">${brlNum(comExtra? receita/comExtra : 0)}</div><div class="d flat">por aluno que faz extra</div></div>
      <div class="kpi"><div class="l">🚀 Oportunidades abertas</div><div class="v">${brlNum(pipeline)}</div><div class="d up">${sv.opportunities.filter(o=>!o.sent).length} alunos para abordar</div></div>
    `;

    $('#svGrid').innerHTML = sv.catalog.map((c,i)=>{
      const pct = c.slots ? Math.min(100, Math.round(c.enrolled/c.slots*100)) : 0;
      const cheio = c.enrolled >= c.slots;
      return `<div class="svc-card">
        <div class="svc-top">
          <div class="svc-ic">${c.emoji}</div>
          <div style="min-width:0">
            <div class="svc-name">${c.name}</div>
            <div class="svc-sub">${c.days} · ${c.teacher}</div>
          </div>
        </div>
        <div class="svc-price">${brlNum(c.price)}<small>/mês</small></div>
        <div class="svc-meta"><span>${c.enrolled} de ${c.slots} vagas</span><span>${cheio? 'turma cheia' : (c.slots-c.enrolled)+' livres'}</span></div>
        <div class="svc-bar ${cheio?'full':''}"><span style="width:${pct}%"></span></div>
        <div class="svc-rev">Receita: <b>${brlNum(c.enrolled*c.price)}</b>/mês</div>
      </div>`;
    }).join('');

    const opps = sv.opportunities;
    $('#svOpps').innerHTML = opps.map((o,i)=>`
      <div class="opp-row">
        <div class="opp-ava" style="background:${colorFor(o.student)}">${initials(o.student)}</div>
        <div class="opp-body">
          <div class="opp-t">${o.student}</div>
          <div class="opp-s">${o.service} · <b>${o.reason}</b></div>
        </div>
        <div class="opp-val">
          <div class="v">${brlNum(o.value)}</div>
          <div class="l">/mês</div>
        </div>
        <button class="mini-btn" data-opp="${i}" ${o.sent?'disabled style="opacity:.5"':''}>${o.sent? 'Enviada':'Oferecer'}</button>
      </div>`).join('') || '<div class="cal-empty">Nenhuma oportunidade aberta.</div>';

    $('#svOpps').querySelectorAll('[data-opp]').forEach(b=>{
      if(b.hasAttribute('disabled')) return;
      b.onclick = ()=> openOfferModal(Number(b.getAttribute('data-opp')));
    });

    const mix = sv.mix || [];
    const maxMix = Math.max(1, ...mix.map(m=>m.v));
    $('#svMix').innerHTML = mix.map(m=>`
      <div class="funnel-step">
        <div class="funnel-lab">${m.l}</div>
        <div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(12, m.v/maxMix*100)}%">${m.v}</div></div>
      </div>`).join('');
  }

              <div style="overflow-x:auto;padding-top:12px;" id="mgTableWrap"></div>
            </div>
          </div>
          <div>
            <div class="panel-card">
              <h3>${mv.hoursTitle || 'Faturamento por horário'}</h3>
              <div class="ph-sub">${mv.hoursSub || 'Onde o dia realmente acontece'}</div>
              <div id="mgHours" style="margin-top:12px"></div>
            </div>
            <div class="panel-card">
              <h3>${mv.alertTitle || 'Precisa de atenção'}</h3>
              <div class="ph-sub">${mv.alertSub || 'Itens que vendem bem e lucram pouco'}</div>
              <div id="mgAlerts" style="margin-top:8px"></div>
            </div>
          </div>
        </div>
      </div>`;
    wireBack();
    $('#mgSearch').addEventListener('input', paintMargem);
    $('#mgExport').onclick = ()=> toast('Planilha gerada — disponível na versão completa.');
    paintMargem();
  }

  function margemCalc(it){
    const receita = it.price * it.sold;
    const custo = it.cost * it.sold;
    const lucro = receita - custo;
    const pct = it.price ? ((it.price - it.cost) / it.price * 100) : 0;
    return {receita, custo, lucro, pct};
  }

  function paintMargem(){
    const mv = DATA.margemView;
    const q = ($('#mgSearch') ? $('#mgSearch').value : '').toLowerCase();

    const todos = mv.items.map(it=> Object.assign({}, it, margemCalc(it)));
    const receita = todos.reduce((a,x)=>a+x.receita, 0);
    const custo = todos.reduce((a,x)=>a+x.custo, 0);
    const lucro = receita - custo;
    const cmv = receita ? custo/receita*100 : 0;
    const pedidos = mv.orders || 0;

    $('#mgKpis').innerHTML = `
      <div class="kpi"><div class="l">💰 Faturamento</div><div class="v">${brlNum(receita)}</div><div class="d ${mv.revDir||'up'}">${mv.revDelta||''}</div></div>
      <div class="kpi"><div class="l">🧾 Ticket médio</div><div class="v">${brlNum(pedidos? receita/pedidos : 0)}</div><div class="d flat">${pedidos} pedidos</div></div>
      <div class="kpi"><div class="l">📦 CMV</div><div class="v">${cmv.toFixed(1)}%</div><div class="d ${cmv>35?'down':'up'}">${brlNum(custo)} em insumos</div></div>
      <div class="kpi"><div class="l">📈 Lucro bruto</div><div class="v">${brlNum(lucro)}</div><div class="d up">${receita? (lucro/receita*100).toFixed(0):0}% do faturamento</div></div>
    `;

    let rows = todos;
    if(q) rows = rows.filter(r => (r.name + ' ' + (r.cat||'')).toLowerCase().includes(q));
    const ordem = {lucro:(a,b)=>b.lucro-a.lucro, pct:(a,b)=>b.pct-a.pct, sold:(a,b)=>b.sold-a.sold, receita:(a,b)=>b.receita-a.receita};
    rows = rows.slice().sort(ordem[margemOrdem] || ordem.lucro);

    const maxLucro = Math.max(1, ...rows.map(r=>r.lucro));
    const pLow = mv.pillLow || 30, pMid = mv.pillMid || 45;
    const th = (id, label)=> `<th class="mg-th" data-ord="${id}" style="cursor:pointer;white-space:nowrap">${label}${margemOrdem===id?' ▾':''}</th>`;

    $('#mgTableWrap').innerHTML = `
      <table class="data-tbl" style="border:none;border-radius:0;box-shadow:none;">
        <thead><tr>
          <th>Item</th>
          <th>Preço</th>
          <th>Custo</th>
          ${th('pct','Margem')}
          ${th('sold','Vendidos')}
          ${th('receita','Receita')}
          ${th('lucro','Lucro')}
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="row-name"><span class="conv-ava" style="width:26px;height:26px;font-size:13px;background:${r.pct<pLow?'#FCE9E6':'#E4F6EC'}">${r.emoji||'🍽'}</span>
                <div style="min-width:0"><div>${r.name}</div><div class="ph-sub" style="margin:0">${r.cat||''}</div></div></td>
              <td>${brlNum(r.price)}</td>
              <td>${brlNum(r.cost)}</td>
              <td><span class="pill" style="background:${r.pct<pLow?'#FCE9E6':(r.pct<pMid?'#FDF0DC':'#E4F6EC')};color:${r.pct<pLow?'#c0392b':(r.pct<pMid?'#9a5b00':'#16794e')}">${r.pct.toFixed(0)}%</span></td>
              <td>${r.sold}</td>
              <td>${brlNum(r.receita)}</td>
              <td style="min-width:150px">
                <div style="display:flex;align-items:center;gap:8px">
                  <b style="white-space:nowrap">${brlNum(r.lucro)}</b>
                  <span class="svc-bar" style="flex:1"><span style="width:${Math.max(4, r.lucro/maxLucro*100)}%"></span></span>
                </div>
              </td>
            </tr>`).join('') || '<tr><td colspan="7"><div class="cal-empty">Nenhum item encontrado.</div></td></tr>'}
        </tbody>
      </table>`;

    $('#mgTableWrap').querySelectorAll('.mg-th').forEach(h=>{
      h.onclick = ()=>{ margemOrdem = h.getAttribute('data-ord'); paintMargem(); };
    });

    const horas = mv.hours || [];
    const maxH = Math.max(1, ...horas.map(h=>h.v));
    $('#mgHours').innerHTML = horas.map(h=>`
      <div class="funnel-step">
        <div class="funnel-lab">${h.l}</div>
        <div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(10, h.v/maxH*100)}%">${brlNum(h.v)}</div></div>
      </div>`).join('');

    const alertas = todos.filter(x=> x.pct < (mv.alertPct || 32) && x.sold >= (mv.alertSold || 20))
                         .sort((a,b)=>a.pct-b.pct).slice(0,4);
    $('#mgAlerts').innerHTML = alertas.map(a=>`
      <div class="opp-row">
        <div class="opp-ava" style="background:#FCE9E6;color:#c0392b">${a.emoji||'🍽'}</div>
        <div class="opp-body">
          <div class="opp-t">${a.name}</div>
          <div class="opp-s">${a.sold} vendidos e só <b>${a.pct.toFixed(0)}% de margem</b></div>
        </div>
        <div class="opp-val"><div class="v">${brlNum(a.lucro)}</div><div class="l">lucro</div></div>
      </div>`).join('') || '<div class="cal-empty">Nenhum item com margem apertada. 🎉</div>';
  }

  /* ---------------- Clientes que sumiram e reativação ---------------- */
  function renderReativacao(){
    const rv = DATA.reativacaoView;
    const fv = $('#fullView');
    fv.innerHTML = fvHeader(rv.title, rv.subtitle,
      `<button class="btn" id="rtRegra">⏱ Régua de reativação</button>
       <button class="btn primary" id="rtAll">Reativar todos</button>`) + `
      <div class="full-body">
        <div class="kpi-row" id="rtKpis"></div>
        <div class="dash-grid">
          <div>
            <div class="panel-card">
              <h3>${rv.listTitle || 'Clientes que pararam de pedir'}</h3>
              <div class="ph-sub">${rv.listSub || 'Ordenados pelo que eles já gastaram aqui'}</div>
              <div id="rtList" style="margin-top:6px"></div>
            </div>
          </div>
          <div>
            <div class="panel-card">
              <h3>${rv.bucketTitle || 'Base por tempo sem pedir'}</h3>
              <div class="ph-sub">${rv.bucketSub || 'Quanto mais cedo você fala, mais barato é trazer de volta'}</div>
              <div id="rtBuckets" style="margin-top:12px"></div>
            </div>
            <div class="panel-card">
              <h3>${rv.wonTitle || 'Voltaram este mês'}</h3>
              <div class="ph-sub">${rv.wonSub || 'Reativados pela régua automática'}</div>
              <div id="rtWon" style="margin-top:8px"></div>
            </div>
          </div>
        </div>
      </div>`;
    wireBack();
    $('#rtRegra').onclick = openReguaModal;
    $('#rtAll').onclick = reativarTodos;
    paintReativacao();
  }

  function paintReativacao(){
    const rv = DATA.reativacaoView;
    const lista = rv.clients;
    const perdido = lista.reduce((a,c)=>a + c.ticket * c.freq, 0);
    const enviados = lista.filter(c=>c.sent).length;
    const voltou = (rv.recovered||[]).reduce((a,c)=>a+c.value, 0);

    $('#rtKpis').innerHTML = `
      <div class="kpi"><div class="l">😴 Clientes sumidos</div><div class="v">${lista.length}</div><div class="d down">de ${rv.base||0} na base</div></div>
      <div class="kpi"><div class="l">💸 Receita parada</div><div class="v">${brlNum(perdido)}</div><div class="d down">por mês, se nenhum voltar</div></div>
      <div class="kpi"><div class="l">📤 Abordagens enviadas</div><div class="v">${enviados}</div><div class="d flat">${lista.length - enviados} na fila</div></div>
      <div class="kpi"><div class="l">🎉 Recuperado no mês</div><div class="v">${brlNum(voltou)}</div><div class="d up">${(rv.recovered||[]).length} clientes voltaram</div></div>
    `;

    $('#rtList').innerHTML = lista.map((c,i)=>`
      <div class="opp-row">
        <div class="opp-ava" style="background:${colorFor(c.name)}">${initials(c.name)}</div>
        <div class="opp-body">
          <div class="opp-t">${c.name} <span class="pill" style="background:#FDF0DC;color:#9a5b00;margin-left:6px">${c.days} dias sem pedir</span></div>
          <div class="opp-s">Pedia ${c.freq}x por mês · costumava levar <b>${c.favorite}</b></div>
        </div>
        <div class="opp-val"><div class="v">${brlNum(c.ticket)}</div><div class="l">ticket</div></div>
        <button class="mini-btn" data-rt="${i}" ${c.sent?'disabled style="opacity:.5"':''}>${c.sent?'Enviada':'Reativar'}</button>
      </div>`).join('') || '<div class="cal-empty">Ninguém sumiu. 🎉</div>';

    $('#rtList').querySelectorAll('[data-rt]').forEach(b=>{
      if(b.hasAttribute('disabled')) return;
      b.onclick = ()=> openReativarModal(Number(b.getAttribute('data-rt')));
    });

    const buckets = rv.buckets || [];
    const maxB = Math.max(1, ...buckets.map(b=>b.v));
    $('#rtBuckets').innerHTML = buckets.map(b=>`
      <div class="funnel-step">
        <div class="funnel-lab">${b.l}</div>
        <div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(12, b.v/maxB*100)}%">${b.v}</div></div>
      </div>`).join('');

    $('#rtWon').innerHTML = (rv.recovered||[]).map(c=>`
      <div class="opp-row">
        <div class="opp-ava" style="background:#E4F6EC;color:#16794e">✓</div>
        <div class="opp-body">
          <div class="opp-t">${c.name}</div>
          <div class="opp-s">${c.note}</div>
        </div>
        <div class="opp-val"><div class="v">${brlNum(c.value)}</div><div class="l">no mês</div></div>
      </div>`).join('') || '<div class="cal-empty">Ainda nenhum retorno neste mês.</div>';
  }

  function openReativarModal(idx){
    const rv = DATA.reativacaoView;
    const c = rv.clients[idx];
    if(!c) return;

    const cupons = rv.coupons || ['Sem cupom', '10% de desconto', 'Entrega grátis', 'Sobremesa por nossa conta'];
    const msgFor = (cupom)=> String(cupom === 'Sem cupom' && rv.msgSemOferta ? rv.msgSemOferta : (rv.msgReativa || ''))
      .replace(/{{nome}}/g, String(c.name).split(' ')[0])
      .replace(/{{favorito}}/g, c.favorite)
      .replace(/{{dias}}/g, c.days)
      .replace(/{{oferta}}/g, cupom === 'Sem cupom' ? '' : cupom.toLowerCase());

    const box = $('#modalBox');
    box.innerHTML = `
      <div class="modal-head">
        <div class="mh-ic">🔁</div>
        <div>
          <h2>Reativar ${String(c.name).split(' ')[0]}</h2>
          <div class="mh-sub">${c.days} dias sem pedir · ticket de ${brlNum(c.ticket)} · favorito: ${c.favorite}</div>
        </div>
        <button class="modal-x" id="mdX">✕</button>
      </div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:14px;">
          <label>Mensagem no WhatsApp</label>
          <div class="msg-preview" id="rtMsg">${msgFor(cupons[1] || cupons[0])}</div>
          <div class="msg-hint">O texto muda conforme o cupom escolhido.</div>
        </div>
        <div class="form-grid">
          <div class="field"><label>Cupom</label>
            <select id="rtCupom">${cupons.map((x,i)=>`<option${i===1?' selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Quando enviar</label>
            <select id="rtQuando"><option>Agora</option><option>Hoje às 11h</option><option>Hoje às 18h30</option><option>Amanhã de manhã</option></select></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="mdCancel">Cancelar</button>
        <button class="btn primary" id="mdOk">Enviar mensagem</button>
      </div>`;
    const sel = $('#rtCupom');
    sel.onchange = ()=> { $('#rtMsg').textContent = msgFor(sel.value); };
    $('#mdX').onclick = closeModal;
    $('#mdCancel').onclick = closeModal;
    $('#modalBack').onclick = (e)=>{ if(e.target===$('#modalBack')) closeModal(); };
    $('#mdOk').onclick = ()=>{
      c.sent = true;
      closeModal();
      paintReativacao();
      toast('Mensagem enviada para ' + String(c.name).split(' ')[0] + ' 🔁');
    };
    $('#modalBack').classList.add('open');
  }

  function reativarTodos(){
    const rv = DATA.reativacaoView;
    const fila = rv.clients.filter(c=>!c.sent);
    if(fila.length === 0){ toast('Todo mundo da lista já foi abordado.'); return; }
    fila.forEach(c=> c.sent = true);
    paintReativacao();
    toast(fila.length + ' mensagens de reativação enviadas 🚀');
  }

  function openReguaModal(){
    const rv = DATA.reativacaoView;
    const etapas = rv.ruler || [];
    const box = $('#modalBox');
    box.innerHTML = `
      <div class="modal-head">
        <div class="mh-ic">⏱</div>
        <div>
          <h2>Régua de reativação</h2>
          <div class="mh-sub">O que a IA manda sozinha, e quando</div>
        </div>
        <button class="modal-x" id="mdX">✕</button>
      </div>
      <div class="modal-body">
        ${etapas.map((e,i)=>`
          <div class="opp-row">
            <div class="opp-ava" style="background:#EEF1F5;color:#475569;font-size:11px">${e.when}</div>
            <div class="opp-body">
              <div class="opp-t">${e.title}</div>
              <div class="opp-s">${e.text}</div>
            </div>
            <button class="sw-toggle ${e.on?'on':''}" data-regua="${i}"></button>
          </div>`).join('')}
      </div>
      <div class="modal-foot">
        <button class="btn" id="mdCancel">Fechar</button>
        <button class="btn primary" id="mdOk">Salvar régua</button>
      </div>`;
    box.querySelectorAll('[data-regua]').forEach(b=>{
      b.onclick = ()=>{
        const i = Number(b.getAttribute('data-regua'));
        etapas[i].on = !etapas[i].on;
        b.classList.toggle('on', etapas[i].on);
      };
    });
    $('#mdX').onclick = closeModal;
    $('#mdCancel').onclick = closeModal;
    $('#modalBack').onclick = (e)=>{ if(e.target===$('#modalBack')) closeModal(); };
    $('#mdOk').onclick = ()=>{ closeModal(); toast('Régua de reativação salva ✅'); };
    $('#modalBack').classList.add('open');
  }

  /* ---------------- Placeholder ---------------- */
  function renderPlaceholder(label){
    $('#fullView').innerHTML = `
      <div class="full-head">
        <button class="icon-btn mobile-back" id="fvBack3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div><h1>${label}</h1></div>
      </div>
      <div class="placeholder-view">
        <div class="pic">🚧</div>
        <h2>${label} — em construção nesta demo</h2>
        <p>Esta área faz parte da plataforma completa e é totalmente funcional na versão de produção. Nesta demonstração o foco está na Caixa de Entrada / Conversas.</p>
      </div>
    `;
    $('#fvBack3').onclick = ()=> $('#appRoot').classList.remove('chat-mobile');
  }

  /* ---------------- Global wiring ---------------- */
  $('#listSearch').addEventListener('input', (e)=>{ state.listQuery = e.target.value; renderConvList(); });
  $('#sideSearch').addEventListener('input', (e)=>{ state.listQuery = e.target.value; if(state.view==='conversas'){ state.navId = DATA.nav.find(n=>n.view==='conversas').id; renderNav(); renderConvList(); if(!$('#chatCol').innerHTML) renderChat(); $('#listCol').style.display='flex'; $('#chatCol').style.display='flex'; $('#fullView').style.display='none'; } });
  $('#filterBtn').addEventListener('click', ()=>{ state.unreadOnly = !state.unreadOnly; $('#filterBtn').style.background = state.unreadOnly? 'var(--primary-soft)':''; renderConvList(); toast(state.unreadOnly? 'Mostrando apenas não lidas':'Mostrando todas'); });
  $('#sortBtn').addEventListener('click', ()=>{ DATA.conversations.reverse(); renderConvList(); toast('Ordem alterada'); });
  $('#mobileMenuBtn').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));
  document.addEventListener('click', (e)=>{ if(!root.contains(e.target) || !e.target.closest('.cc-menu-btn')){ root.querySelectorAll('.cc-dropdown').forEach(d=>d.remove()); } });

  renderNav();
  renderTabs();
  renderConvList();
  renderChat();
})();
</script>

</body>
</html>
