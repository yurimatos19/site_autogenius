<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AutoGenius Clínicas — Demonstração</title>
</head>
<body style="margin:0;">
<style>
  .ag-clinicas *{box-sizing:border-box;}
  .ag-clinicas {
    --primary: #2563EB;
    --primary-dark: #1D4ED8;
    --primary-light: #7FB2FF;
    --primary-soft: #E9F0FF;
    --primary-tint: rgba(37,99,235,.45);
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e6e8ec;
    --text: #14161a;
    --text-dim: #6b7280;
    --text-faint: #9aa0aa;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,20,24,.04), 0 8px 24px -12px rgba(16,20,24,.10);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .ag-clinicas { width:100%; }
  .ag-clinicas .app { display:flex; height:100vh; min-height:640px; width:100%; overflow:hidden; background:var(--bg);}
  .ag-clinicas button { font-family:inherit; cursor:pointer; }
  .ag-clinicas input, .ag-clinicas textarea { font-family:inherit; }

  /* ---------- Top demo banner ---------- */

  /* ---------- Sidebar ---------- */
  .ag-clinicas .sidebar{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-clinicas .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;}
  .ag-clinicas .brand-mark{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1px var(--border);}
  .ag-clinicas .brand-mark img{width:26px;height:26px;object-fit:contain;}
  .ag-clinicas .brand-text{line-height:1.15;}
  .ag-clinicas .brand-text .name{font-weight:700;font-size:15.5px;color:var(--text);}
  .ag-clinicas .brand-text .tag{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--primary-dark);background:var(--primary-soft);padding:1px 6px;border-radius:4px;display:inline-block;margin-top:2px;}
  .ag-clinicas .side-search{margin:2px 12px 10px;position:relative;}
  .ag-clinicas .side-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;color:var(--text);outline:none;}
  .ag-clinicas .side-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-clinicas .side-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-clinicas .side-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--text-faint);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}
  .ag-clinicas .nav{flex:1;overflow-y:auto;padding:2px 10px 10px;}
  .ag-clinicas .nav-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;font-size:13.5px;color:var(--text-dim);cursor:pointer;user-select:none;font-weight:500;margin-bottom:0;border:none;background:transparent;width:100%;text-align:left;}
  .ag-clinicas .nav-item .ic{width:16px;height:16px;flex:none;font-size:13px;opacity:.95;display:flex;align-items:center;justify-content:center;}
  .ag-clinicas .nav-item .nvic{width:16px;height:16px;display:block;}
  .ag-clinicas .nav-item:hover{background:var(--bg);color:var(--text);}
  .ag-clinicas .nav-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600;}
  .ag-clinicas .nav-item .count{margin-left:auto;font-size:11px;color:var(--text-faint);}
  .ag-clinicas .nav-divider{height:1px;background:var(--border);margin:8px 4px;}
  .ag-clinicas .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--text-faint);text-transform:uppercase;padding:10px 9px 3px;}
  .ag-clinicas .tag-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .ag-clinicas .chev{display:inline-block;width:11px;flex:none;font-size:10px;color:var(--text-faint);transition:transform .15s;transform:rotate(0deg);text-align:center;}
  .ag-clinicas .chev.open{transform:rotate(90deg);}
  .ag-clinicas .chev-spacer{width:11px;flex:none;display:inline-block;}
  .ag-clinicas .nav-children{display:flex;flex-direction:column;}
  .ag-clinicas .sidebar-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:9px;}
  .ag-clinicas .avatar-sq{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;}
  .ag-clinicas .foot-text{line-height:1.2;overflow:hidden;}
  .ag-clinicas .foot-text .n{font-size:12.5px;font-weight:600;white-space:nowrap;}
  .ag-clinicas .foot-text .e{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- List column ---------- */
  .ag-clinicas .list-col{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .ag-clinicas .list-head{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .ag-clinicas .list-head h1{font-size:17px;font-weight:700;margin:0;}
  .ag-clinicas .list-head .tools{display:flex;gap:4px;}
  .ag-clinicas .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .ag-clinicas .icon-btn:hover{background:var(--bg);}
  .ag-clinicas .icon-btn svg{width:14px;height:14px;}
  .ag-clinicas .list-search{margin:2px 16px 10px;position:relative;}
  .ag-clinicas .list-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-size:13px;outline:none;}
  .ag-clinicas .list-search input:focus{border-color:var(--primary);background:#fff;}
  .ag-clinicas .list-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-clinicas .tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;}
  .ag-clinicas .tabs::-webkit-scrollbar{display:none;}
  .ag-clinicas .tab-chip{flex:none;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-dim);white-space:nowrap;}
  .ag-clinicas .tab-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-clinicas .conv-scroll{flex:1;overflow-y:auto;border-top:1px solid var(--border);}
  .ag-clinicas .conv-item{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);position:relative;}
  .ag-clinicas .conv-item:hover{background:var(--bg);}
  .ag-clinicas .conv-item.active{background:var(--primary-soft);}
  .ag-clinicas .conv-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);}
  .ag-clinicas .conv-ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-clinicas .conv-body{flex:1;min-width:0;}
  .ag-clinicas .conv-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
  .ag-clinicas .conv-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ag-clinicas .conv-time{font-size:11px;color:var(--text-faint);flex:none;}
  .ag-clinicas .conv-prev{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .ag-clinicas .conv-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .ag-clinicas .mini-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--text-dim);}
  .ag-clinicas .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;margin-top:3px;}
  .ag-clinicas .resolved-pill{font-size:10px;font-weight:700;color:#16794e;background:#e6f7ee;padding:1px 6px;border-radius:5px;}
  .ag-clinicas .list-foot{padding:12px;text-align:center;font-size:12px;color:var(--text-faint);}

  /* ---------- Chat panel ---------- */
  .ag-clinicas .chat-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--bg);}
  .ag-clinicas .chat-head{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;}
  .ag-clinicas .chat-head-row{display:flex;align-items:center;gap:10px;}
  .ag-clinicas .chat-ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none;}
  .ag-clinicas .chat-name{font-size:15px;font-weight:700;}
  .ag-clinicas .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-clinicas .badge.status-open{background:#fff2df;color:#9a5b00;}
  .ag-clinicas .badge.status-resolved{background:#e6f7ee;color:#16794e;}
  .ag-clinicas .chat-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .ag-clinicas .btn{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
  .ag-clinicas .btn:hover{background:var(--bg);}
  .ag-clinicas .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .ag-clinicas .btn.primary:hover{background:var(--primary-dark);}
  .ag-clinicas .btn.ghost{border-color:transparent;background:transparent;}
  .ag-clinicas .chat-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .ag-clinicas .meta-chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);border:1px solid var(--border);}
  .ag-clinicas .meta-chip.strong{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent;}
  .ag-clinicas .chat-scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .ag-clinicas .chat-scroll > *{flex:0 0 auto;}
  .ag-clinicas .day-sep{align-self:center;font-size:11px;color:var(--text-faint);background:#eef0f3;padding:3px 10px;border-radius:999px;margin:4px 0 8px;}
  .ag-clinicas .msg-row{display:flex;max-width:70%;}
  .ag-clinicas .msg-row.in{align-self:flex-start;}
  .ag-clinicas .msg-row.out{align-self:flex-end;flex-direction:row-reverse;}
  .ag-clinicas .msg-bubble{padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.48;box-shadow:var(--shadow);}
  .ag-clinicas .msg-row.in .msg-bubble{background:#fff;border-bottom-left-radius:4px;color:var(--text);}
  .ag-clinicas .msg-row.out .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .ag-clinicas .msg-time{font-size:10.5px;color:var(--text-faint);margin-top:3px;display:flex;gap:4px;align-items:center;}
  .ag-clinicas .msg-row.out .msg-time{justify-content:flex-end;}
  .ag-clinicas .msg-wrap{display:flex;flex-direction:column;}
  .ag-clinicas .msg-row.out .msg-wrap{align-items:flex-end;}
  .ag-clinicas .cards-row{display:flex;gap:10px;overflow-x:auto;align-self:flex-end;max-width:78%;padding-bottom:4px;flex-wrap:wrap;justify-content:flex-end;}
  .ag-clinicas .cards-label{width:100%;text-align:right;font-size:11px;font-weight:600;color:var(--text-faint);margin-bottom:1px;}
  .ag-clinicas .item-card{flex:none;width:172px;background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);}
  .ag-clinicas .item-card .thumb{height:92px;background:linear-gradient(140deg,#f7f8fa,#eceef2);display:flex;align-items:center;justify-content:center;font-size:24px;border-bottom:1px solid var(--border);padding:6px 8px;}
  .ag-clinicas .item-card .ic-body{padding:9px 10px;}
  .ag-clinicas .item-card .price{font-size:13px;font-weight:700;}
  .ag-clinicas .item-card .sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
  .ag-clinicas .item-card .loc{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .ag-clinicas .msg-ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none;align-self:flex-end;margin-bottom:17px;}
  .ag-clinicas .msg-row.in .msg-ava{margin-right:8px;}
  .ag-clinicas .msg-row.out .msg-ava{margin-left:8px;background:var(--primary-dark);}
  .ag-clinicas .note-row{align-self:center;max-width:76%;background:#fffaf0;border:1px dashed #e3c88f;border-radius:10px;padding:8px 13px;font-size:12px;color:#8a6415;line-height:1.45;}
  .ag-clinicas .note-row b{font-weight:700;}
  .ag-clinicas .sys-row{align-self:center;font-size:11.5px;color:var(--text-faint);background:#eef0f3;padding:4px 12px;border-radius:999px;}
  .ag-clinicas .typing{align-self:flex-start;display:flex;gap:4px;background:#fff;padding:11px 14px;border-radius:14px;border-bottom-left-radius:4px;box-shadow:var(--shadow);}
  .ag-clinicas .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:blink 1.2s infinite ease-in-out;}
  .ag-clinicas .typing span:nth-child(2){animation-delay:.15s;}
  .ag-clinicas .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .ag-clinicas .quick-row{display:flex;gap:8px;padding:10px 20px 0;flex-wrap:wrap;}
  .ag-clinicas .quick-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--primary-dark);}
  .ag-clinicas .quick-chip:hover{background:var(--primary-soft);}
  .ag-clinicas .composer{background:var(--panel);border-top:1px solid var(--border);padding:10px 20px 14px;}
  .ag-clinicas .composer textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;resize:none;min-height:44px;max-height:110px;outline:none;font-family:inherit;}
  .ag-clinicas .composer textarea:focus{border-color:var(--primary);}
  .ag-clinicas .composer-bottom{display:flex;align-items:center;margin-top:8px;gap:6px;}
  .ag-clinicas .composer-icons{display:flex;gap:4px;}
  .ag-clinicas .composer-icons .icon-btn{border-color:transparent;}
  .ag-clinicas .send-btn{margin-left:auto;background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;}
  .ag-clinicas .send-btn:hover{background:var(--primary-dark);}
  .ag-clinicas .hint{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .ag-clinicas .empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-faint);gap:8px;}
  .ag-clinicas .empty-chat .em-ic{font-size:34px;}

  /* ---------- Full-width views (contacts / agenda / placeholder) ---------- */
  .ag-clinicas .full-view{flex:1;display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden;}
  .ag-clinicas .full-head{padding:20px 26px 14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--border);}
  .ag-clinicas .full-head h1{font-size:18px;font-weight:700;margin:0;}
  .ag-clinicas .full-head .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .ag-clinicas .full-search{margin-left:auto;position:relative;width:230px;}
  .ag-clinicas .full-search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;}
  .ag-clinicas .full-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);}
  .ag-clinicas .full-body{flex:1;overflow:auto;padding:16px 22px;}

  /* ---- contact cards + pagination ---- */
  .ag-clinicas .contact-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-bottom:9px;position:relative;}
  .ag-clinicas .contact-card:hover{border-color:var(--primary-light);}
  .ag-clinicas .cc-ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
  .ag-clinicas .cc-body{flex:1;min-width:0;}
  .ag-clinicas .cc-name{font-size:13.5px;font-weight:700;}
  .ag-clinicas .cc-sub{font-size:12px;color:var(--text-dim);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .ag-clinicas .cc-sub .lk{color:var(--primary-dark);font-weight:600;cursor:pointer;}
  .ag-clinicas .cc-sub .lk:hover{text-decoration:underline;}
  .ag-clinicas .cc-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--text-dim);flex:none;display:flex;align-items:center;gap:5px;}
  .ag-clinicas .cc-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex:none;}
  .ag-clinicas .cc-menu-btn:hover{background:var(--bg);}
  .ag-clinicas .cc-dropdown{position:absolute;right:14px;top:46px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);z-index:10;overflow:hidden;min-width:170px;}
  .ag-clinicas .cc-dropdown button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12.5px;background:#fff;border:none;color:var(--text);}
  .ag-clinicas .cc-dropdown button:hover{background:var(--bg);}
  .ag-clinicas .filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .ag-clinicas .filter-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
    padding:6px 8px 6px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);}
  .ag-clinicas .filter-chip button{border:none;background:rgba(0,0,0,.08);color:inherit;width:18px;height:18px;
    border-radius:50%;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .ag-clinicas .filter-chip button:hover{background:rgba(0,0,0,.18);}
  .ag-clinicas .filter-count{font-size:12px;color:var(--text-faint);font-weight:600;}
  .ag-clinicas .empty-list{text-align:center;padding:44px 20px;background:#fff;border:1px solid var(--border);
    border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ag-clinicas .empty-list .el-ic{font-size:26px;opacity:.5;}
  .ag-clinicas .empty-list .el-t{font-size:14px;font-weight:700;}
  .ag-clinicas .empty-list .el-s{font-size:12.5px;color:var(--text-faint);max-width:340px;line-height:1.5;}
  .ag-clinicas .empty-list .btn{margin-top:8px;}
  .ag-clinicas .pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 4px;font-size:12.5px;color:var(--text-faint);}
  .ag-clinicas .pg-controls{display:flex;align-items:center;gap:4px;}
  .ag-clinicas .pg-btn{width:27px;height:27px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:12px;}
  .ag-clinicas .pg-btn:hover:not(:disabled){background:var(--bg);}
  .ag-clinicas .pg-btn:disabled{opacity:.4;cursor:default;}
  .ag-clinicas .pg-current{font-size:12.5px;font-weight:600;color:var(--text);padding:0 6px;}

  /* ---- inventory grid ---- */
  .ag-clinicas .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:14px;}
  .ag-clinicas .inv-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .ag-clinicas .inv-thumb{height:104px;background:linear-gradient(140deg,#f7f8fa 0%,#eceef2 100%);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;border-bottom:1px solid var(--border);}
  .ag-clinicas .inv-thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 120%, var(--primary-soft) 0%, transparent 62%);}
  .ag-clinicas .inv-thumb > span.em{position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(16,20,24,.16));}
  .ag-clinicas .inv-card.sold{opacity:.62;}
  .ag-clinicas .inv-card.sold .inv-thumb > span.em{filter:grayscale(1) drop-shadow(0 3px 6px rgba(16,20,24,.12));}
  .ag-clinicas .inv-thumb .inv-status{position:absolute;z-index:2;top:8px;right:8px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.92);}
  .ag-clinicas .inv-body{padding:11px 12px 12px;}
  .ag-clinicas .inv-title{font-size:13.5px;font-weight:700;}
  .ag-clinicas .inv-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-clinicas .inv-price{font-size:14.5px;font-weight:800;color:var(--primary-dark);margin-top:7px;}
  .ag-clinicas .inv-actions{display:flex;gap:6px;margin-top:9px;}
  .ag-clinicas .inv-actions .btn{flex:1;justify-content:center;padding:6px 8px;font-size:11.5px;}

  /* ---- campaigns ---- */
  .ag-clinicas .camp-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .ag-clinicas .camp-top{display:flex;align-items:center;gap:10px;}
  .ag-clinicas .camp-ic{width:36px;height:36px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .ag-clinicas .camp-name{font-size:14px;font-weight:700;}
  .ag-clinicas .camp-channel{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .ag-clinicas .camp-status{margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex:none;}
  .ag-clinicas .camp-status.on{background:#e6f7ee;color:#16794e;}
  .ag-clinicas .camp-status.off{background:#f1f2f4;color:var(--text-faint);}
  .ag-clinicas .camp-metrics{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;}
  .ag-clinicas .camp-metric .v{font-size:15px;font-weight:800;}
  .ag-clinicas .camp-metric .l{font-size:11px;color:var(--text-faint);margin-top:1px;}

  /* ---- KPI / dashboard ---- */
  .ag-clinicas .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px;}
  .ag-clinicas .kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);}
  .ag-clinicas .kpi .l{font-size:11.5px;color:var(--text-faint);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px;}
  .ag-clinicas .kpi .v{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.02em;}
  .ag-clinicas .kpi .d{font-size:11.5px;margin-top:3px;font-weight:600;}
  .ag-clinicas .kpi .d.up{color:#16794e;}
  .ag-clinicas .kpi .d.down{color:#c0392b;}
  .ag-clinicas .kpi .d.flat{color:var(--text-faint);}
  .ag-clinicas .dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start;}
  @media(max-width:1180px){ .ag-clinicas .dash-grid{grid-template-columns:1fr;} }
  .ag-clinicas .panel-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .ag-clinicas .panel-card h3{font-size:13.5px;font-weight:700;margin:0 0 2px;}
  .ag-clinicas .panel-card .ph-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
  .ag-clinicas .chart{display:flex;align-items:flex-end;gap:9px;height:150px;padding-top:6px;}
  .ag-clinicas .bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;}
  .ag-clinicas .bar-val{font-size:10.5px;font-weight:700;color:var(--text-dim);}
  .ag-clinicas .bar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--primary-light),var(--primary));transition:.25s;}
  .ag-clinicas .bar-wrap:hover .bar{background:var(--primary-dark);}
  .ag-clinicas .bar-lab{font-size:10.5px;color:var(--text-faint);font-weight:600;}
  .ag-clinicas .funnel-step{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .ag-clinicas .funnel-lab{font-size:12px;font-weight:600;width:112px;flex:none;color:var(--text-dim);}
  .ag-clinicas .funnel-track{flex:1;height:22px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .ag-clinicas .funnel-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary-light),var(--primary));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;}
  .ag-clinicas .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .ag-clinicas .rank-row:last-child{border-bottom:none;}
  .ag-clinicas .rank-pos{width:20px;height:20px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .ag-clinicas .rank-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ag-clinicas .rank-val{font-size:12.5px;font-weight:700;color:var(--primary-dark);flex:none;}
  .ag-clinicas .feed-row{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-clinicas .feed-row:last-child{border-bottom:none;}
  .ag-clinicas .feed-ic{width:26px;height:26px;border-radius:7px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
  .ag-clinicas .feed-txt{font-size:12.5px;line-height:1.4;flex:1;}
  .ag-clinicas .feed-time{font-size:11px;color:var(--text-faint);flex:none;}

  /* ---- calendar ---- */
  .ag-clinicas .cal-wrap{display:flex;gap:14px;align-items:flex-start;}
  .ag-clinicas .cal-main{flex:1;min-width:0;}
  .ag-clinicas .cal-side{width:296px;flex:none;}
  @media(max-width:1080px){ .ag-clinicas .cal-wrap{flex-direction:column;} .ag-clinicas .cal-side{width:100%;} }
  .ag-clinicas .cal-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .ag-clinicas .cal-month{font-size:16px;font-weight:800;min-width:170px;}
  .ag-clinicas .cal-legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;}
  .ag-clinicas .cal-leg{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px;font-weight:600;}
  .ag-clinicas .cal-leg .sw{width:9px;height:9px;border-radius:3px;}
  .ag-clinicas .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .ag-clinicas .cal-dow{background:#fafbfc;padding:8px 6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--text-faint);text-align:center;text-transform:uppercase;}
  .ag-clinicas .cal-cell{background:#fff;min-height:98px;padding:6px 6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:.12s;}
  .ag-clinicas .cal-cell:hover{background:var(--bg);}
  .ag-clinicas .cal-cell.other{background:#fbfbfc;}
  .ag-clinicas .cal-cell.other .cal-num{color:var(--text-faint);opacity:.55;}
  .ag-clinicas .cal-cell.sel{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary);}
  .ag-clinicas .cal-num{font-size:11.5px;font-weight:700;color:var(--text-dim);width:21px;height:21px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;}
  .ag-clinicas .cal-cell.today .cal-num{background:var(--primary);color:#fff;}
  .ag-clinicas .cal-ev{font-size:10.5px;font-weight:600;padding:2.5px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
  .ag-clinicas .cal-more{font-size:10px;color:var(--text-faint);font-weight:600;padding-left:3px;}
  .ag-clinicas .cal-side-head{display:flex;align-items:baseline;gap:8px;margin-bottom:11px;}
  .ag-clinicas .cal-side-head .d{font-size:15px;font-weight:800;}
  .ag-clinicas .cal-side-head .n{font-size:11.5px;color:var(--text-faint);margin-left:auto;font-weight:600;}
  .ag-clinicas .slot{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-clinicas .slot:last-child{border-bottom:none;}
  .ag-clinicas .slot-time{font-size:12px;font-weight:800;width:42px;flex:none;color:var(--text-dim);padding-top:1px;}
  .ag-clinicas .slot-bar{width:3px;border-radius:2px;flex:none;}
  .ag-clinicas .slot-body{flex:1;min-width:0;}
  .ag-clinicas .slot-title{font-size:12.5px;font-weight:700;line-height:1.32;}
  .ag-clinicas .slot-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-clinicas .slot-tag{font-size:10px;font-weight:700;padding:1.5px 7px;border-radius:5px;display:inline-block;margin-top:5px;}
  .ag-clinicas .cal-empty{font-size:12.5px;color:var(--text-faint);text-align:center;padding:26px 6px;}

  /* ---- forms / simulator ---- */
  .ag-clinicas .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;}
  .ag-clinicas .field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);margin-bottom:5px;}
  .ag-clinicas .field input, .ag-clinicas .field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:#fff;color:var(--text);}
  .ag-clinicas .field input:focus, .ag-clinicas .field select:focus{border-color:var(--primary);}
  .ag-clinicas .field .hintx{font-size:10.5px;color:var(--text-faint);margin-top:4px;}
  .ag-clinicas .result-box{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:12px;padding:16px 18px;margin-top:14px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;}
  .ag-clinicas .result-box .rb{min-width:120px;}
  .ag-clinicas .result-box .rb .l{font-size:11px;opacity:.85;font-weight:600;}
  .ag-clinicas .result-box .rb .v{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.02em;}
  .ag-clinicas .result-box .rb.small .v{font-size:15px;}
  .ag-clinicas .cmp-wrap{margin-top:14px;}
  .ag-clinicas .cmp-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg);border:1px solid var(--border);}
  .ag-clinicas .cmp-seg{height:100%;transition:width .2s;}
  .ag-clinicas .cmp-seg.a{background:var(--primary-dark);}
  .ag-clinicas .cmp-seg.b{background:var(--primary);}
  .ag-clinicas .cmp-seg.c{background:var(--primary-light);}
  .ag-clinicas .cmp-leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--text-dim);font-weight:600;align-items:center;}
  .ag-clinicas .cmp-leg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;}
  .ag-clinicas .cmp-leg i.a{background:var(--primary-dark);}
  .ag-clinicas .cmp-leg i.b{background:var(--primary);}
  .ag-clinicas .cmp-leg i.c{background:var(--primary-light);}
  .ag-clinicas .cmp-leg .cmp-tot{margin-left:auto;color:var(--text-faint);font-weight:600;}

  /* ---- toggle switch ---- */
  .ag-clinicas .sw-toggle{width:38px;height:22px;border-radius:999px;background:#d3d6db;position:relative;flex:none;border:none;padding:0;transition:.18s;}
  .ag-clinicas .sw-toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .ag-clinicas .sw-toggle.on{background:var(--primary);}
  .ag-clinicas .sw-toggle.on::after{left:19px;}
  .ag-clinicas .set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .ag-clinicas .set-row:last-child{border-bottom:none;}
  .ag-clinicas .set-txt{flex:1;min-width:0;}
  .ag-clinicas .set-txt .t{font-size:13px;font-weight:600;}
  .ag-clinicas .set-txt .s{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  /* ---- in-page tabs ---- */
  .ag-clinicas .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
  .ag-clinicas .ptab{font-size:13px;font-weight:600;padding:9px 14px;border:none;background:transparent;color:var(--text-dim);border-bottom:2px solid transparent;white-space:nowrap;}
  .ag-clinicas .ptab:hover{color:var(--text);}
  .ag-clinicas .ptab.active{color:var(--primary-dark);border-bottom-color:var(--primary);}

  /* ---- kanban ---- */
  .ag-clinicas .kb-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start;}
  .ag-clinicas .kb-col{background:#f2f3f5;border-radius:12px;padding:10px;min-height:120px;}
  .ag-clinicas .kb-col-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:0 3px;}
  .ag-clinicas .kb-col-head .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .ag-clinicas .kb-col-head .t{font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--text-dim);}
  .ag-clinicas .kb-col-head .n{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-faint);background:#fff;border-radius:999px;padding:1px 8px;}
  .ag-clinicas .kb-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.14s;}
  .ag-clinicas .kb-card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .ag-clinicas .kb-card .t{font-size:12.5px;font-weight:700;line-height:1.35;}
  .ag-clinicas .kb-card .s{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .ag-clinicas .kb-card .m{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .ag-clinicas .kb-chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .ag-clinicas .kb-who{margin-left:auto;width:21px;height:21px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;}
  .ag-clinicas .kb-move{display:flex;gap:5px;margin-top:8px;}
  .ag-clinicas .kb-move button{flex:1;font-size:10.5px;font-weight:700;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-dim);}
  .ag-clinicas .kb-move button:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-light);}
  .ag-clinicas .kb-move button:disabled{opacity:.35;cursor:default;}

  /* ---- generic status pills ---- */
  .ag-clinicas .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;}
  .ag-clinicas .tbl-actions{display:flex;gap:5px;}
  .ag-clinicas .mini-btn{font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-dim);}
  .ag-clinicas .mini-btn:hover{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-light);}
  .ag-clinicas .wa-num{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
  .ag-clinicas .wa-num:last-child{border-bottom:none;}
  .ag-clinicas .wa-ic{width:38px;height:38px;border-radius:10px;background:#e4f6ec;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
  .ag-clinicas .live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.18);flex:none;}
  .ag-clinicas .live-dot.off{background:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.16);}

  /* ---- drawer (ficha) ---- */
  .ag-clinicas .dw-back{position:fixed;inset:0;background:rgba(16,20,24,.42);z-index:88;opacity:0;pointer-events:none;transition:.16s;}
  .ag-clinicas .dw-back.open{opacity:1;pointer-events:auto;}
  .ag-clinicas .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--bg);z-index:89;transform:translateX(102%);transition:transform .2s cubic-bezier(.25,.8,.4,1);display:flex;flex-direction:column;box-shadow:-18px 0 46px -18px rgba(16,20,24,.34);}
  .ag-clinicas .drawer.open{transform:none;}
  .ag-clinicas .dw-head{background:#fff;padding:18px 20px 16px;border-bottom:1px solid var(--border);}
  .ag-clinicas .dw-top{display:flex;align-items:flex-start;gap:12px;}
  .ag-clinicas .dw-ava{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;flex:none;}
  .ag-clinicas .dw-name{font-size:16.5px;font-weight:800;line-height:1.25;}
  .ag-clinicas .dw-meta{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .ag-clinicas .dw-x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text-dim);font-size:15px;line-height:1;flex:none;}
  .ag-clinicas .dw-x:hover{background:var(--bg);}
  .ag-clinicas .dw-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .ag-clinicas .dw-actions{display:flex;gap:8px;margin-top:14px;}
  .ag-clinicas .dw-actions .btn{flex:1;justify-content:center;padding:8px 6px;font-size:12px;}
  .ag-clinicas .dw-body{flex:1;overflow-y:auto;padding:16px 20px 24px;}
  .ag-clinicas .dw-sec{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:12px;}
  .ag-clinicas .dw-sec h4{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 11px;}
  .ag-clinicas .dw-kv{display:flex;justify-content:space-between;gap:12px;padding:6.5px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
  .ag-clinicas .dw-kv:last-child{border-bottom:none;}
  .ag-clinicas .dw-kv .k{color:var(--text-faint);font-weight:600;flex:none;}
  .ag-clinicas .dw-kv .v{font-weight:600;text-align:right;}
  .ag-clinicas .dw-person{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);}
  .ag-clinicas .dw-person:last-child{border-bottom:none;}
  .ag-clinicas .dw-person .pa{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;flex:none;}
  .ag-clinicas .dw-person .pn{font-size:13px;font-weight:700;}
  .ag-clinicas .dw-person .ps{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ag-clinicas .dw-person .pt{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--primary-soft);color:var(--primary-dark);flex:none;}
  .ag-clinicas .dw-tl{position:relative;padding-left:20px;}
  .ag-clinicas .dw-tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);border-radius:2px;}
  .ag-clinicas .dw-tl-item{position:relative;padding:0 0 13px;}
  .ag-clinicas .dw-tl-item:last-child{padding-bottom:0;}
  .ag-clinicas .dw-tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .ag-clinicas .dw-tl-item .tt{font-size:12.5px;line-height:1.4;}
  .ag-clinicas .dw-tl-item .td{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .ag-clinicas .dw-note{background:#fffaf0;border:1px dashed #e3c88f;border-radius:10px;padding:10px 12px;font-size:12px;color:#8a6415;line-height:1.45;}

  /* ---- financeiro / serviços ---- */
  .ag-clinicas .money{font-variant-numeric:tabular-nums;font-weight:700;}
  .ag-clinicas .late{color:#c0392b;font-weight:800;font-variant-numeric:tabular-nums;}
  .ag-clinicas .muted-cell{color:var(--text-faint);}
  .ag-clinicas .ruler{display:flex;flex-direction:column;gap:0;}
  .ag-clinicas .ruler-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border);}

    check:'<path d="M9 11l3 3 6-6"/><rect x="3" y="4" width="18" height="17" rx="2"/>',

  function iconSvg(key){
    const p = ICON_PATHS[key];
    if(!p) return null;
    return `<svg class="nvic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }
  function capFirst(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* ---------------- Modal ---------------- */
  function closeModal(){
    const b = $('#modalBack');
    b.classList.remove('open');
    setTimeout(()=>{ if(!b.classList.contains('open')) $('#modalBox').innerHTML=''; }, 200);
  }

  function openModal(cfg){
    const box = $('#modalBox');
    const back = $('#modalBack');
    box.innerHTML = `
      <div class="modal-head">
        <div class="mh-ic">${cfg.icon||'✏️'}</div>
        <div><h2>${cfg.title}</h2>${cfg.subtitle?`<div class="mh-sub">${cfg.subtitle}</div>`:''}</div>
        <button class="modal-x" id="mdX">✕</button>
      </div>
      <div class="modal-body">
        ${cfg.preview? '<div class="modal-preview" id="mdPreview"></div>':''}
        <div class="form-grid" id="mdFields"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="mdCancel">Cancelar</button>
        <button class="btn primary" id="mdOk">${cfg.submitLabel||'Salvar'}</button>
      </div>`;

    const wrap = $('#mdFields');
    const refs = {};
    cfg.fields.forEach(f=>{
      const d = document.createElement('div');
      d.className = 'field' + (f.wide?' wide':'');
      let input;
      if(f.type==='select'){
        input = `<select data-f="${f.k}">${f.options.map(o=>`<option value="${o.v!==undefined?o.v:o}"${(f.value!==undefined&&String(f.value)===String(o.v!==undefined?o.v:o))?' selected':''}>${o.l||o}</option>`).join('')}</select>`;
      } else if(f.type==='swatch'){
        input = `<div class="swatch-row" data-f="${f.k}">${f.options.map(o=>`<button type="button" class="swatch${o.v===f.value?' sel':''}" data-v="${o.v}" title="${o.l}" style="background:${o.v}"></button>`).join('')}</div>`;
      } else if(f.type==='photo'){
        input = `<div class="drop-zone" data-f="${f.k}" data-val="">
            <b id="dzT-${f.k}">📷 Escolher foto</b>
            <span id="dzS-${f.k}">Clique ou arraste uma imagem — ela aparece no card</span>
            <input type="file" accept="image/*"/>
          </div>`;
      } else {
        input = `<input data-f="${f.k}" type="${f.type||'text'}" value="${f.value!==undefined?f.value:''}" placeholder="${f.ph||''}"${f.step?` step="${f.step}"`:''}/>`;
      }
      d.innerHTML = `<label>${f.l}${f.req?' *':''}</label>${input}${f.h?`<div class="hintx">${f.h}</div>`:''}<div class="err">${f.errMsg||'Campo obrigatório'}</div>`;
      wrap.appendChild(d);
      refs[f.k] = d;
    });

    function readValues(){
      const out = {};
      cfg.fields.forEach(f=>{
        const d = refs[f.k];
        if(f.type==='swatch'){
          const sel = d.querySelector('.swatch.sel');
          out[f.k] = sel? sel.getAttribute('data-v') : (f.value||'');
        } else if(f.type==='photo'){
          out[f.k] = d.querySelector('.drop-zone').getAttribute('data-val') || '';
        } else {
          out[f.k] = d.querySelector('[data-f]').value;
        }
      });
      return out;
    }

    // swatch picking + live preview
    wrap.querySelectorAll('.swatch').forEach(sw=>{
      sw.onclick = ()=>{
        sw.parentElement.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));
        sw.classList.add('sel');
        refresh();
      };
    });
    wrap.querySelectorAll('[data-f]').forEach(el=>{
      if(el.classList.contains('swatch-row') || el.classList.contains('drop-zone')) return;
      el.addEventListener('input', refresh);
      el.addEventListener('change', refresh);
    });

    // photo drop zones
    wrap.querySelectorAll('.drop-zone').forEach(dz=>{
      const key = dz.getAttribute('data-f');
      const fileInput = dz.querySelector('input[type=file]');
      const loadFile = (file)=>{
        if(!file || !/^image\//.test(file.type)) return;
        const rd = new FileReader();
        rd.onload = ()=>{
          dz.setAttribute('data-val', rd.result);
          const t = dz.querySelector('#dzT-'+key), sub = dz.querySelector('#dzS-'+key);
          if(t) t.textContent = '✅ ' + file.name;
          if(sub) sub.textContent = 'Clique para trocar a foto';
          refresh();
        };
        rd.readAsDataURL(file);
      };
      dz.onclick = ()=> fileInput.click();
      fileInput.onchange = ()=> loadFile(fileInput.files[0]);
      dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', ()=> dz.classList.remove('over'));
      dz.addEventListener('drop', (e)=>{
        e.preventDefault(); dz.classList.remove('over');
        loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
      });
    });

    function refresh(){
      if(cfg.preview && $('#mdPreview')) $('#mdPreview').innerHTML = cfg.preview(readValues());
    }
    refresh();

    $('#mdX').onclick = closeModal;
    $('#mdCancel').onclick = closeModal;
    $('#mdOk').onclick = ()=>{
      const v = readValues();
      let bad = false;
      cfg.fields.forEach(f=>{
        const empty = !String(v[f.k]||'').trim();
        const invalid = f.req && empty;
        refs[f.k].classList.toggle('invalid', !!invalid);
        if(invalid) bad = true;
      });
      if(bad) return;
      cfg.onSubmit(v);
      closeModal();
    };
    back.onclick = (e)=>{ if(e.target===back) closeModal(); };
    back.classList.add('open');
    const first = wrap.querySelector('input,select');
    if(first) setTimeout(()=>first.focus(), 60);
  }

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){
      if($('#modalBack').classList.contains('open')) closeModal();
      else if($('#drawer').classList.contains('open')) closeDrawer();
    }
  });

  /* ---------------- Vector art (veículos / imóveis) ---------------- */
  function shade(hex, amt){
    const h = hex.replace('#','');
    const n = parseInt(h.length===3? h.split('').map(c=>c+c).join('') : h, 16);
    let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    const f = (c)=> Math.max(0, Math.min(255, Math.round(amt>0 ? c + (255-c)*amt : c*(1+amt))));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  const CAR_SHAPES = {

  function guessKind(kind, title){
    if(CAR_SHAPES[kind]) return kind;
    const t = (title||'').toLowerCase();
    for(const [k, words] of KIND_HINTS){ if(words.some(w=>t.includes(w))) return k; }
    return 'sedan';
  }

  function vehicleArt(kind, paint){
    const S = CAR_SHAPES[kind] || CAR_SHAPES.sedan;
    const base = paint || '#5b6470';
    const lightC = shade(base, .22), midC = base, darkC = shade(base, -.26), edge = shade(base, -.5);
    const isPale = /^#(f|e)/i.test(String(base));
    const glass = '#c3d0de', glassD = '#93a6bb';
    const id = 'ag' + (++__artSeq);
    const wheel = (cx)=>`

      ${S.wins.map(w=>`<path d="${w}" fill="${glass}" stroke="${glassD}" stroke-width="1" stroke-linejoin="round"/>`).join('')}
      <path d="${S.belt}" stroke="${edge}" stroke-width="1" opacity=".45"/>
      <rect x="${S.nose[0]}" y="${S.nose[1]}" width="13" height="7" rx="3.5" fill="#ffe6a0" stroke="${edge}" stroke-width=".9"/>
      <rect x="${S.tail[0]}" y="${S.tail[1]}" width="11" height="6.5" rx="3" fill="#e2564a" stroke="${edge}" stroke-width=".9"/>
      ${S.arches.map(arch).join('')}
      <path d="M13,84 L${S.bed?189:185},84" stroke="${edge}" stroke-width="1.2" opacity=".7"/>
      ${S.wheels.map(wheel).join('')}
    </svg>`;
  }

  const PROP_SHAPES = {
    apto:    {floors:5, cols:3, roofPeak:false},
    alto:    {floors:7, cols:3, roofPeak:false},
    studio:  {floors:3, cols:2, roofPeak:false},
    locacao: {floors:4, cols:3, roofPeak:false},
    comercial:{floors:6, cols:4, roofPeak:false},
    casa:    {floors:2, cols:3, roofPeak:true},
  };

  function propertyArt(kind, tint){
    const S = PROP_SHAPES[kind] || PROP_SHAPES.apto;
    const base = tint || '#7C3AED';
    const wall = '#f2f3f6', wallD = '#dfe2e8', edge = '#c3c8d1';
    const win = shade(base, .55), winD = shade(base, .18);
    const W = S.roofPeak? 116 : 96, X = (200-W)/2;
    const topY = S.roofPeak? 34 : 16;
    const H = 92 - topY;
    const rows = [];
    const padX = 12, padY = S.roofPeak? 10 : 12;
    const availW = W - padX*2, availH = H - padY - 22;
    const wW = Math.min(17, (availW - (S.cols-1)*8)/S.cols);
    const wH = Math.min(13, (availH - (S.floors-1)*7)/S.floors);
    for(let r=0;r<S.floors;r++){
      for(let c=0;c<S.cols;c++){
        const x = X + padX + c*(wW+8);
        const y = topY + padY + r*(wH+7);
        const lit = ((r*S.cols+c) % 3 === 0);
        rows.push(`<rect x="${x}" y="${y}" width="${wW}" height="${wH}" rx="2.5" fill="${lit?win:winD}" stroke="${edge}" stroke-width=".7"/>`);
      }
    }
    return `<svg class="art-svg" viewBox="0 0 200 112" preserveAspectRatio="xMidYMid meet">
      <ellipse cx="100" cy="99" rx="72" ry="6" fill="rgba(16,20,24,.10)"/>
      ${S.roofPeak? `<path d="M${X-10},${topY+2} L100,10 L${X+W+10},${topY+2} Z" fill="${shade(base,-.15)}" stroke="${shade(base,-.4)}" stroke-width="1.1" stroke-linejoin="round"/>`
                  : `<rect x="${X-6}" y="${topY-6}" width="${W+12}" height="8" rx="3" fill="${shade(base,-.1)}"/>`}
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="${wall}" stroke="${edge}" stroke-width="1.2"/>
      <rect x="${X}" y="${topY}" width="${W}" height="${H}" fill="url(#none)" />
      ${rows.join('')}
      <rect x="${100-11}" y="72" width="22" height="20" rx="2.5" fill="${shade(base,-.05)}" stroke="${shade(base,-.35)}" stroke-width="1"/>
      <circle cx="${100+5}" cy="82" r="1.6" fill="#fff"/>
      <rect x="${X-4}" y="90" width="${W+8}" height="4" rx="2" fill="${wallD}"/>
    </svg>`;
  }

  const PAINT_NAMES = [
    ['cinza grafite','#4a4f57'],['grafite','#4a4f57'],['branco pérola','#f2f3f5'],['branco polar','#f4f5f7'],
    ['branco','#f2f3f5'],['preto','#23272e'],['prata','#c2c6cc'],['vermelho','#b0271f'],
    ['azul','#1f4f8f'],['verde','#1f6b4a'],['cinza','#8f959e'],['bege','#cbbfa6'],
  ];
  function paintOf(it){
    if(it.paint) return it.paint;
    const t = ((it.sub||'') + ' ' + (it.extra||'')).toLowerCase();
    for(const [name, hex] of PAINT_NAMES){ if(t.includes(name)) return hex; }
    return '#6b7280';
  }

  function itemArt(it){
    if(it.photo){
      return `<img class="art-photo" src="${it.photo}" alt="${(it.title||'').replace(/"/g,'')}"/>`;
    }
    const style = (DATA.inventoryView && DATA.inventoryView.artStyle) || it.artStyle;
    if(style==='vehicle') return vehicleArt(guessKind(it.art || it.category, it.title || it.sub), paintOf(it));
    if(style==='property') return propertyArt(it.art || it.category, DATA.accent);
    return `<span class="icon-badge"><span class="em">${it.emoji||'📦'}</span></span>`;
  }

  const AVATAR_COLORS = ['#EF6C42','#7C3AED','#2563EB','#0EA5A4','#DB2777','#F59E0B','#16A34A','#6366F1'];
  function colorFor(id){
    let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0)) % 997;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  /* ---------------- Sidebar / Nav (folder tree) ---------------- */
  function collectExpandable(items){
    let ids=[];
    (items||[]).forEach(i=>{ if(i.children && i.children.length){ ids.push(i.id); ids = ids.concat(collectExpandable(i.children)); } });
    return ids;
  }
  state.expanded = new Set(collectExpandable(DATA.nav));

  function nodeIsActive(item){
    if(item.id===state.navId) return true;
    if(item.children) return item.children.some(nodeIsActive);
    return false;
  }

  function renderNav(){
    const nav = $('#navList');
    nav.innerHTML = '';
    DATA.nav.forEach(item=>{
      if(item.section){
        const lab = document.createElement('div');
        lab.className='nav-label';
        lab.textContent = item.section;
        nav.appendChild(lab);
        return;
      }
      nav.appendChild(renderNode(item, 0, null));
    });
  }

  function renderNode(item, depth, ctx){
    const wrap = document.createElement('div');
    const hasChildren = item.children && item.children.length;
    const isTag = !!item.tagColor;
    const newCtx = item.view ? item : ctx;

    const btn = document.createElement('button');
    let active = item.id===state.navId;
    btn.className = 'nav-item' + (active ? ' active':'');
    btn.style.paddingLeft = (8 + depth*13) + 'px';
    const chev = hasChildren ? `<span class="chev${state.expanded.has(item.id)?' open':''}">▸</span>` : (depth>0 ? '<span class="chev-spacer"></span>' : '');
    const svg = item.icon ? iconSvg(item.icon) : null;
    const iconHtml = isTag
      ? `<span class="tag-dot" style="background:${item.tagColor}"></span>`
      : (svg ? `<span class="ic">${svg}</span>`
             : (item.icon ? `<span class="ic">${item.icon}</span>`
                          : (depth>0? '<span class="chev-spacer"></span>' : '')));
    btn.innerHTML = chev + iconHtml + `<span>${item.label}</span>` + (item.count!==undefined? `<span class="count">${item.count}</span>`:'');
    btn.onclick = ()=>{
      if(hasChildren){
        if(state.expanded.has(item.id)) state.expanded.delete(item.id); else state.expanded.add(item.id);
        renderNav();
        return;
      }
      if(isTag){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses || [item.label], statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.filter){
        if(!ctx) return;
        activateWithFilter(ctx, { unreadOnly: item.filter==='unread', navId: item.id });
        return;
      }
      if(item.statuses){
        if(!ctx) return;
        activateWithFilter(ctx, { statuses: item.statuses, statusLabel: item.label, navId: item.id, list: item.list });
        return;
      }
      if(item.view){ selectNav(item); }
    };
    wrap.appendChild(btn);

    if(hasChildren && state.expanded.has(item.id)){
      const kids = document.createElement('div');
      kids.className='nav-children';
      item.children.forEach(c=> kids.appendChild(renderNode(c, depth+1, newCtx)));
      wrap.appendChild(kids);
    }
    return wrap;
  }

  function activateWithFilter(ctx, opts){
    selectNav(ctx, true);
    if(opts.list) state.contactList = opts.list;
    state.listQuery = '';
    state.statusFilter = opts.statuses || null;
    state.statusLabel = opts.statusLabel || '';
    state.unreadOnly = !!opts.unreadOnly;
    if(opts.navId){ state.navId = opts.navId; renderNav(); }
    if(ctx.view==='conversas'){
      $('#listSearch').value = '';
      renderConvList();
    } else if(ctx.view==='contacts'){
      renderContacts();
      cvPage = 1;
      paintContactsList('');
    }
  }

  function clearStatusFilter(){
    state.statusFilter = null;
    state.statusLabel = '';
    cvPage = 1;
    paintContactsList($('#cvSearch') ? $('#cvSearch').value : '');
  }

  function selectNav(item, keepNavId){
    state.navId = item.id;
    state.view = item.view;
    if(item.view==='contacts') state.contactList = item.list || null;
    if(!keepNavId){ state.listQuery=''; state.unreadOnly=false; state.statusFilter=null; state.statusLabel=''; }
    renderNav();
    if(item.view==='conversas'){
      $('#listCol').style.display='flex';
      $('#chatCol').style.display='flex';
      $('#fullView').style.display='none';
      if(!keepNavId){ $('#listSearch').value=''; }
      renderConvList();
      renderChat();
    } else {
      $('#listCol').style.display='none';
      $('#chatCol').style.display='none';
      $('#fullView').style.display='flex';
      if(item.view==='contacts') renderContacts();
      else if(item.view==='agenda') renderCalendar();
      else if(item.view==='inventory') renderInventory();
      else if(item.view==='campaigns') renderCampaigns();
      else if(item.view==='dashboard') renderDashboard();
      else if(item.view==='finance') renderFinance();
      else if(item.view==='trades') renderTrades();
      else if(item.view==='reports') renderReports();
      else if(item.view==='tasks') renderTasks();
      else if(item.view==='whatsapp') renderWhatsapp();
      else if(item.view==='settings') renderSettings();
      else if(item.view==='billing') renderBilling();
      else if(item.view==='services') renderServices();
      else if(item.view==='margem') renderMargem();
      else if(item.view==='reativacao') renderReativacao();
      else renderPlaceholder(item.label);
    }
    $('#appRoot').classList.add('chat-mobile');
    $('#sidebar').classList.remove('open');
  }

  /* ---------------- Conversation list ---------------- */
  function filteredConvs(){
    let list = DATA.conversations.slice();
    if(state.activeTab && state.activeTab!=='todas'){
      list = list.filter(c => (c.tabs||[]).includes(state.activeTab));
    }
    if(state.unreadOnly) list = list.filter(c=>c.unread);
    if(state.listQuery){
      const q = state.listQuery.toLowerCase();
      list = list.filter(c => c.name.toLowerCase().includes(q) || c.preview.toLowerCase().includes(q));
    }
    return list;
  }

  function renderTabs(){
    const row = $('#tabsRow');
    row.innerHTML='';
    (DATA.filterTabs||[]).forEach(t=>{
      const chip = document.createElement('button');
      chip.className = 'tab-chip' + (state.activeTab===t.id?' active':'');
      const count = t.id==='todas' ? DATA.conversations.length : DATA.conversations.filter(c=>(c.tabs||[]).includes(t.id)).length;
      chip.textContent = `${t.label} ${count}`;
      chip.onclick = ()=>{ state.activeTab=t.id; renderTabs(); renderConvList(); };
      row.appendChild(chip);
    });
  }

  function renderConvList(){
    const scroll = $('#convScroll');
    scroll.innerHTML='';
    const list = filteredConvs();
    if(!list.length){
      scroll.innerHTML = `<div style="padding:30px 16px;text-align:center;color:var(--text-faint);font-size:13px;">Nenhuma conversa encontrada.</div>`;
      return;
    }
    list.forEach(c=>{
      const el = document.createElement('div');
      el.className = 'conv-item' + (c.id===state.activeConvId?' active':'');
      const avaColor = colorFor(c.id);
      el.innerHTML = `
        <div class="conv-ava" style="background:${avaColor}">${initials(c.name)}</div>
        <div class="conv-body">
          <div class="conv-top">
            <div class="conv-name">${c.name}</div>
            <div class="conv-time">${c.time}</div>
          </div>
          <div class="conv-prev">${c.preview}</div>
          <div class="conv-tags">
            ${(c.tags||[]).map(t=>`<span class="mini-tag">${t}</span>`).join('')}
            ${c.resolved?'<span class="resolved-pill">Resolvida</span>':''}
          </div>
        </div>
        ${c.unread?'<div class="unread-dot"></div>':''}
      `;
      el.onclick = ()=>{ c.unread=false; state.activeConvId=c.id; renderConvList(); renderChat(); $('#appRoot').classList.add('chat-mobile'); };
      scroll.appendChild(el);
    });
  }

  /* ---------------- Chat panel ---------------- */
  function getConv(id){ return DATA.conversations.find(c=>c.id===id); }

  function renderChat(){
    const c = getConv(state.activeConvId);
    const col = $('#chatCol');
    if(!c){ col.innerHTML = `<div class="empty-chat"><div class="em-ic">💬</div><div>Selecione uma conversa</div></div>`; return; }
    const avaColor = colorFor(c.id);
    col.innerHTML = `
      <div class="chat-head">
        <div class="chat-head-row">
          <button class="icon-btn mobile-back" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="chat-ava" style="background:${avaColor}">${initials(c.name)}</div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="chat-name">${c.name}</span>
              <span class="badge">${c.badge||'Lead'}</span>
              <span class="badge ${c.resolved?'status-resolved':'status-open'}">${c.resolved?'Resolvida':'Em aberto'}</span>
            </div>
          </div>
          <div class="chat-actions">
            <button class="btn ghost" id="simBtn">✨ Simular resposta</button>
            <button class="btn" id="resolveBtn">${c.resolved? 'Reabrir':'Resolver'} ▾</button>
            <button class="btn primary" id="primaryActionBtn">${c.primaryAction||'Ver detalhes'}</button>
          </div>
        </div>
        <div class="chat-meta">
          ${(c.metaChips||[]).map(m=>`<span class="meta-chip ${m.strong?'strong':''}">${m.icon||''} ${m.text}</span>`).join('')}
        </div>
      </div>
      <div class="chat-scroll" id="chatScroll"></div>
      <div class="quick-row" id="quickRow"></div>
      <div class="composer">
        <textarea id="msgInput" placeholder="Digite sua mensagem... (Shift+Enter = nova linha)"></textarea>
        <div class="composer-bottom">
          <div class="composer-icons">
            <button class="icon-btn" title="Emoji">🙂</button>
            <button class="icon-btn" title="Anexar">📎</button>
            <button class="icon-btn" title="Modelos">🧩</button>
          </div>
          <button class="send-btn" id="sendBtn">Enviar ⌘⏎</button>
        </div>
      </div>
    `;
    renderMessages();
    renderQuickReplies();

    $('#backBtn').onclick = ()=> $('#appRoot').classList.remove('chat-mobile');
    $('#sendBtn').onclick = sendMessage;
    $('#msgInput').addEventListener('keydown', (e)=>{
      if((e.key==='Enter' && (e.metaKey||e.ctrlKey)) ){ sendMessage(); }
    });
    $('#resolveBtn').onclick = ()=>{
      c.resolved = !c.resolved;
      toast(c.resolved? 'Conversa marcada como resolvida ✅' : 'Conversa reaberta');
      renderChat(); renderConvList();
    };
    $('#primaryActionBtn').onclick = ()=> toast('Ação de demonstração: "' + (c.primaryAction||'Ver detalhes') + '" — disponível na versão completa.');
    $('#simBtn').onclick = ()=> simulateIncoming(c);
  }

  function renderMessages(){
    const c = getConv(state.activeConvId);
    const scroll = $('#chatScroll');
    scroll.innerHTML = `<div class="day-sep">Hoje</div>`;
    const avaColor = colorFor(c.id);
    c.messages.forEach(m=>{
      if(m.note){
        const n = document.createElement('div');
        n.className='note-row';
        n.innerHTML = `📌 <b>Nota interna</b> · ${m.note}`;
        scroll.appendChild(n);
        return;
      }
      if(m.system){
        const n = document.createElement('div');
        n.className='sys-row';
        n.textContent = m.system;
        scroll.appendChild(n);
        return;
      }
      if(m.cards){
        const row = document.createElement('div');
        row.className='cards-row';
        row.innerHTML = `<div class="cards-label">📎 ${m.cardsLabel || 'Fotos e detalhes enviados'}</div>` + m.cards.map(card=>`
          <div class="item-card">
            <div class="thumb">${(card.photo || card.art)? itemArt({category:card.art, art:card.art, paint:card.paint, photo:card.photo, emoji:card.emoji, title:card.sub}) : `<span class="em" style="font-size:34px">${card.emoji||'🏷️'}</span>`}</div>
            <div class="ic-body">
              <div class="price">${card.title}</div>
              <div class="sub">${card.sub}</div>
              <div class="loc">${card.extra||''}</div>
            </div>
          </div>`).join('');
        scroll.appendChild(row);
        return;
      }
      const wrap = document.createElement('div');
      const isAgent = m.from==='agent';
      wrap.className = 'msg-row ' + (isAgent ? 'out':'in');
      const ava = isAgent
        ? `<div class="msg-ava">${DATA.agentInitials||'AG'}</div>`
        : `<div class="msg-ava" style="background:${avaColor}">${initials(c.name)}</div>`;
      wrap.innerHTML = ava + `<div class="msg-wrap"><div class="msg-bubble">${m.text}</div><div class="msg-time">${m.time}${isAgent?' ✓✓':''}</div></div>`;
      scroll.appendChild(wrap);
    });
    scroll.scrollTop = scroll.scrollHeight;
  }

  function renderQuickReplies(){
    const row = $('#quickRow');
    row.innerHTML='';
    (DATA.quickReplies||[]).forEach(q=>{
      const chip = document.createElement('button');
      chip.className='quick-chip';
      chip.textContent = q.label;
      chip.onclick = ()=>{
        const input = $('#msgInput');
        input.value = q.text;
        input.focus();
      };
      row.appendChild(chip);
    });
  }

  function nowTime(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }

  function sendMessage(){
    const input = $('#msgInput');
    const text = input.value.trim();
    if(!text) return;
    const c = getConv(state.activeConvId);
    c.messages.push({from:'agent', text: escapeHtml(text), time: nowTime()});
    c.preview = text;
    c.time = 'Agora';
    input.value='';
    renderMessages();
    renderConvList();
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function simulateIncoming(c){
    const scroll = $('#chatScroll');
    const typing = document.createElement('div');
    typing.className='typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    scroll.appendChild(typing);
    scroll.scrollTop = scroll.scrollHeight;
    setTimeout(()=>{
      typing.remove();
      const replies = DATA.simReplies || ['Perfeito, muito obrigado pela atenção!', 'Combinado então 👍', 'Pode ser, sim!'];
      const text = replies[Math.floor(Math.random()*replies.length)];
      c.messages.push({from:'client', text, time: nowTime()});
      c.preview = text; c.time='Agora'; c.unread = state.activeConvId!==c.id;
      renderMessages();
      renderConvList();
      toast('Nova mensagem simulada do cliente 📩');
    }, 1300);
  }

  /* ---------------- Gerenciador de fotos ---------------- */
  function normalizeName(t){
    return String(t).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/\.(jpe?g|png|webp|avif|gif)$/,'')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  // casa o nome do arquivo com o item de estoque por palavras em comum
  function matchItemIndex(fileName, items){
    const fw = normalizeName(fileName).split(' ').filter(w => w.length > 2);
    if(!fw.length) return -1;
    let best = -1, bestScore = 0;
    items.forEach((it, i)=>{
      const tw = normalizeName(it.title).split(' ').filter(Boolean);
      let score = 0;
      fw.forEach(w=>{ if(tw.some(t => t === w || (w.length>3 && t.startsWith(w)) || (t.length>3 && w.startsWith(t)))) score++; });
      // exige pelo menos duas palavras batendo, ou uma bem específica (modelo)
      const strong = score >= 2 || (score === 1 && fw.length === 1 && fw[0].length >= 4);
      if(strong && score > bestScore){ bestScore = score; best = i; }
    });
    return best;
  }

  // reduz a imagem para não inchar o arquivo exportado
  function shrinkImage(file, maxW, quality){
    return new Promise(function(resolve, reject){
      const rd = new FileReader();
      rd.onerror = reject;
      rd.onload = function(){
        const img = new Image();
        img.onerror = reject;
        img.onload = function(){
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(cv.toDataURL('image/jpeg', quality)); }
          catch(e){ resolve(rd.result); }
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  async function handlePhotoFiles(fileList){
    const iv = DATA.inventoryView;
    const files = Array.prototype.slice.call(fileList || []).filter(f => /^image\//.test(f.type));
    if(!files.length) return;

    // foto individual pedida por um item específico
    if(pmPending !== null && iv.items[pmPending]){
      const uri = await shrinkImage(files[0], 640, .72);
      iv.items[pmPending].photo = uri;
      pmPending = null;
      paintPhotoList();
      toast('Foto aplicada ✅');
      return;
    }

    let hit = 0;
    const misses = [];
    for(const f of files){
      const idx = matchItemIndex(f.name, iv.items);
      if(idx < 0){ misses.push(f.name); continue; }
      iv.items[idx].photo = await shrinkImage(f, 640, .72);
      hit++;
    }
    paintPhotoList(misses);
    if(hit && !misses.length) toast(hit + ' foto(s) aplicadas automaticamente ✅');
    else if(hit) toast(hit + ' aplicadas · ' + misses.length + ' sem correspondência');
    else toast('Nenhum nome bateu — use o botão da linha para escolher manualmente');
  }

      const el = clone.querySelector('#' + ROOT_ID + '-data');
      if(!el) throw new Error('bloco de dados não encontrado');
      el.textContent = JSON.stringify(DATA);
      const html = '<!doctype html>\n' + clone.outerHTML;
      const blob = new Blob([html], {type:'text/html;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'AutoGenius - ' + (DATA.productTag || 'Demo') + ' (com fotos).html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
      toast('Arquivo gerado — já vai com as fotos embutidas 💾');
    }catch(e){
      toast('Não foi possível gerar o arquivo aqui. Abra o HTML direto do seu computador e tente de novo.');

  /* ---------------- Calendar ---------------- */
  const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
  const DOW_FULL = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  let calCursor = null;
  let calSelected = null;

  function todayISO(){
    const t = DATA.calendarView && DATA.calendarView.today;
    return t || new Date().toISOString().slice(0,10);
  }
  function isoOf(y,m,d){
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }
  function parseISO(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function evTypeMeta(type){
    const t = (DATA.calendarView.types||[]).find(x=>x.id===type);
    return t || {id:type, label:type, color:'#6b7280', soft:'#f1f2f4'};
  }

  function renderCalendar(){
    const cv = DATA.calendarView;
    const t = parseISO(todayISO());
    calCursor = {y:t.getFullYear(), m:t.getMonth()};
    calSelected = todayISO();
    const fv = $('#fullView');
    fv.innerHTML = `
      <div class="full-head">
        <button class="icon-btn mobile-back" id="fvBackCal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div><h1>${cv.title}</h1><div class="sub">${cv.events.length} compromissos cadastrados</div></div>
        <div class="full-search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

          <div class="cal-main">

              <button class="icon-btn" id="calPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
              <button class="icon-btn" id="calNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
              <span class="cal-month" id="calMonthLabel"></span>
              <button class="btn" id="calToday">Hoje</button>
              <div class="cal-legend">
                ${(cv.types||[]).map(t=>`<span class="cal-leg"><span class="sw" style="background:${t.color}"></span>${t.label}</span>`).join('')}
              </div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
          </div>
          <div class="cal-side">
            <div class="panel-card" id="calDayPanel" style="margin-bottom:14px;"></div>
            <div class="panel-card" id="calNextPanel"></div>
          </div>
        </div>
      </div>
    `;
    $('#fvBackCal').onclick = ()=> $('#appRoot').classList.remove('chat-mobile');
    $('#calNewBtn').onclick = ()=> openNewEventModal(calSelected);
    $('#calPrev').onclick = ()=>{ calCursor.m--; if(calCursor.m<0){calCursor.m=11;calCursor.y--;} paintCalendar(); };
    $('#calNext').onclick = ()=>{ calCursor.m++; if(calCursor.m>11){calCursor.m=0;calCursor.y++;} paintCalendar(); };
    $('#calToday').onclick = ()=>{ const d=parseISO(todayISO()); calCursor={y:d.getFullYear(),m:d.getMonth()}; calSelected=todayISO(); paintCalendar(); };

  function calFilteredEvents(){
    const el = $('#calSearch');
    const q = (el? el.value : '').toLowerCase();
    let evs = DATA.calendarView.events;
    if(q) evs = evs.filter(e => (e.title+' '+e.who+' '+(e.note||'')).toLowerCase().includes(q));
    return evs;
  }

  function paintCalendar(){
    const cv = DATA.calendarView;
    const evs = calFilteredEvents();
    const byDate = {};
    evs.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
    Object.values(byDate).forEach(a=>a.sort((x,y)=> x.time.localeCompare(y.time)));

    $('#calMonthLabel').textContent = capFirst(MONTHS[calCursor.m]) + ' de ' + calCursor.y;

    // KPIs for the visible month
    const monthPrefix = calCursor.y + '-' + String(calCursor.m+1).padStart(2,'0');
    const monthEvs = evs.filter(e=>e.date.startsWith(monthPrefix));
    const todayEvs = byDate[todayISO()] || [];
    const confirmed = monthEvs.filter(e=>e.status==='Confirmado').length;
    const pending = monthEvs.filter(e=>e.status==='Pendente').length;
    $('#calKpis').innerHTML = `
      <div class="kpi"><div class="l">📅 No mês</div><div class="v">${monthEvs.length}</div><div class="d flat">compromissos agendados</div></div>
      <div class="kpi"><div class="l">⏱️ Hoje</div><div class="v">${todayEvs.length}</div><div class="d flat">na agenda de hoje</div></div>
      <div class="kpi"><div class="l">✅ Confirmados</div><div class="v">${confirmed}</div><div class="d up">${monthEvs.length? Math.round(confirmed/monthEvs.length*100):0}% do mês</div></div>
      <div class="kpi"><div class="l">⚠️ A confirmar</div><div class="v">${pending}</div><div class="d down">exigem follow-up</div></div>
    `;

    // grid
    const first = new Date(calCursor.y, calCursor.m, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(calCursor.y, calCursor.m+1, 0).getDate();
    const daysPrev = new Date(calCursor.y, calCursor.m, 0).getDate();
    const cells = [];
    for(let i=startOffset-1;i>=0;i--){
      const d = daysPrev-i;
      const pm = calCursor.m===0? 11 : calCursor.m-1;
      const py = calCursor.m===0? calCursor.y-1 : calCursor.y;
      cells.push({iso:isoOf(py,pm,d), d, other:true});
    }
    for(let d=1;d<=daysInMonth;d++) cells.push({iso:isoOf(calCursor.y,calCursor.m,d), d, other:false});
    while(cells.length % 7 !== 0 || cells.length < 35){
      const idx = cells.length - (startOffset + daysInMonth) + 1;
      const nm = calCursor.m===11? 0 : calCursor.m+1;
      const ny = calCursor.m===11? calCursor.y+1 : calCursor.y;
      cells.push({iso:isoOf(ny,nm,idx), d:idx, other:true});
    }

    const grid = $('#calGrid');
    grid.innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('') +
      cells.map(c=>{
        const dayEvs = byDate[c.iso] || [];
        const shown = dayEvs.slice(0,3);
        const rest = dayEvs.length - shown.length;
        const cls = ['cal-cell'];
        if(c.other) cls.push('other');
        if(c.iso===todayISO()) cls.push('today');
        if(c.iso===calSelected) cls.push('sel');
        return `<div class="${cls.join(' ')}" data-iso="${c.iso}">
          <div class="cal-num">${c.d}</div>
          ${shown.map(e=>{ const m=evTypeMeta(e.type); return `<div class="cal-ev" style="background:${m.soft};color:${m.color}">${e.time} ${e.who}</div>`; }).join('')}
          ${rest>0? `<div class="cal-more">+${rest} mais</div>`:''}
        </div>`;
      }).join('');
    grid.querySelectorAll('.cal-cell').forEach(cell=>{
      cell.onclick = ()=>{
        calSelected = cell.getAttribute('data-iso');
        const d = parseISO(calSelected);
        if(d.getMonth()!==calCursor.m){ calCursor = {y:d.getFullYear(), m:d.getMonth()}; }
        paintCalendar();
      };
    });

    // selected day panel
    const selEvs = byDate[calSelected] || [];
    const sd = parseISO(calSelected);
    $('#calDayPanel').innerHTML = `
      <div class="cal-side-head">
        <span class="d">${sd.getDate()} de ${capFirst(MONTHS[sd.getMonth()])}</span>
        <span class="n">${DOW_FULL[sd.getDay()]}</span>
      </div>
      <button class="btn" id="calDayAdd" style="width:100%;justify-content:center;margin-bottom:10px;">+ Adicionar neste dia</button>
      ${selEvs.length? selEvs.map(e=>{ const m=evTypeMeta(e.type); return `
        <div class="slot">
          <div class="slot-time">${e.time}</div>
          <div class="slot-bar" style="background:${m.color}"></div>
          <div class="slot-body">
            <div class="slot-title">${e.title}</div>
            <div class="slot-sub">${e.who}${e.note? ' · '+e.note : ''}</div>
            <span class="slot-tag" style="background:${m.soft};color:${m.color}">${e.status}</span>
          </div>
        </div>`; }).join('') : '<div class="cal-empty">Nenhum compromisso neste dia.<br/>Clique em outro dia do calendário.</div>'}
    `;
    $('#calDayPanel').querySelectorAll('.slot').forEach(s=> s.onclick = ()=> toast('Detalhe do agendamento — disponível na versão completa.'));
    const addBtn = $('#calDayAdd');
    if(addBtn) addBtn.onclick = ()=> openNewEventModal(calSelected);

    // upcoming panel
    const upcoming = evs.filter(e=> e.date >= todayISO()).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);
    $('#calNextPanel').innerHTML = `
      <h3>Próximos compromissos</h3>
      <div class="ph-sub">Ordenados por data</div>
      ${upcoming.map(e=>{ const m=evTypeMeta(e.type); const d=parseISO(e.date); return `
        <div class="slot">
          <div class="slot-time">${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}</div>
          <div class="slot-bar" style="background:${m.color}"></div>
          <div class="slot-body">
            <div class="slot-title">${e.who}</div>
            <div class="slot-sub">${e.time} · ${e.title}</div>
          </div>
        </div>`; }).join('') || '<div class="cal-empty">Nada por vir.</div>'}
    `;
    $('#calNextPanel').querySelectorAll('.slot').forEach(s=> s.onclick = ()=> toast('Detalhe do agendamento — disponível na versão completa.'));
  }
